[package]
name = "hk-pipeline"
description = "hackriff pipeline assembly (T-027): capture thread, ring, always-on readers, runtime demod/decode chains, scheduler driving"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Every dependency is recorded in the ADR-0010 ledger (T-027 row). Project crates plus crates
# already in the workspace; no new third-party crate.
[dependencies]
anyhow.workspace = true
# T-199 (ADR-0016): the C15 feature-tree classifier, called per event from `src/classify.rs`.
hk-classify.workspace = true
hk-context.workspace = true
hk-core.workspace = true
hk-demod.workspace = true
hk-detect.workspace = true
hk-dsp.workspace = true
hk-estimate.workspace = true
# T-322: the C36 caller. `src/gnss.rs` is the ONE place that names both hk-gnss and the pipeline,
# and it is not on the blind detection path — hk-detect/hk-core/hk-dsp/hk-estimate still do not
# depend on hk-gnss, which is what crates/hk-gnss/tests/blind_path_boundary.rs enforces (ADR-0018).
hk-gnss.workspace = true
hk-model.workspace = true
hk-plugins.workspace = true
# T-085: recipe runtime (T-088/T-092/T-093, `src/recipes/`).
hk-blocks.workspace = true
hk-recipe.workspace = true
hk-store.workspace = true
hk-stream.workspace = true
# T-071: per-chain thread CPU time (clock_gettime CLOCK_THREAD_CPUTIME_ID).
libc.workspace = true
num-complex.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# T-056: compile the Mac compute providers into hk-dsp. Selection stays at runtime
# (`extra.pipeline.compute`, `--compute`, HK_COMPUTE*); a default build resolves to the CPU.
gpu-wgpu = ["hk-dsp/gpu-wgpu"]
accelerate = ["hk-dsp/accelerate"]

[dev-dependencies]
hk-e2e = { path = "../../tests/e2e" }
# Test-only (T-066 listen lifecycle through the real WebSocket front end).
hk-api.workspace = true
tungstenite.workspace = true
# Test-only: injects repository write failures (already a workspace dependency via hk-model).
rusqlite.workspace = true
