[package]
name = "hk-dsp"
description = "hackriff spectral estimation, noise floor and channelizer (CPU reference, CPU multi-threaded, Accelerate, wgpu GPU; CUDA later)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The multi-threaded CPU provider (rayon) is portable and on by default, so CI runs its
# conformance suite. Accelerate and wgpu providers are opt-in (T-041, ADR-0007).
default = ["cpu-mt"]
# Multi-threaded CPU provider over a shared rayon pool.
cpu-mt = ["dep:rayon"]
# GPU provider over wgpu compute (Metal on macOS, Vulkan on Linux/Jetson). Never on in CI.
gpu-wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# Apple Accelerate (vDSP) FFT provider; macOS only (a no-op elsewhere).
accelerate = []
# CUDA/cuFFT kernels. Builds on the Jetson only (`just deploy-jetson`); never on in CI (T-026).
gpu = []

[dependencies]
hk-core.workspace = true
hk-model.workspace = true
num-complex.workspace = true
rustfft.workspace = true
# T-008: DdcSpec / PfbConfig data specs; T-041: ComputeOptions config spec.
serde.workspace = true
# T-041 providers (ADR-0010 ledger rows).
rayon = { version = "1.12", optional = true }
wgpu = { version = "30.0.1", optional = true, default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "wgsl"] }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.25", optional = true }

[dev-dependencies]
serde_json.workspace = true
# T-008: synthetic scenarios for the SIGNAL-062 / AWARE-036 / SIGNAL-001 channelizer tests.
hk-e2e = { path = "../../tests/e2e" }
# T-041: load average in the compute-provider bench.
libc.workspace = true

[[bench]]
name = "spectral_throughput"
harness = false

[[bench]]
name = "channelizer_throughput"
harness = false

[[bench]]
name = "floor_throughput"
harness = false

[[bench]]
name = "compute_providers"
harness = false
