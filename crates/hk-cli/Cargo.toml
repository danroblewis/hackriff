[package]
name = "hk-cli"
description = "hackriff binaries: hackriffd (daemon) and hk (control CLI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
hk-api.workspace = true
hk-core.workspace = true
hk-dsp.workspace = true
hk-model.workspace = true
# T-027: `hk replay` and `hackriffd` run the composed pipeline.
hk-pipeline.workspace = true
hk-store.workspace = true
# T-037a: SIGINT/SIGTERM handling for graceful shutdown (ADR-0010 ledger).
libc.workspace = true
num-complex.workspace = true
serde_json.workspace = true

[dev-dependencies]
# T-533: inflate `/api/tiles`' gzip answer in the contract test, so the assertion is that a
# transfer coding changed the BYTES and not the JSON.
flate2.workspace = true
# T-079: a plain WebSocket client for the HTTP/WS API contract tests (already a workspace
# dependency of hk-api and hk-pipeline).
tungstenite.workspace = true

[features]
# T-037a: the live HackRF One source (links the system libhackrf through hk-core). Off by default.
hackrf = ["hk-core/hackrf"]
# T-056: the Mac compute providers (wgpu GPU, Apple Accelerate); pick one at runtime with
# `--compute` or HK_COMPUTE. Off by default (the CPU reference).
gpu-wgpu = ["hk-pipeline/gpu-wgpu"]
accelerate = ["hk-pipeline/accelerate"]
