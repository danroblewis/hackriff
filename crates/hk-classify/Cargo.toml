[package]
name = "hk-classify"
description = "hackriff C15 modulation classifier (ADR-0016): classical feature tree with class-conditional densities, chi-square open set and C17 prior fusion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The contract types live in hk_model::classify so the repository can store and rank them without
# a dependency cycle; this crate re-exports them and holds the implementation. T-199 adds the
# estimation inputs (C13 ParameterSet, C14 SymbolParameters) and the spectral helpers.
[dependencies]
hk-model.workspace = true
hk-dsp.workspace = true
hk-estimate.workspace = true
# T-204: the C38 contract types only (Prediction, LoadedModel, the energy calibration). No
# inference runtime comes with them — see `hk-ml`'s manifest.
hk-ml.workspace = true
num-complex.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = []
# T-204: enables the `hk-mlp@1` reference evaluator, which the `dl-eval` binary needs to load a
# trained model. The shadow stage itself, and its "shadow changes nothing" proof, are in the
# default build: they are written against the `LoadedModel` trait, not against any engine.
dl-mlp = ["hk-ml/ml-mlp"]
# T-364 MEASUREMENT ONLY, never shipped and never on in CI: carries the four cyclic line
# significances as four `features@N` dimensions in place of their max (T-310's expansion, refused
# by T-328). It exists so `bin/t364-curves` can re-derive the four-dimension half of the trade the
# user is being asked to rule on. A default build is byte-for-byte unaffected. Tests that enumerate
# `FEATURE_NAMES` (`tests/feature_length_invariance.rs`) do not hold under it, by construction.
cyclic-dims = []

# Loads a trained per-family model, so it needs an evaluator; the exporter does not.
[[bin]]
name = "dl-eval"
path = "src/bin/dl-eval.rs"
required-features = ["dl-mlp"]

[dev-dependencies]
# T-199 OTA evaluation: the real HackRF SigMF fixtures (blind: truth only in assertions).
hk-core.workspace = true
hk-e2e = { path = "../../tests/e2e" }
