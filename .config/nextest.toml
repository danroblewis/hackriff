# T-077: parallel test runner with serial groups.
#
# Default: full parallelism (nextest's usual one-process-per-test model, all binaries
# concurrent). A `heavy-serial` group pulls in the tests that are timing-sensitive or
# contend for shared resources (ports, real OS threads/timing, spawned daemon
# processes) so they don't race each other under load:
#   - tests/e2e (hk-e2e): the harness + M0 acceptance suite drive the whole pipeline
#     end to end and spawn real processes/servers.
#   - hk-pipeline: tests named listen*/retune*/lossless*/refine*/stream* exercise
#     live retune/listen/streaming timing against a running pipeline.
#   - hk-api, hk-cli: bind real TCP/WebSocket ports and (hk-cli) spawn the daemon
#     process, so concurrent runs can collide on ports or process lifecycle.
#   - hk-core: ring_concurrency/ring_stress race real reader/writer threads against
#     wall-clock timing (the "HackRF fake drop/gap" ring test, T-072/T-074 history).
#
# Everything else (hk-model, hk-dsp, hk-detect, hk-estimate, hk-demod, hk-store,
# hk-context, hk-stream, hk-plugins, and the rest of hk-core/hk-pipeline) runs fully
# parallel, up to `test-threads` — see "HOW MANY TESTS RUN AT ONCE" below, which is no
# longer nextest's default of one-per-logical-CPU.
#
# Retries are scoped to the specific tests known to be flaky under load (see CLAUDE.md
# "Build/test/run" and docs/planning-log.md T-072/T-074/T-076 history) so a genuine
# regression in any other test still fails on the first try. nextest reports retried
# tests as "try N/M" in its human and JUnit output.
#
# ---------------------------------------------------------------------------------------
# WHAT THIS GROUP DOES NOT DO (T-383). Read this before adding a name to it.
#
# `max-threads = 1` serialises the group's tests **against each other, inside one nextest
# invocation**. It does nothing about the two things that actually make this machine slow:
#
#   1. the other tests nextest runs concurrently OUTSIDE the group — ~27 of them when
#      T-383 measured this, because test-threads was still nextest's default of one per
#      logical CPU; 7 of them now that T-436 has capped it (below). Fewer, not none: a
#      heavy-serial test still shares the box with everything outside the group.
#   2. the other cargo builds on the box — up to four parallel agents plus the
#      coordinator's gate (CLAUDE.md "Worktree launch step"), which no test-runner
#      setting can see, let alone serialise.
#
# Five "load flakes" were filed against this file (T-344, T-383 and its four recorded
# instances). THREE OF THE FOUR TESTS WERE ALREADY IN THE GROUP when they failed:
# data_path since fc250ff (2026-09-14), decoded_capture since 8866566 (2026-09-15), and
# every hk-cli test since T-077 itself. Membership had not lapsed and would not have
# helped. T-383 measured each of the four and found:
#
#   - hk-cli::api_contract coverage_greys_only…: NOT a load flake at all. It waited 60 s
#     for a quantity whose range is (2 s, 62 s] — the distance to the next epoch-aligned
#     60 s spectrum-history rollup boundary plus `seal_lag` — so it failed on an IDLE
#     machine whenever it started in the first ~2.2 s of a wall-clock minute. Fixed by
#     asking over a window the pyramid can answer (58 s → 0.7 s), not by serialising.
#   - hk-pipeline::data_path never_reports_ready…: a 2 s wall-clock no-progress window on
#     a SUBPROCESS, 15× tighter than the chain's own PLUGIN_WAIT_STALL. Reproduced
#     exactly by starving the plugin; fixed by using the same 30 s the chain uses.
#   - hk-pipeline::presence_push: the failing test was contract A's per-poll extension
#     record, which ADR-0019/T-410 deleted. The file's current test has no wall-clock
#     quantity and published byte-identical output 6/6 at load average 57.
#   - hk-pipeline::decoded_capture: not reproduced in 10 runs at load 46–69; its waits
#     are 90 s against a measured 0.6 s.
#
# So the rule this file can enforce is narrow, and the one that matters is not:
# **a test may not bound a quantity whose natural range it has not measured.** Nothing in
# a nextest filterset can check that — filtersets see only package, binary and test name,
# never what a test waits for — so it cannot be derived, and a longer list here would not
# have caught any of the five. Measure the wait before you bound it; if a bound must grow,
# say which number it is and why.
# ---------------------------------------------------------------------------------------

# =========================================================================================
# HOW MANY TESTS RUN AT ONCE (T-436). Read this before changing the number.
#
# nextest's default is one test per logical CPU — 28 on the dev Mac. That is the right
# number for a suite of CPU-bound unit tests on a box nextest has to itself. This suite is
# neither. A large minority of it starts `hk serve`, spawns plugin subprocesses, drives
# real-time-paced replays and then BOUNDS A WALL-CLOCK LATENCY; and CLAUDE.md's own
# "Worktree launch step" commits up to four concurrent agents at CARGO_BUILD_JOBS=6 — 24 of
# the 28 cores — by design. So nextest schedules 28 wall-clock-sensitive tests onto roughly
# four cores' worth of real capacity. Oversubscription of exactly the resource they measure.
#
# WHAT THIS IS NOT. It is not a fix for a flaky test, and it must not be read as one.
# T-430's conclusion stands: concurrency is not the defect, it is the SAMPLING RATE on
# defects like these. Every failure T-430 and T-433 root-caused was reachable on an IDLE
# machine (the coverage one at 10–20 % per run at zero load), so a lower thread count would
# only have made them rarer and harder to diagnose — which is what happened for months. The
# number below buys back the 7–12 minutes a false red costs per merge; it buys nothing else.
# A test that only passes on an idle machine is still wrong. Keep filing them.
#
# MEASURED, on the dev Mac (28 logical CPUs), `--workspace --exclude hk-e2e`:
#   - default (28) : three consecutive full runs on ONE clean diff, three DIFFERENT
#                    timing-test failures, each green in isolation (T-436). T-426's agent
#                    independently saw four more runs fail a rotating set. T-300's measured
#                    the mechanism: hk-plugins' 43 tests take 8.9 s for all 43 in isolation
#                    and 24–43 s PER TEST inside a concurrent run.
#   - 8            : 1403 s wall (coordinator), against ~1450 s for the default WHEN IT
#                    COMPLETES AT ALL — so the cap is free or nearly so, not a trade. That
#                    it can be free is not a coincidence: the run's critical path is the
#                    `heavy-serial` group, which is max-threads = 1 at any setting, so
#                    capping the parallelism OUTSIDE the group takes contention off the
#                    serial tests roughly as fast as it takes overlap away from the rest.
#                    (An A/B on this box is contended by construction — up to four agents
#                    build on it by design — so treat these as the same number, not as a
#                    12 % win.)
#   - corroborating, from an investigation that was not looking for a thread count at all
#     (T-257, docs/10 §3.4): nextest `LEAK` lines here are a macOS pipe(2)/FD_CLOEXEC race
#     between concurrently SPAWNING test processes, and they scale with spawn concurrency
#     and nothing else. 6 of 10 runs leaked at the default 28; 6 of 12 at 16; ZERO in a
#     full 1754-test workspace run at 8, and zero in 25 hk-plugins runs at 6. A second,
#     independently measured discontinuity in the same place.
#   - 8            : still not zero. One 8-thread run passed 2298/2298 with no exclusions;
#                    a later one failed once (view_pause_keeps_capture, then 0/8 isolated)
#                    and passed 2302/2302 on the immediate re-run at the same 8. Tally:
#                    28 → 3 runs, 3 failures; 8 → 3 runs, 1 failure. BETTER, NOT SUFFICIENT
#                    — which is the point of "WHAT THIS IS NOT" above.
#
# WHY 8 AND NOT num-cpus/4, OR 28. Nothing here scales with the core count; it scales with
# how much of the box is someone else's. On this box that is fixed by policy, not by
# hardware: four agents by design. 8 is the value with evidence behind it, and it sits in
# the same arithmetic neighbourhood as the 6 that T-144 already chose for CARGO_BUILD_JOBS
# and for the per-agent `--test-threads`. CLAUDE.md asked agents to pass `--test-threads 6`
# by hand; nobody did, because `just test-crate` and `just test-one` do not. Putting the
# number here is the one-definition move T-353 made for lint and T-396 for the gate: the
# coordinator's gate, every agent's targeted run and CI now agree by construction.
#
# CI IS A DIFFERENT BOX AND GETS A DIFFERENT NUMBER — see [profile.ci] at the end of this
# file. 8 is calibrated for a 28-core machine with co-tenants; the CI runner is a dedicated
# 2–4 vCPU container with none, where 8 would be 2–4× oversubscription and the stock
# one-per-CPU default is already correct.
# =========================================================================================

[profile.default]
test-threads = 8

[test-groups.heavy-serial]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(hk-e2e)'
test-group = 'heavy-serial'

[[profile.default.overrides]]
filter = 'package(hk-pipeline) and (test(listen) or test(retune) or test(lossless) or test(refine) or test(stream) or binary(scheduler_history))'
test-group = 'heavy-serial'

[[profile.default.overrides]]
filter = 'package(hk-api) or package(hk-cli)'
test-group = 'heavy-serial'

[[profile.default.overrides]]
filter = 'package(hk-core) and (binary(ring_concurrency) or binary(ring_stress))'
test-group = 'heavy-serial'

# Found flaky under measurement (T-077): wfm_refinement_on_the_recorded_station runs a
# wall-clock time-budgeted optimizer (hk-demod's refinement search) and failed with
# stop: TimeBudget / converged: false under heavy machine load (load average ~95, other
# agents building concurrently) when it ran fully parallel. Serialize it rather than loosen
# the time budget in test code.
[[profile.default.overrides]]
filter = 'package(hk-demod) and binary(refine_wfm_real)'
test-group = 'heavy-serial'

# Known timing-sensitive flakes (documented in CLAUDE.md / planning-log): retry once
# so a load-induced hiccup doesn't fail CI, without masking a real, repeatable failure.
[[profile.default.overrides]]
filter = 'test(retuning_into_paging_while_listening_stops_the_audio_and_refuses_new_listeners)'
retries = 1

[[profile.default.overrides]]
filter = 'test(fm_audio_streams_over_websocket_and_a_stalled_tcp_client_never_blocks_the_chain)'
retries = 1

[[profile.default.overrides]]
filter = 'test(hackriffd_stops_gracefully_on_ctrl_c)'
retries = 1

[[profile.default.overrides]]
filter = 'test(racing_readers_get_exact_samples_and_exact_loss_accounting)'
retries = 1

# The plugin-chain binaries spawn decoder subprocesses and replay whole recordings unpaced
# (signal_001_readsb feeds readsb 46 MiB), so they stay in the serial group for CPU, not for
# flakiness. Their start-up races (B0.206: 0 decodes; B0.219: 0/16) were fixed by T-103 (the chain
# ends plugin input with EOF and waits for the plugin to finish instead of a fixed settle window;
# the readsb wrapper waits longer for its Beast connection), so they no longer carry retries.
[[profile.default.overrides]]
filter = 'package(hk-pipeline) and binary(data_path)'
test-group = 'heavy-serial'

[[profile.default.overrides]]
filter = 'package(hk-pipeline) and binary(signal_001_readsb)'
test-group = 'heavy-serial'

# T-092: decoded-stream capture drives a real-time mock pipeline and asserts the recorder
# never stalls it (a stalled disk must drop, not block), so it runs with the other timing tests.
[[profile.default.overrides]]
filter = 'package(hk-pipeline) and binary(decoded_capture)'
test-group = 'heavy-serial'

# Found flaky under load (T-125 runs, 2026-09-15): asserts 400 publishes finish in < 4 s wall time
# with a slow stub disk; took 4.2 s with five cargo jobs competing, passes alone in 2.0 s.
[[profile.default.overrides]]
filter = 'test(a_slow_disk_drops_and_counts_without_blocking_the_publisher)'
test-group = 'heavy-serial'
retries = 1

# Found flaky under load (full check after T-125, 2026-09-15, load ~37): hk-stream connect/close
# flood test saw 4 of 8 expected consumers accepted before its deadline; passed 3/3 alone and in a
# full rerun.
[[profile.default.overrides]]
filter = 'test(p7_connect_close_flood_is_reaped_and_consumers_are_capped)'
test-group = 'heavy-serial'
retries = 1

# T-172: the DC twin lookup scaling test asserts a best-of-N wall-clock ratio (18 h vs 72 h < 8, measured
# 4.6). Wall-clock ratios can skew under parallel load, so serialize it rather than loosen the bound.
[[profile.default.overrides]]
filter = 'test(dc_twin_lookup_scales_n_log_n_over_days)'
test-group = 'heavy-serial'

# T-406: the iterative-scan device test drives a whole mock-device pipeline and waits on
# stream-time progress, so it sits with the other pipeline-driving tests rather than racing them.
# Its replay is unpaced (it asserts what the scan did, not wall-clock pacing) and its waits are
# measured, per the rule above: runs took 2.2 s wall against a 120 s deadline, and wrote 12 scan
# records against a floor of 5.
[[profile.default.overrides]]
filter = 'package(hk-pipeline) and binary(iterative_scan_device)'
test-group = 'heavy-serial'

# =========================================================================================
# THE CI RUNNER IS NOT THIS BOX (T-436).
#
# `test-threads = 8` above is calibrated for the dev Mac: 28 logical CPUs of which up to 24
# are committed to four concurrent building agents by CLAUDE.md policy. None of that is true
# on CI. A GitHub-hosted `ubuntu-latest` runner is a dedicated 2–4 vCPU container with no
# co-tenants, so nextest's stock one-test-per-CPU is already the correct, uncontended
# number there — and 8 would be 2–4× oversubscription, i.e. this change would make CI worse
# on the one machine nobody here can observe. (CI has never been exercised: nothing has been
# pushed. That is a reason to leave its parallelism alone, not a reason to guess at it.)
#
# So CI opts back in to the default explicitly, and `.github/workflows/ci.yml` selects this
# profile with NEXTEST_PROFILE. Custom profiles inherit from `default`, and override lookup
# walks the inheritance chain, so everything above — the heavy-serial group, its membership,
# the existing per-test retries — still applies here. The ONLY thing this profile changes is
# the thread count.
#
# If CI ever shows the same rotating timing failures, the fix is NOT to copy 8 down here:
# it is to find out what that runner's real capacity is and to keep fixing the tests that
# bound unmeasured quantities (T-430, T-433, T-446).
# =========================================================================================

[profile.ci]
test-threads = "num-cpus"
