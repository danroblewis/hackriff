[workspace]
resolver = "3"
members = ["crates/*", "tests/e2e"]
# Spike code (S1..S7) is throwaway and may carry its own Cargo.toml.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
# The project licence is undecided (CLAUDE.md); no `license` key until it is.
publish = false

# Every dependency here is recorded in the ADR-0010 ledger
# (docs/adr/0010-language-and-licence-ledger.md) with its licence.
# T-006: `cargo test -p hk-detect` runs a ≥ 1 MHz·h false-alarm Monte Carlo (≈ 4.5e8 Gamma
# cells) and real-fixture replays through the detector; optimise the detection crate (only) in
# dev/test builds so CI stays modest. Debug assertions and overflow checks stay on.
[profile.dev.package.hk-detect]
opt-level = 3
# T-135 review: baseline folds (packed f32 slot pools, week-long parked tests) are CPU-bound;
# optimise the baseline crates in dev/test builds for the same reason.
[profile.dev.package.hk-store]
opt-level = 3

[profile.dev.package.hk-context]
opt-level = 3

# T-175: the real-time crates (DSP, ring/source, pipeline, demod) at opt-level 2 in dev/test builds
# cut full nextest ~4x and run tests at the speed release/Jetson builds do (which exposed races).
[profile.dev.package.hk-dsp]
opt-level = 2

# T-199: the classifier's evaluation sweeps generate and classify hundreds of synthetic snippets
# per run (filters, IDFTs, moments). Unoptimised they take minutes; at opt-level 2 they take
# seconds, like the other DSP crates above.
[profile.dev.package.hk-classify]
opt-level = 2

[profile.dev.package.hk-core]
opt-level = 2

# T-274: acquisition is an FFT parallel code-phase search — thousands of transforms per run
# across the Doppler × PRN grid. Same reason as the other DSP crates above.
[profile.dev.package.hk-gnss]
opt-level = 2

[profile.dev.package.hk-pipeline]
opt-level = 2

[profile.dev.package.hk-demod]
opt-level = 2

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
# T-020: H3 cell → boundary for the gpsjam adapter. No default features (drops ahash).
h3o = { version = "0.11", default-features = false }
# T-533: `Content-Encoding: gzip` for hk-api's JSON responses. A live `/api/tiles` body is
# measurement text that compresses ~9x, and the route answering 200 kB instead of 1.9 MB is the
# cheap half of making the live edge trackable. Already in the lock file (a tract/ort dependency).
# `zlib-rs` rather than the default `miniz_oxide` backend, and that is load-bearing, not taste:
# `miniz_oxide`'s `CompressorOxide` is built BY VALUE on the caller's stack (~300 kB of Huffman
# tables) and `hk-api` answers every request on a 256 kB connection thread, so the default backend
# aborts the process with a stack overflow on the first compressed answer — measured, in the
# contract test. `zlib-rs` keeps its state on the heap. Pure Rust either way, no C toolchain.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# T-022a: HTTP request-head parsing for the hk-api server (already a tungstenite dependency).
httparse = "1.10"
libc = "0.2"
num-complex = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
# T-022a: synchronous WebSocket framing + handshake key for the hk-api browser bridge (no async
# runtime; the bridge plugs into hk-stream's per-consumer writer threads).
tungstenite = "0.29"
# T-116: history tile compression (codec v2).
zstd = { version = "0.13", default-features = false }
uuid = { version = "1.26", features = ["v7", "serde"] }

hk-classify = { path = "crates/hk-classify" }
# T-218 (ADR-0016 §6): the C38 ML-runtime contract. A stub with no inference engine behind it;
# T-203 adds tract (CPU reference) and the opt-in ort providers.
hk-ml = { path = "crates/hk-ml" }
hk-model = { path = "crates/hk-model" }
hk-core = { path = "crates/hk-core" }
hk-dsp = { path = "crates/hk-dsp" }
hk-detect = { path = "crates/hk-detect" }
hk-estimate = { path = "crates/hk-estimate" }
hk-demod = { path = "crates/hk-demod" }
hk-store = { path = "crates/hk-store" }
hk-context = { path = "crates/hk-context" }
# T-274 (C36): GNSS observables. Deliberately depended on by NOTHING on the blind detection path
# — see crates/hk-gnss/src/lib.rs and crates/hk-gnss/tests/blind_path_boundary.rs.
hk-gnss = { path = "crates/hk-gnss" }
hk-stream = { path = "crates/hk-stream" }
hk-api = { path = "crates/hk-api" }
hk-plugins = { path = "crates/hk-plugins" }
hk-pipeline = { path = "crates/hk-pipeline" }
# T-085 (ADR-0011): decoder workbench contracts.
hk-recipe = { path = "crates/hk-recipe" }
hk-blocks = { path = "crates/hk-blocks" }
