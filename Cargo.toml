[workspace]
resolver = "3"
members = ["crates/*"]
# Spike code (S1..S7) is throwaway and may carry its own Cargo.toml.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
# The project licence is undecided (CLAUDE.md); no `license` key until it is.
publish = false

# Every dependency here is recorded in the ADR-0010 ledger
# (docs/adr/0010-language-and-licence-ledger.md) with its licence.
[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.26", features = ["v7", "serde"] }

hk-model = { path = "crates/hk-model" }
hk-core = { path = "crates/hk-core" }
hk-dsp = { path = "crates/hk-dsp" }
hk-detect = { path = "crates/hk-detect" }
hk-estimate = { path = "crates/hk-estimate" }
hk-demod = { path = "crates/hk-demod" }
hk-store = { path = "crates/hk-store" }
hk-context = { path = "crates/hk-context" }
hk-api = { path = "crates/hk-api" }
hk-plugins = { path = "crates/hk-plugins" }
