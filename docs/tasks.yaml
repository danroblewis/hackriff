  - id: T-300
    title: 'T-267 confirmer uses CRC-16/CCITT-FALSE, but real P25 TSBKs use the AUGMENTED CRC-CCITT - on the first real capture this will look like a demodulator fault'
    milestone: M4
    priority: medium
    status: done
    deps: [T-268]
    parallel_group: M4A
    core_interface: true
    acceptance: 'T-268 verified that P25 uses the augmented CRC-CCITT (init 0, final XOR 0xFFFF) and NOT CRC-16/CCITT-FALSE, which many references repeat. T-267 uses CCITT-FALSE. T-268 deliberately did not change it, and that restraint was correct: the framing is simplified in three other ways (trellis, interleaving, status symbols), so fixing one of four buys no compliance and would only make the gap harder to see. Fix all four together or none. The DANGEROUS property is the failure mode, not the defect: with the wrong CRC essentially every real TSBK fails while the trellis reports a clean metric, so it presents as a demodulator or front-end fault and will burn a debugging session on the wrong layer. Acceptance: all four simplifications resolved together against a real capture, OR - if that stays out of reach - a test that asserts the current CRC choice is the simplified one, so the assumption is stated by the suite and cannot be silently inherited'
    commit: 664570d
    result: |
      DONE - outcome 2, as the ticket anticipated, and the survey is the durable half.
      ALL FOUR SIMPLIFICATIONS, with file and line, all in crates/hk-detect/src/trunk/:
        1. CRC variant - confirm.rs:409 (CCITT-FALSE), mirrored py/hkpy/synth/trunking.py:76. Real is
           the AUGMENTED CRC-CCITT (init 0, final XOR 0xFFFF) = catalogued CRC-16/GSM, check 0xCE3C.
           Two constants. THIS IS THE TRAP: it looks like a one-line fix.
        2. No trellis code - confirm.rs:52-56 reads the 12-byte TSBK straight off the air as 48
           dibits. TIA-102.BAAA-A Annex A wants rate-1/2, 48 information dibits -> 98 channel dibits,
           and NOT the (7,5) NASA code.
        3. No deinterleaver - confirm.rs:601 packs in arrival order; real is a 98-dibit block
           interleaver over the trellis-coded dibits.
        4. No status symbols - confirm.rs:475 reads contiguously from the sync; real frames carry a
           2-bit status symbol every 35 data dibits, stride 36.
        Plus a FIFTH the ticket did not list: a compliant frame carries a 64-bit NID (NAC + DUID under
        BCH(63,16,11)) between sync and payload, which this build neither reads nor skips.
      THE FINDING THAT SHARPENS THE DIAGNOSIS: the failure is not statistical. The two trailers differ
      by a constant 0xFFFF and a CRC is LINEAR in that difference, so the data bytes do not enter into
      it - the residue is a CONSTANT 0x99F6, verified over 20000 random payloads. So it is not
      "essentially every real TSBK fails", it is EVERY correctly-formed one, deterministically. A
      decoder seeing a MIXTURE of pass and fail is therefore not hitting this bug.
      Why outcome 2, checked not assumed: there is NO off-air P25 recording in the repo - fixtures/
      holds FM, ISM, ADS-B and urban HackRF captures only, and every trunking fixture is synthetic
      from this same simplified framing. Closing all four synthetically is ~1-2 days but would be
      SELF-CONSISTENT BY CONSTRUCTION, since the trellis and interleaver are transcribed tables and a
      misreading shared by encoder and decoder passes both suites while the air still fails. That is
      T-299's hole, so outcome 1 should be scheduled as "real capture, or T-299's independent oracle".
      Four tests under a banner that says what the failure looks like from outside: the trellis - the
      layer anyone checks first - reports a clean metric while every TSBK fails, so it presents as a
      demodulator or front-end fault. Non-vacuity by mutation: swapping in the augmented CRC makes the
      test fail NAMING the assumption and takes a_real_control_channel_is_confirmed down with it,
      which is the four-move-together property made visible.

