  - id: T-308
    milestone: M4
    title: A followed transmission still running when the buffered window ends is written open, and a later
      pass cannot continue it
    status: todo
    priority: normal
    deps:
    - T-269
    parallel_group: M4B
    model: opus
    acceptance: 'T-269 follows a grant onto a channelizer output and closes the call on a 90 ms silence
      timeout derived from a keyed P25 transmitter''s 180 ms LLDU cadence. A transmission still keyed when
      the BUFFERED WINDOW ends is written open with reason window-ended, and a later pass 10 s away cannot
      continue it - cross-pass call continuation is unimplemented, and T-269 documented it rather than faking
