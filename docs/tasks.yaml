      arg-max was then gfsk 19/22 and top-1 fell 0.917 -> 0.375. THE DIMENSION: sps and the
      transmitter's h do not determine the deviation this receiver measures - a constraint costing
      more residual than its own description length is a constraint on the wrong quantity.
      psk-qam/qam16 was NOT THE DENSITIES - this contradicts my brief. They had it right 21/24 and
      the tree called it at 0.833; the verifier's ALRT dropped it to 0.083. The ALRT takes N0 from
