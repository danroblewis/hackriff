      BOTH TRUTHS FLIP TOGETHER and NO VALUE IS RIGHT ON BOTH. THE DIMENSION: snr_db does not
      measure the symbol-decision residual - above the crossover the tiny N0 makes the mixture a
      nearest-point test and the denser lattice wins BY CONSTRUCTION; below it the -ln M term
      dominates and the sparser one wins. Neither regime reads the data; not a threshold to tune.
      FIXES: fsk routes through the densities like analog/psk-qam; the one conjunct that worked
      (h ~ 0.5) is kept as `apply_msk_index` because mod_index_h is not a features@1 dimension so
      no density can score it (genuine MSK reads h in [0.500, 0.533] at every SNR on dev). The
      verifier declines msk, qam16 and qam64, stays right on the pair ADR-0016 §4.5 names
      (2fsk 21/23, gfsk 20/21), and gives up nothing on bpsk/qpsk/8psk.
      MOVED: gfsk 0.333/0.417 -> 0.750/0.750 (wrong 0.667/0.583 -> 0.250); msk 0.333/0.417 ->
      1.000/0.833 (wrong 0.667/0.500 -> 0.000/0.083); qam16 0.083/0.083 -> 0.833/0.833 (wrong
      0.917/0.833 -> 0.167/0.083). fsk class top-1 0.667 -> 0.896, wrong 0.3125 -> 0.0833;
      psk-qam 0.758 -> 0.900, 0.1833 -> 0.0417; analog unchanged. No abstention traded.
      THE ONE LOSS, STATED: qam64 at gate+10 drops 0.833 -> 0.750 (wrong 0.083 -> 0.167) - the
      verifier's bias toward the denser constellation had been covering it.
      Every family-level figure BIT-IDENTICAL, verified T-419-style (stashed the whole diff,
