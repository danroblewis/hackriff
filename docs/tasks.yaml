  - id: T-414
    title: hk-gnss's own default acquisition threshold still finds 32 satellites in noise
    milestone: M5
    status: done
    priority: high
    parallel_group: M5A
    core_interface: true
    model: opus
    deps: [T-322]
    acceptance: |
      T-322 found this while wiring the caller and fixed it AT THE CALLER, deliberately
      leaving hk-gnss's own default alone ("this is the caller sizing its own search").
      That was the right call for that ticket and it leaves a loaded gun in the crate.
      THE DEFECT: AcquisitionConfig's default peak-to-mean bar of 2.5 is sized for a
      short profile, but the number of code-phase cells is the rate's samples per 1 ms
      period - 2046 at minimum rate, 4000 at 4 Msps, 20000 at 20 Msps. At the higher
      rates the bar is far below the noise-only maximum, so ACQUISITION RETURNS ALL 32
      SATELLITES OUT OF PURE NOISE. T-322 measured exactly that before fixing its own
      call site.
      WHY IT MATTERS EVEN THOUGH THE ONE CALLER IS NOW CORRECT: a default that is wrong
      at most sample rates is a trap for the second caller, and the failure is SILENT
      and INVERTED - it reports an intact constellation, so a jamming assessment built
      on it never fires. A capability that always says "fine" is worse than one that is
      absent, because absence is visible.
      THE FIX SHAPE, per T-322's own: compute the bar from profile length and
      non-coherent block count for a STATED false-alarm rate, and check it against a
      Monte Carlo of noise-only Gamma profiles rather than a chosen constant. That work
      exists in hk_pipeline::gnss::acquisition_threshold - the question is whether it
      belongs in hk-gnss as the default (so no caller can get it wrong) or whether the
      crate should REFUSE a config whose bar is unsound for its rate.
      Prefer refusing over defaulting if the two conflict: a wrong number that runs is
      what this ticket is about.
      Control: noise-only IQ at 2, 4 and 20 Msps yields ZERO acquisitions at the default;
      planted PRNs at 20 dB under the floor are still recovered by number.
  - id: T-413
    title: Is a detected end provisional and revocable, and if so over what silence?
    milestone: M2-hardening
    status: done
    priority: high
    parallel_group: PIPE
    core_interface: true
    model: opus
    deps: [T-410]
    notes: |
      T-410 satisfies the line for every silence SHORTER THAN THE IDLE GAP: no END is
      emitted, so there is nothing to revoke. The question is whether it must hold for
      LONGER silences too - i.e. whether an emitter that goes quiet and returns should
      have its presence intervals JOINED after the fact.
      THE CONFLICT, and it is real rather than a wording problem: joining across longer
      silences contradicts ADR-0017's settled reading of the ISM case, where fifty 30 s
      bursts are FIFTY INTERVALS and not one - which has a test. And T-410's own
      observation is the sharp end of it: ANY WINDOW WIDE ENOUGH TO REJOIN A REAL
      DROPOUT IS WIDE ENOUGH TO SWALLOW A BURST CADENCE.
      So this is not "add revocation". It is: what is a dropout, as distinct from a
      signal that stopped? Plausible answers the user might choose between - the same
      emitter identity resuming within some multiple of its own established cadence
      (which makes the window a property of the emitter rather than a constant); or
      never, with a reopen always drawing a second box and the gap shown, which is what
      T-410 shipped.
      Whatever is chosen must keep the property T-410 established: the silence is never
      CLAIMED. Drawing two boxes with a visible gap already tells the truth; joining
      them would assert continuity through air that was measured empty.
      USER RULING 2026-09-17 - ANSWERED, UNBLOCKED:
      YES, a detected end is REVOCABLE. Reuse the EXISTING idle-gap constant as the
      silence tolerance - clamp(2 x revisit_period, 1 s, 60 s), the same one
      presence/confidence already uses. NO NEW PARAMETER.
      THE RULE: if the signal resumes within idle-gap of the detected end, NULL THE END
      and keep the ONE interval open (same row, per T-262 revival). If the silence
      exceeds idle-gap before it resumes, the end STANDS and a resumption is a
      genuinely NEW interval/event.
      This matches the unified model: assume ongoing to the live edge, a detected end
      caps it, a resumption within tolerance re-opens it. The user may override the
      tolerance later.
      ONE AMBIGUITY THE IMPLEMENTER MUST RESOLVE FIRST, flagged by the coordinator
      rather than guessed - it decides whether revocation can ever fire at all:
      T-410 emits END only AFTER a full idle-gap of silence (presence.rs: an interval is
      open while `now - t_end <= idle_gap`). So by the time an END exists, the silence
      since the MEASURED end is ALREADY exactly idle-gap. Measuring the revocation
      window from the measured end therefore makes it unreachable: any resumption after
      an END is by construction more than idle-gap after the measured end.
      The only reading in which the rule has effect is that the window runs from THE END
      EVENT (the decision instant), giving:
        silence < idle-gap        -> no END is emitted at all (already true, T-410)
        idle-gap .. 2 x idle-gap  -> END fired, then REVOKED, one interval
        silence > 2 x idle-gap    -> END stands, resumption is a new interval
      Adopt that reading unless the user says otherwise, and STATE IT IN THE ADR, because
      it means the effective join tolerance is 2 x idle-gap even though only one constant
      exists.
      THE PROPERTY THAT MUST SURVIVE (T-410, ADR-0017): the silence is never CLAIMED.
      A revoked end joins one interval across a gap the receiver was LISTENING through
      and measured empty - so the joined interval asserts presence through measured
      silence, which is exactly what the open-cap rendering exists to avoid asserting.
      Decide how the join is DRAWN: the honest option is that the rejoined span keeps
      the open-cap treatment (lighter fill, broken border) over the revoked gap, so the
      row is one interval but the silence still reads as unmeasured-through rather than
      solid.
      ADR-0017's ISM reading must stay green: fifty 30 s bursts are FIFTY intervals.
      With contiguous coverage the idle gap is 1 s, so a 30 s cadence is far outside
      2 x idle-gap and unaffected - confirm that test still passes rather than assuming.

  - id: T-415
    title: The M3 baseline quoted in briefs was wrong for several hours - known top-1 is 0.935, not 0.948
    milestone: M3
    status: done
    priority: normal
    parallel_group: DOCS
    deps: [T-404, T-311]
    notes: |
      COORDINATOR ERROR, caught by T-311 and confirmed by measurement on main.
      T-404 reported "top-1 0.9187 -> 0.9480" and I carried 0.9480 into every
      subsequent brief as the do-not-regress baseline. Main measures known top-1
      0.935 (acceptance_m3 prints "known top-1 at gate+5dB | 0.935"), with unknown
      recall 0.9596 and false-known 0.0404. T-311 ran main under stash and got the
      same 0.9345 / 0.9861 / 0.0333, then flagged the mismatch in its report.
      WHY IT MATTERS: briefs say "no floor moves" against a stated baseline. A wrong
      baseline means an agent can read a real regression as an improvement, or spend
      effort chasing a gap that was never there. Two agents received 0.9480.
      WHAT TO ESTABLISH: which population and which SNR band each printed number
      covers. The m3 output already distinguishes at least two readings - the FULL
      held-out grid (396 snippets, all 11 generators) versus the 216 snippets of the
      six generators ADR-0016 section 7 enumerates, which read 0.9907 / 0.0093 and are
      recorded but NOT used. If top-1 has the same ambiguity, T-404's 0.9480 may be a
      different true number rather than a wrong one - determine which, and say so.
      THEN: state ONE canonical set in ADR-0016 section 7 with its population named,
      so a brief can quote it without re-deriving. Every task that says "no floor
      moves" is quoting something; that something should exist in one place.
      Low effort, high leverage: this is bookkeeping that prevents a class of silent
      misreading, not a code change.
      SECOND INSTANCE, MEASURED (T-419, 2026-09-17): I circulated unknown recall 0.9596 /
      false-known 0.0404 in briefs after T-311 had already moved them to 0.9520 / 0.0480.
      T-419 caught it properly - it stashed its ENTIRE diff, re-ran on merged main, and got
      the identical 0.9520 / 0.0480, so it could say the discrepancy predated its work
      rather than guessing. That is the method this ticket should institutionalise: a brief
      quoting a floor should quote ONE canonical set that is re-derivable, and an agent that
      sees a mismatch should stash-and-measure rather than assume either side.
      Two errors now, both mine, both in the same field.
    commit: c6798c9
    result: |
      DONE, and the answer was NEITHER of the two failure modes the ticket posed.
      I had framed it as "misreading, or two numbers sharing a name". It was a third:
      T-415 checked out the exact commit T-404 merged (3d37ccf), ran `just acceptance-m3`, and
      measured 0.9345 - on code BYTE-IDENTICAL to T-404's own branch tip (b3fac0e) for every
      file in hk-classify and hk-estimate (`git diff b3fac0e 3d37ccf -- crates/hk-classify
      crates/hk-estimate` is empty), with the harness deterministic to 4 dp over two runs.
      So 0.9480 was REAL and ACCURATELY TRANSCRIBED, but it was a PRE-COMMIT measurement that
      predated the last edit folded into its own squashed merge commit and was never re-run
      after it. THE MERGED CODE NEVER SCORED 0.9480 - the number described a tree that never
      became main.
      That is a failure mode no careful reading catches, because nothing in the report is wrong.
      The only defence is RE-DERIVING AT MERGE TIME rather than trusting a commit message's
      figure, which is what §7.1 now tells a brief to do.
      ADR-0016 §7.1 states ONE canonical set with a population named per figure, plus the
      re-derivation command (`just acceptance-m3`) and the commit the values are pinned to.
      It keeps the distinction the two failure modes need: known top-1/top-2 has NO population
      split, while unknown-recall/false-known DOES - the full 396-snippet held-out grid is the
      gate's ruling, and the 216-snippet reading over the six generators §7's prose enumerates
      is recorded but NOT USED. Quoting that one as the M3 number is the population-ambiguity
      failure mode, distinct from a stale number.
      §7.1 also writes down T-419's stash-and-measure protocol as standing practice: stash the
      diff, measure against the merge base, and report WHICH of the three failure modes applies
      rather than assuming either side is right.
      Scope stayed bookkeeping - no threshold or classifier code touched.

  - id: T-416
    title: A real mono FM station is not recognised as WFM, and the rejection leaves no trace
    milestone: M3
    status: done
    priority: high
    parallel_group: M3A
    core_interface: true
    model: opus
    deps: [T-403]
    acceptance: |
      Diagnosed by T-403 and deliberately not fixed - mode rules and chain records are
      hk-demod's, which it was fenced out of. It is the last thing holding T-402.
      THE MEASUREMENT:
        analog probe 101.3000 MHz: mode unknown (0.75), pilot Some(false) -> stop
        (OBW99 Some(149890) Hz, "no rule matched confidently (OBW99 149890 Hz)")
      A REAL 150 kHz MONO BROADCAST FM STATION IS NOT RECOGNISED AS WFM. Two things are
      wrong and they should be weighed separately.
      (1) THE RULE. 149890 Hz sits inside WIDEBAND_FM_OBW_HZ's [106e3, 400e3], so width
      alone does not reject it - the mode came back `unknown` at 0.75 confidence with
      pilot Some(false). A mono station HAS no pilot, so requiring one to call something
      WFM makes every mono broadcaster unrecognisable. Establish whether the pilot is
      being used as evidence FOR wfm (fine) or as a REQUIREMENT (not fine).
      DO NOT MOVE WIDEBAND_FM_OBW_HZ: T-316 derived 106 kHz as 2 x 53 kHz from the
      stereo subcarrier top after declining a value that turned the suite green, and
      T-402 already established the fixture was what was wrong, not the constant.
      (2) THE SILENCE, which is the deeper defect. A REJECTED MODE WRITES NOTHING. So
      T-398's standard - "short evidence leaves a LOG, not a promotion", the user's own
      instruction - fails for want of the log, and the assertion
      confirm_latency.rs:143 ("the measurement that declined to confirm is still
      recorded") is red. A refusal that leaves no record is indistinguishable from
      never having looked, which is the same class as Coverage::Unobserved vs quiet and
      BiasTee::Unknown vs off. FIX THIS EVEN IF (1) TURNS OUT TO BE CORRECT BEHAVIOUR:
      a mode that declines should say so, with its measurement.
      Control: a genuinely unrecognisable emission still declines, and still logs.
      Do not make (1) pass by lowering a confidence threshold - if 0.75 is the right
      confidence for "unknown", the question is why a 150 kHz FM carrier produces it.
    commit: 5017fe1
    result: |
      FIXED, and the cause was a 110 Hz miss. The WFM candidate is raised on width alone so the
      pilot never gated CANDIDACY - the confidence ladder did. A 150 kHz mono station measured
      149890 Hz OBW, missed wfm_mono_min_obw_hz by 110 Hz, fell to the 0.25 arm, landed under
      min_decide_confidence 0.35, and reported unknown at 1.00 - 0.25 = 0.75. Envelope was
      perfectly constant (-3.6e-7); nothing else was wrong. For ANY pilotless station between the
      120 kHz candidate edge and 150 kHz the pilot was the only route to a decision.
      NOT retuned - it cannot be derived (T-316's 106 kHz comes from the L-R subcarrier; mono has
      no equivalent, a quiet mono station is just narrower). Replaced by the other structural fact
      about the service: 47 CFR 73.310(a) / ITU-R BS.450 put the main channel at 50 Hz-15 kHz and
      L-R at 23-53 kHz, so `baseband_fraction` asks what fraction of multiplex power is in the
      programme channel. Mono ~1 by definition, stereo ~1/2 (recognised by its pilot instead).
      Measured off the discriminator the pilot check already runs, both bands fixed BY THE SERVICE
      - which matters because FM output noise rises as f^2 and a Nyquist-wide denominator reports
      the sample rate (0.88 over +/-500 kHz vs 0.999 over the emission's own +/-90 kHz).
      Threshold 0.95 from 47 CFR 73.319(d)'s 20% injection cap. min_decide_confidence untouched.
      THE CONTROL: a measured baseband that is NOT a programme channel now LOWERS confidence to
      0.2 instead of letting width carry it. Width alone used to be enough, which called a 180 kHz
      4-CPFSK data link broadcast FM - being wide and constant-envelope is what every
      constant-modulus digital emission is. Sweep carries both halves blind: wfm75k-mono
      0.996-1.000 must be WFM from 20 dB; 4fsk-wide 0.29-0.42 must NEVER be WFM at any SNR.
      Documented cost: a stereo station whose pilot is not found at all now abstains.
      THE SILENCE: `write_declined` writes the Demodulation and nothing else - mode, parameters,
      the absent lock, the window measured over. Route C refuses such a row on its own terms.
      Filing it needed a seam: a chain attaches on the TRACKER's confirmation and probes ~1 s in,
      routinely before the inventory has offered that track a row (verified - emitter_of_track and
      a fingerprint match both returned None), so Inventory::chain_measurement holds it until bind
      or until the track closes. It creates nothing. Run summary now reads "8 mode rejected
      (8 recorded)" on a real FM capture.
      TWO REAL BUGS FOUND ON THE WAY, both outside the ticket: `stored_detection` re-entered
      Shared::repo's plain Mutex and SELF-DEADLOCKED the whole pipeline; and the declining chain
      held its ChainReader across the write, back-pressuring the capture thread in lossless replay
      (which shrank T-417's retune seam gap by two row periods).
      Coordinator verification: full suite 2274/2274 on the merge, lint + acceptance-ci green.

  - id: T-417
    title: A retune tears the stream down; consumers should keep receiving across it
    milestone: M2-hardening
    status: done
    priority: high
    parallel_group: PIPE
    core_interface: true
    model: opus
    deps: []
    acceptance: |
      USER 2026-09-17 (message reached this session TRUNCATED at the front; what
      arrived is below, verbatim, and is unambiguous about the requirement):
        "...gap is fine), so connected consumers keep receiving after the retune; and
         the UI spectrum websocket client should reconnect gracefully across a
         re-plumb rather than erroring."
      So: A RETUNE MUST NOT DISCONNECT STREAM CONSUMERS. A settle gap is fine - a
      break in the data is expected and honest while the front end moves - but the
      CONNECTION should survive, and the UI's spectrum websocket should reconnect
      gracefully across a re-plumb rather than erroring.
      WHY THIS IS HIGH AND WHY IT IS URGENT NOW: this session has just shipped four
      ways to retune - T-343's gated device action, T-392's region-select-on-release,
      T-409's nudge buttons (filed), and the frequency navigator's offer. Every one of
      them is unpleasant to use if the stream dies each time. The retune features and
      this defect are the same user-facing experience.
      WHAT TO ESTABLISH FIRST: whether the teardown is the re-plumb itself
      (Pipeline::replumb takes the still-open device out of the slot and calls
      start_segment, which builds new readers) or the client erroring on a gap it
      should tolerate. T-399 documents that replumb reuses the SAME still-open device,
      so the device is not closing - which points at the readers and their publishers.
      HONESTY CONSTRAINT: a gap in the data is real and must stay visible. Do not paper
      over the settle gap by holding the last frame or interpolating - the coverage
      rule (grey means genuinely unobserved) applies to time as much as frequency, and
      T-410's open cap is the precedent for drawing an absence rather than hiding it.
      The connection persists; the data honestly gaps.
      Note the stream contract already distinguishes these: publisher backpressure
      drops a slow consumer deliberately (T-388), which is NOT this - that is a policy
      about a consumer that cannot keep up, not about the producer retuning.
  - id: T-418
    title: A narrower selection gives no more detail, because detail must come from resolution not from an impossible capture
    milestone: M2-hardening
    status: done
    priority: high
    parallel_group: PIPE
    deps: [T-417]
    notes: |
      USER 2026-09-17, in two parts, both received in full.
      THE BUG: when the user selects a SMALLER frequency range, THE SDR DOES NOT
      INCREASE PRECISION/DEPTH. It stays at the coarse ~500 kHz / 4096-bin view around
      101.3 instead of zooming in for detail.
      THE DEVICE LIMIT THAT SHAPES THE FIX: the HackRF's minimum sample rate is
      2 Msps, so A SUB-2-MHz WINDOW CANNOT BE CAPTURED. There is no narrow capture to
      ask for.
      THE FIX, both halves:
      (1) A narrow selection SNAPS TO THE NARROWEST ACHIEVABLE instantaneous window -
          drop the sample rate toward 2 Msps, CENTRED OFF-DC ON THE TARGET.
      (2) AND INCREASE SPECTRAL RESOLUTION for that slice - a larger FFT and/or a DDC
          channel zoom - so a tight selection shows finer Hz/bin detail.
      The principle, in the user's words: DETAIL ON A NARROW VIEW COMES FROM
      RESOLUTION/DECIMATION, NEVER FROM AN IMPOSSIBLE NARROW CAPTURE.
      COORDINATOR NOTES, to save rediscovery:
      - HALF OF (1) MAY ALREADY EXIST. T-392 built retunePlan with smallestCoveringSpan
        - the least achievable span that covers a region, proven against an unsorted
        ladder where the NEAREST entry covers nothing - and it snaps the centre through
        T-341's grid. Check what it does for a sub-2-MHz region before rebuilding: the
        gap may be only that nothing then raises resolution.
      - "CENTRED OFF-DC ON THE TARGET" IS T-409's POINT, arriving from the other
        direction. A signal at the exact centre lands on the DC/LO-leakage spike and
        cannot be cleanly demodulated; T-317 and T-382 both measured that spike. So the
        off-DC offset is not a nicety - a narrowing that centres the target perfectly
        would put it on the worst part of the band.
      - The honesty rule applies to the resolution half: T-334's resolution.source
        already distinguishes live-IQ-backed detail from survey/history overview, and
        the UI must never imply detail the front end did not capture. A DDC zoom gives
        REAL finer Hz/bin from the same samples; interpolating a coarse FFT would not,
        and must not be what happens.
      Ties to T-341 (achievable-config snapping).
      UNBLOCKED 2026-09-17: T-417 merged (d8eec14). A retune now keeps connected
      consumers connected - the fault was not the re-plumb but spectrum::reoffer
      finishing the publisher on a header-key change, plus a client that treated only
      the FIRST text message as a header. Both fixed, so every narrowing this ticket
      performs is now exercisable.
    commit: af20ad3
    result: |
      FIXED. The user's report was exact, and the cause was a proxy test.
      `freqZoomTarget` asked whether the selection lay INSIDE the tuned window and
      returned {kind:"view"} when it did - a pure display zoom, no rate change, no
      transform change. Inside-vs-outside gets narrowing backwards: a 200 kHz drag at
      101.3 in a 2.4 MHz window is exactly the case that should buy detail and was the
      case guaranteed not to.
      Half of part 1 was ALREADY RIGHT and left alone: smallestCoveringSpan(HACKRF,
      200e3) -> 2 000 000, the continuous-rate branch lifting the need to the 2 Msps
      floor. It cannot do better and shouldn't. Nothing called it.
      Two more measured before the fix: the centre landed 10.7 Hz from the target (the
      selection sitting essentially ON DC - T-409's problem arriving as predicted), and
      at a fixed 4096-point FFT a 200 kHz and a 20 kHz selection both got 488.3 Hz/bin.
      RESOLUTION COMES FROM A LONGER TRANSFORM, not a narrower capture.
      POST /api/control/display {fft_size} already accepts up to 65536 and the spectrum
      reader rebuilds its STFT at the next chunk boundary without a restart - genuinely
      more samples, measured not interpolated. 488 -> 122 Hz/bin for the reported case
      (5x), 488 -> 30.5 Hz/bin for a 20 kHz selection (19x), with NO crates/ change.
      The DDC alternative was measured and rejected FOR NOW: hk-dsp's Ddc exists but no
      control-API surface spawns a DDC + spectrum tap and tap_spectrum's FFT is
      hard-coded at 4096. That is a separate task crossing hk-pipeline's recipe layer.
      OFF-DC PLACEMENT IS DERIVED, not picked: ideal is span/4, because the usable
      half-band runs DC (0) to Nyquist (span/2) with a hazard at each end - the LO spike
      and the anti-alias roll-off - so the midpoint is maximally far from both. Bounded
      by (span-need)/2 and by snapCenter's up-to-half-a-step move, out of the same slack.
      THE WINDOW IS NEVER WIDENED TO BUY THE DODGE - that would cost the resolution the
      path exists to gain - so a selection wider than half the window reports
      clearsDc: false and the UI says DC falls inside it. On a replay the offset is 0,
      derived from `controllable`: no oscillator of ours, nothing to dodge.
      HONESTY CONTROL: DetailPlan.capped is true when fft_size_max bound the answer, and
      the readout then says bins are REPEATED to fill the pixels beyond it - which is
      what waterfall.ts does (nearest-repeat, never interpolate), the same distinction
      T-420 drew on the time axis. Both directions asserted.
      The geometry test is replaced by three SELF-LIMITING reasons - `reach` (not wholly
      inside), `narrow` (a narrower achievable window exists), `dc` (DC inside the
      selection and a placement clears it). Self-limiting, so re-selecting the same
      region settles. When none holds the radio is untouched and only the transform
      moves, preserving T-392's "inside reaches nothing" rather than trading it away.
      The display call goes AFTER the retune: a rate change re-plumbs, so sizing the FFT
      first would rebuild it under a rate about to change.
      T-340's control intact (no pan, no wheel reaches a device route); gesture path
      untouched, so T-407's drag threshold and cross-axis travel are unchanged.
      AGENT'S FLAGGED JUDGEMENT CALL: a narrow selection inside the window now always
      retunes when a narrower achievable span exists, even for a modest 2.4 -> 2.0 MHz
      gain, costing a real settle gap on each such drag. That follows the instruction
      verbatim ("snaps to the narrowest achievable instantaneous window"). If it proves
      too eager in use the fix is a THRESHOLD on `narrow`, not a change to the
      arithmetic.

  - id: T-419
    title: Two coverage folds round partial coverage UP, so half-scanned spectrum reads as fully covered
    milestone: M2-hardening
    status: done
    priority: high
    parallel_group: STORE
    core_interface: true
    model: opus
    deps: [T-408]
    acceptance: |
      Found by T-408 while designing the tile pyramid. IT IS A LIVE DEFECT IN SHIPPED
      CODE, not a design note, which is why it is its own ticket.
      (1) Tile::fold_child sets `self.obs_s[i] = best_obs` (hk-store history/tile.rs
      ~877-913), where best_obs is the MAX across the f_factor child frequency cells.
      A parent whose left half was observed for the full minute and whose right half
      was NEVER OBSERVED reads FULLY COVERED. At f_factor 2 over four folds, a level-4
      cell can claim full coverage on ONE SIXTEENTH of its frequency extent.
      CORRECT RULE, per T-408: sum obs_s over children and divide by the parent's own
      extent. observed_s is foldable; DUTY IS NOT.
      (2) OverviewCell::fold does `coverage += ...` then `/= sources` - a mean over
      source cells, exact only when they are equal-duration AND wholly inside the
      output cell. The second fails because `overview` lays a fractional grid and
      assigns a source cell to every output cell it overlaps, UNWEIGHTED: a 1% overlap
      counts as much as 100%.
      WHY THIS IS THE SAME DEFECT AS T-397, one axis over: there the fold WAS a max at
      every level and the INPUT was a Welch average, so a burst lost 30 dB before the
      first max ran. Here the input is honest and the FOLD rounds up. Both produce a
      number that claims more than was measured, and both are invisible from the wire,
      which declares its semantics correctly in each case.
      WHY IT MATTERS NOW: it is currently fit for its purpose - a narrow-band "is there
      history here" query, where an optimistic answer costs little. It is FATAL to the
      big view (T-408), whose entire point in the user's words is "mostly GREY =
      unobserved, and that grey is the point: you see WHERE you have scanned". A
      pyramid founded on a fold that rounds up paints the spectrum as scanned. T-408's
      section 7 puts this at step 3, BEFORE the view scheme, for that reason.
      CONTROL, and it is the one T-408 named: prove a level against LEVEL 0, never
      against its parent - a parent-vs-child assertion proves only that the fold is a
      max, which is T-397's exact blind spot.
      Check what currently depends on the optimistic answer before changing it: the
      narrow-band query this was built for may have calibrated around it.
  - id: T-420
    title: The waterfall truncates to a sliver instead of scaling to the selected span
    milestone: M2-hardening
    status: done
    priority: high
    parallel_group: UI
    core_interface: true
    model: opus
    deps: [T-334, T-338]
    acceptance: |
      USER, re-sent 2026-09-17 - THE EARLIER VERSION NEVER BECAME A TICKET and was
      most likely lost to the message truncation that has hit this session repeatedly.
      Filed now.
      THE BUG: the timeline (left time navigator) selector shows only a TINY SLIVER of
      data in the waterfall when a range is selected; the rest is empty.
      THE FIX, against the CLAUDE.md invariant "Time is zoomable; the waterfall scales
      to the selected span":
      (1) THE DEFAULT time span must FILL the waterfall height (roughly rows /
          rows_per_s), not a few-second sliver.
      (2) SELECTING A RANGE re-scales the waterfall so that span FILLS the display -
          span-matched resolution, which T-334 ALREADY SERVES.
      Likely UI-only; confirm with just gate rather than assuming.
      THE INVARIANT NAMES THIS EXACT FAILURE. CLAUDE.md: "the waterfall's time
      resolution (pixels / rows per second) is a function of the chosen span, and the
      backend serves history at a resolution matching it (the tiered spectrum-history
      pyramid), so ZOOMING IN TIME RE-SCALES RATHER THAN TRUNCATES." The bug is that it
      truncates.
      WHAT ALREADY EXISTS, so this is wiring rather than new machinery:
      - T-334 serves span-matched resolution and distinguishes live-IQ-backed detail
        from survey/history overview via resolution.source.
      - T-342 made columns an explicit TIME-AXIS BUDGET with resolution.budget, and
        stated the rule this bug violates: A BUDGET NEVER TRUNCATES THE WINDOW. Where
        there are fewer source cells than columns it replicates and says so.
      - T-397 solved the same shape one bar over: the navigator strips asked for a fixed
        cell count and got blockiness, and stripCells now asks ONE CELL PER PIXEL on
        each axis so every drawn cell is one the backend folded. The main waterfall
        wants the equivalent relationship between its row count and the chosen span.
      HONESTY CONSTRAINT, and it is the reason this is core_interface: filling the
      display must come from ASKING FOR THE RIGHT RESOLUTION, never from stretching or
      interpolating what arrived. T-411 established that upsampling in the client is how
      blockiness happens, and T-334's rule is that the view must never imply detail the
      front end did not capture. A long span filled by a coarse tier is honest and must
      SAY it is survey/history overview; the same span filled by interpolating a sliver
      is not.
      Control: a span with genuinely less data behind it than the display has rows
      still fills honestly - replicated and labelled - rather than either stretching or
      leaving the rest empty.
  - id: T-421
    title: Per-(time, frequency) coverage rasterisation - the record answer gains a time axis
    milestone: M2-hardening
    status: done
    priority: high
    parallel_group: STORE
    core_interface: true
    model: opus
    deps: [T-408, T-419]
    acceptance: |
      T-408's section 7 STEP 1, and the only step that closes the gap its section 2
      names. It had no ticket; filed 2026-09-17.
      THE GAP, in T-408's own table: there are TWO coverage answers, from different
      evidence, and neither alone suffices.
        CellStats::coverage (Tile::obs_s) - evidence is MEASUREMENT, frames landed.
          Per (t cell, f cell). No device. Horizon: the pyramid's byte budget.
        hk_store::Coverage (T-368)      - evidence is RECORD, the radio was tuned here.
          Per f cell OVER ONE WINDOW. Device-named. Horizon: ring 120 s / log 30 days.
      The record-derived answer HAS NO TIME AXIS, so it decides a COLUMN where the view
      needs a CELL. That is why the survey bar falls back to a column's state and a cell
      in an observed band the radio was tuned away from at that instant reads as
      "sampled, level not retained" rather than grey.
      THE FIX IS NOT NEW DATA. The ring journal's segments and the observation log's
      ObservedWindow/HopVisit are ALREADY (t_start, t_end, f_lo, f_hi, device) tuples -
      today rasterised onto the frequency axis and collapsed on time. Per-(t,f) coverage
      is THAT SAME RASTERISATION WITH THE TIME AXIS KEPT.
      NO NEW TYPE. Coverage::of's refusal applies per cell unchanged, and Sampled's six
      fields are all per-cell computable. Device stays in the key (any default, named
      false), which maps onto the existing OriginFilter/source filter - which is why
      "fills in as more SDRs are added" needs no new concepts.
      THE FOLD RULE IS A SUM, NOT A MAX, and T-419 has just established why that matters:
      Tile::fold_child reported FULL COVERAGE on one sixteenth of a band because it took
      the max across children. Do not reintroduce that shape on the new axis. T-419's
      truth_from_level_0 control is the pattern - prove against the finest cells, never
      against a parent, because a parent-vs-child assertion satisfies the buggy answer at
      every level.
      HONESTY, unchanged from T-368: Coverage::of refuses a zero span count, a
      non-positive sampled duration or a non-positive window and returns Unobserved
      rather than a zeroed Sampled; Sampled is non_exhaustive so there is no second door;
      an unobserved cell carries NO MEASUREMENT KEYS AT ALL.
      Pure backend. No wire change (that is step 2). Serves nothing visibly yet and
      unblocks everything below it.
    commit: 6a37221
    result: |
      DONE - docs/16 §7 step 1. `grid_over` lays nt x nf cells by clipping each span to every
      row it touches and sending each cell through THE SAME `Coverage::of` with that row's own
      duration, so the refusal (zero spans / non-positive sampled duration / non-positive window
      -> Unobserved, never a zeroed Sampled) applies per cell verbatim. `Sampled` keeps its six
      fields and #[non_exhaustive]; NO NEW TYPE. grid/union_grid/by_device are now the nt = 1
      case with `one_row_is_the_column_answer_unchanged` asserting equality bit for bit. Device
      stays in the key: by_device_over never merges two radios, union_grid_over wears
      Device::Any with is_named() == false. One file, +804/-29, nothing else in the workspace.
      THE FOLD IS A SUM. `coarsen` sums children's observed_ns, divides by the number of
      FREQUENCY children, re-derives duty against the parent's own duration, and refuses a
      factor that does not divide the grid - a fold whose children do not partition its parent
      is not a fold.
      T-419's control copied whole: `truth_from_level_0` computes each coarse cell from the
      level-0 grid alone, never a parent or intermediate level.
      `a_parent_vs_child_assertion_would_not_have_caught_this` recomputes the old best-of rule
      and asserts best == 2 x parent at every level - the rounded-up answer satisfies "a parent
      never exceeds its best child" AT EVERY LEVEL while being wrong by f_factor at every level.
      Verified negatively against three reverted mutants: T-419's shape (5 new tests fail, and
      `a_fully_watched_band_still_reads_fully_covered` PASSES - exactly the case the bug never
      touched), f_factor shape (6), time axis collapsed / T-368's answer (9, led by the
      motivating case).
      ONE GUARD BEYOND THE BRIEF, and it earns its place:
      `rasterising_directly_onto_a_coarse_grid_is_not_the_fold` MEASURES both answers on one
      sixteenth of a band - direct 1.0, folded 0.0625. Rasterising wide still answers "did
      anything look ANYWHERE in here", which is why the pyramid must rasterise fine and fold
      down. Pinned by a test instead of left in a comment.
      MOTIVATING CASE: a dwell on 100-110 MHz for the first 10 s of a 60 s window. The column
      answer calls the band Observed for the whole window (asserted, so the before-state is in
      the test). With six rows, row 0 is observed at duty == 1.0 AGAINST THE ROW and rows 1-5
      are Coverage::Unobserved with sampled().is_none() - genuinely grey, carrying nothing to
      read as a zero.
      DUTY is the same shape one field over from T-419's occ_s/obs_s near-miss. It is re-derived
      from the parent's own observed_ns and duration, never averaged from the children
      (`a_folds_duty_is_re_derived_and_never_averaged_from_the_children` shows mean-of-children
      1.0 vs the truth 5/16). A parent with any observed child keeps >= 1 ns so integer division
      cannot manufacture grey out of arithmetic.
      FOURTH STATE (§5.4) NOT spelled as grey and no Coverage variant added:
      `unknown_rows_before(oldest_record)` names the rows lying wholly before the oldest
      surviving record, where Unobserved means "we no longer know whether we looked". Only the
      caller that read the observation log knows where that horizon is, and §5.4 says a third
      variant is a core_interface change to make deliberately - left to step 2's wire work.
      The journal and observation-log readers already carry whole (t0,t1) intervals per segment
      and per hop visit, so they needed nothing: THE COLLAPSE WAS ENTIRELY IN THE FOLD.
      Floors read on the merged tree and matched exactly - no stash-and-compare needed.

  - id: T-422
    title: fsk and qam16 have the same class-level defect cw and ssb had - a hand-written table and a misordered density
    milestone: M3
    status: done
    priority: normal
    parallel_group: M3A
    deps: [T-249]
    use_cases:
    - SIGNAL-062
    found_by: 'T-249 (2026-09-17), while measuring the analog class call it fixed'
    acceptance: |
      T-249 replaced analog's hand-written within-family score table with the fitted
      per-class densities and took analog class wrong-label from 0.3500 to 0.0056.
      It reported, from the same measurement run, that TWO MORE FAMILIES HAVE THE SAME
      SHAPE OF DEFECT at class level, and they are not the same bug twice:
        fsk/gfsk and fsk/msk - top-1 0.33-0.42, wrong-label 0.50-0.67. `fsk_classes` is
        STILL A HAND-WRITTEN TABLE, the last one left after T-249. Expect T-249's
        cause: a conjunction written from noiseless physics whose feature is
        noise-limited at this geometry, or a tie broken by a feature that does not
        measure what its name says.
        psk-qam/qam16 - top-1 0.083, wrong-label 0.917. DIFFERENT and more interesting:
        psk-qam ALREADY routes through the densities, so this one is MISORDERED BY THE
        DENSITIES THEMSELVES. A fitted model getting it wrong 11 times in 12 is not a
        threshold problem; check what the fit is conditioned on and whether qam16's
        training geometry matches the blind seeds'.
      DoD: for each of the three classes, state the measured cause before proposing a
      fix, and say which DIMENSION fails to separate them (T-249's form: "carrier_line_db
      does not distinguish a carrier from a loud tone"). Then either fix the call or
      withhold it below a DERIVED gate with a recorded reason (T-297/T-311/T-312's rule),
      never a confidently wrong name.
      Family-level floors must not move: top-1 0.935, top-2 0.986, wrong-label 0.003
