    priority: high
    deps:
    - T-337
    parallel_group: UI
    core_interface: true
    model: opus
    acceptance: 'USER BUG from live testing, 2026-09-16, and a SHARPENING of the CLAUDE.md one-shared-time-axis
      invariant rather than a regression against it. The .c-presence-box divs in the centre view drift and
      then jump, because T-261 recomputes their top/height ONLY on the roughly 1 s data poll while the WebGL2
