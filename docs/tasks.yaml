  - id: T-364
    milestone: M3
    title: The classifier rejects 39% of genuine short bursts from their own class, and the fix costs open-set
      recall at the floor
    status: done
    priority: high
    deps:
    - T-328
    parallel_group: M3A
    core_interface: true
    model: opus
    acceptance: 'T-328 measured this while refusing the four-dimension expansion, and it is the larger finding:
      the SHIPPED classifier rejects 39.4% of genuine N/8 bursts from their own class, against 11.9% of
      the same classes'' full windows (n = 840, 21 classes x four SNRs, densities fitted on full windows
      over dev seeds, bursts scored on disjoint dev seeds). CLAUDE.md makes ephemeral emissions FIRST-CLASS
      - a signal is a time-frequency region, not a persistent carrier, and 902-928 MHz ISM bursts are the
      canonical playground - so this is a live capability gap on exactly the signals the project cares most
      about. THE FIX IS IDENTIFIED AND PRICED: fitting the densities over POOLED window lengths takes N/8
      unknown from 39.4% to 12.1% (single dimension) or 56.4% to 11.9% (four dimensions), but costs held-out
      unknown recall 0.9606 -> 0.9000 and 0.9697 -> 0.9242 respectively, and 0.8788/0.8727 on N/8 negatives
      - AT OR THROUGH ADR-0016 section 7''s 0.90 floor. THIS IS A PRODUCT DECISION, NOT A TUNING ONE: it
      trades open-set honesty against burst recall, and the user''s standing rule is that floors do not
      move to accommodate a capability. Measure the trade properly across seeds and SNRs, present BOTH curves,
      and let the user choose - do NOT pick for them and do NOT move the floor. Note T-328''s ordering reversal:
      at a pooled fit the FOUR dimensions hold the open set better (0.9242 vs 0.9000) at the same burst
      recall, so if pooled fitting is adopted the four-dimension expansion should be re-evaluated in the
      same breath rather than staying refused on a protocol that no longer applies'
    notes: |
      UNBLOCKED 2026-09-17 by T-428, which changed what this ticket must ask the user.
      T-428 established that the held-out unknown-recall figure has a DRAW STANDARD DEVIATION OF
      0.0084 across seed bases (370-381 of 396 at eight bases; 0.9343-0.9621, mean 0.9530). The
      four-decimal figures in the acceptance text above therefore cannot be compared at four
      decimals. ADR-0016 §7.1 now says a brief quotes ~0.95 (draw sd 0.008; a +/-0.02 move is
      noise), and §7.2 records the failure mode.
      THIS SHARPENS THE USER'S QUESTION RATHER THAN SOFTENING IT. "0.9606 -> 0.9000" was read as
      "lands exactly on the 0.90 floor". Against sd 0.0084 that post-fix value is roughly ONE
      STANDARD DEVIATION above 0.90 and a draw could put it either side - so the honest statement
      is not "meets the floor" but "cannot be distinguished from the floor at this sample size".
      The four-dimension variant (0.9697 -> 0.9242) sits ~2.9 sd above and IS distinguishable.
      SO: re-measure both curves ACROSS SEED BASES, not once, and present the user a mean with a
      spread per point. State plainly which options are distinguishable from the floor and which
      are not. That is a different and better decision than the one the ticket originally framed,
      and it may make T-328's ordering reversal (four dimensions holding the open set better at a
      pooled fit) the decisive fact rather than a footnote.
      Do NOT pick for the user and do NOT move the floor - unchanged.
    commit: 9ea65e5
    result: |
      DONE - measurement and presentation only. Nothing adopted, no floor moved, no density file
      changed. Deliverable: docs/17-burst-recall-vs-open-set.md, four options with costs and NO
      recommendation, for the user. Re-derivable with `just t364-curves`.
      T-428 established the held-out figure has a DRAW SD OF 0.0084, so this was measured across eight
      seed bases rather than once - and that changed three conclusions.
      1. THE GAP IS ~2x THE HEADLINE. T-328 shortened only C14's window, but a genuinely short
         emission is short in the CLASSIFIER'S SNIPPET too, where the shipped rejection is
         70.3% +- 1.7, not 39.4%.
      2. THE PRICED FIX IS BELOW THE FLOOR, NOT AT IT. T-328's single 0.9000 read as "lands exactly on
         0.90". Eight draws give 0.8911 +- 0.0112: -2.3 sem, 7 of 8 draws failing. Eight draws resolve
         the option AGAINST itself rather than leaving it ambiguous.
      3. THE SHIPPED CLASSIFIER IS ALREADY AT THE FLOOR ON SHORT BURSTS: 0.8949 +- 0.0159, 5 of 8
         draws below 0.90, BEFORE any change. The gate's 0.95 is a full-window number.
      "Pooled fitting" is TWO experiments and only one was ever priced: pooling C14's window costs
      ~0.06 recall; pooling BOTH views - what a real burst is - costs ~0.25 and is the ONLY option
      that fixes genuine bursts (0.703 -> 0.179), nowhere near the floor.
      THE FOUR-DIMENSION REVERSAL HOLDS AND IS DECISIVE. At the shipped protocol T-328's refusal
      stands exactly. At a pooled fit the sign flips, and 0.9088 +- 0.0053 against 0.8911 +- 0.0112 is
      the difference between clearing the floor and not - so the expansion is what PAYS FOR the
      pooling and the two halves are a package.
      Validation first: the builtin arm's eight draws are 377/379/380/377/378/370/377/381 of 396 - the
      SAME MULTISET T-428 reported, mean 0.9530, sd 0.0084 to four decimals, so it reads ADR-0016
      §7.2 row 1 and not one of the other two readings. It also reproduces T-328 (38.4% vs 39.4%).
      A FOURTH OPTION the measurement surfaced and did not price: most remaining harm is OUTSIDE the
      cyclic statistic, in the other ~20 features' own snippet-length dependence - pointing at making
      those length-invariant (T-312/T-313's direction) rather than widening densities.
      Both code additions inert by default: Classifier::with_models is additive and uncalled by the
      pipeline; the cyclic-dims cargo feature is off by default and never on in CI.

