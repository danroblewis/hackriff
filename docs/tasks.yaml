  - id: T-401
    title: No acceptance test asserts latency, so the suite is blind to a whole class of defect
    milestone: M3
    status: done
    priority: high
    parallel_group: M3A
    core_interface: true
    model: opus
    deps: [T-398]
    acceptance: |
      T-398's most valuable finding, and it is about the SUITE rather than the code.
      "No test in the suite asserts latency at all. Every acceptance test inspects
      TERMINAL state, so 40 s and 1 s leave an identical inventory at the end of a
      fixture. The suite was blind to this class by construction."
      A confirm that took 60 s - the whole recording - passed every test we have,
      because the row was there when the music stopped. The user found it by looking
      at the screen.
      THE WORK: make time-to-outcome assertable, then assert it where it matters.
      T-398 built the first two (tests/e2e/tests/acceptance/confirm_latency.rs, matched
      to hidden truth after the run by measured centre and bandwidth - BLIND, per the
      standing rule). Generalise that shape rather than copying it: detection,
      family assignment, confirmation, and first decode are all latencies a user feels
      and none are currently bounded.
      THE TRAP: a latency assertion is a timing test, and this repo already has two
      that fail under parallel load (T-344, T-383). Assert on CAPTURE-CLOCK time, not
      wall time, so a loaded machine cannot fail it - T-398's own numbers separate the
      two (1.0 s capture vs 3.22 s wall) and that separation is the design, not an
      accident.
      Related, and also T-398's: the M3 suite passed on synthetic while this failed
      live, because every synthetic WFM scene ships clean RDS with a perfect PI, so the
      fast route always fired and the slow route's defect was never exercised.
      Suppressing RDS in a synthetic scene REPRODUCED the bug. A suite whose fixtures
      are all best-case cannot find a fallback path's bug.
