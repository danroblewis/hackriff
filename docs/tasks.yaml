  - id: T-342
    milestone: M2-hardening
    title: 'Band-collapsed activity-vs-time belongs in the backend: reduceActivity is the last client-side
      measurement on the time surfaces'
    status: done
    priority: normal
    deps:
    - T-334
    parallel_group: UI
    core_interface: true
    model: opus
    acceptance: 'T-334 fixed the client-side reductions it could and filed this one rather than waving it
      through. capture/timeline.ts::reduceActivity takes max over EVERY frequency cell and normalises against
      the response''s own range - that is a measurement (deciding which value represents a band) made with
      no knowledge of noise floors or occupancy, which is signal logic in the UI. The pyramid cannot serve
      it: its coarsest cell is 100 kHz, so no max_f collapses a MHz-wide band to one column. Add a band-collapsed
      activity-vs-time series to the backend: one value per time step over a whole region, with its max-hold
      semantics and its scale stated. /api/analysis/strongest already keeps ''strongest in a band'' server-side
      and /api/floor already proves the shape (max_steps is a time-axis budget), so this is their sibling
      rather than new machinery. Update docs/api.md and api_contract.rs together per T-079 and assert the
      FIELD''s value, not the response shape'
    superseded_and_retargeted_by_t338_2026_09_16: 'SUPERSEDED IN ITS ORIGINAL FORM by T-338, and RETARGETED
      rather than closed. T-338''s RegionHistory::overview fold IS the backend band-collapsed measurement
      this ticket was filed for - T-342 is its rows = 1 case - and capture/timeline.ts''s reduceActivity,
      with its max over every frequency cell and its min/max normalisation, is DELETED. The reason
      it had to be the backend is structural: the pyramid ladder COUPLES ITS AXES (the 100 kHz tier
      has one-day time cells), so no level is fine in time and coarse in frequency, and serving the
      band any other way left an empty box. WHAT REMAINS: the one client-side reduction T-338 did
      not touch, in ui/src/app/explore/inventory.ts. Judge whether it is a MEASUREMENT (deciding which
      value represents an interval - backend work) or PRESENTATION over already-known state (legitimate
      thin-client work per CLAUDE.md, like the pixel-to-Hz axis mapping). If the latter, CLOSE THIS
      TICKET and say so: a ticket that no longer describes a defect is worse than no ticket'

  - id: T-343
    milestone: M2-hardening
    title: 'Setting centre from the frequency navigator is a real retune: a device action under the one-agent-at-a-time
      rule, recording device_id'
    status: done
    commit: 936c377
    priority: high
    deps: []
    parallel_group: UI
    core_interface: true
    model: opus
    acceptance: 'USER DIRECTION 2026-09-16. The frequency navigator sets centre, and SETTING CENTRE IS A
      REAL RETUNE - a device action, not a view change. Consequences that must be built in rather than discovered:
      it inherits the HackRF one-agent-at-a-time rule (only one process can open the device, and the user''s
      demo currently holds it on :8899); it must record device_id in provenance, which T-302/T-303/T-304/T-305
      have already made the load-bearing key for device-local physics; and it is the one navigator gesture
      that changes the WORLD rather than the VIEW, so it must be distinguishable in the UI from pan/zoom
      that only change what is shown. Contrast with T-339''s invariant: pause, scrub and zoom never touch
      the device - this one does, and that asymmetry is the point. THE SPLIT THE USER STATES: the backend
      reports the achievable (centre, span) grid and owns the retune; the UI does gestures, snap and styling.
      Receive-only, and never auto-retune: a gesture that would retune must be an explicit user action.
      Fold into docs/07, docs/14, ADR-0017; coordinate with T-340 which draws the navigator and T-341 which
      snaps the gesture'
    evidence_from_t339_2026_09_16: 'T-339''s audit found the defect this ticket must fix, with file
      and line. gestures.ts fires hooks.overflow when accumulated pan exceeds OVERFLOW_FRAC = 0.05
      of the view width, wired at view.ts:82 to retune, which POSTs /api/control/center. PipelineController::retune
      tunes in place ONLY when the window class and sample rate are both unchanged; otherwise it sets
      shared.stop.store(true) at run.rs:1398 and re-plumbs the run, tearing down and restarting the
      segment and its always-on readers. SO A PAN LET GO SLIGHTLY TOO FAR CAN STOP AND RESTART CAPTURE.
      A 5 percent numeric threshold inside one gesture handler is the only thing separating a view
      change from a device command - no distinct gesture, no distinct type, no confirmation. T-339''s
      invariant is not violated (a pan is not a pause), which is exactly why this needs its own ticket:
      the dangerous path is the one nobody classified as dangerous'

