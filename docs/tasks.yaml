      back, and reads Unknown - never the device that happens to be running now.
  - id: T-379
    title: Every UI surface must show all the data it has for the window; empty sidebars are the same bug as the black waterfall
    milestone: M2-hardening
    status: done
    priority: high
    parallel_group: UI
    core_interface: true
    model: opus
    deps: [T-368]
    acceptance: |
      USER INVARIANT 2026-09-16, added to CLAUDE.md as a CROSS-CUTTING UI RULE and
      to be folded into docs/14 + ADR-0013/ADR-0017. Verbatim:
      "The whole UI is scoped to one (time range x frequency range) window, and must
      display all the data it has for that window. Every surface - the waterfall,
      both edge navigators, the inventory Candidate/Confirmed lists, the
      output/decode panels - is a view over the current (time range, frequency
      range) selection. WHENEVER DATA EXISTS FOR THAT WINDOW (live, the IQ ring, the
