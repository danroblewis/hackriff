  - id: T-322
    milestone: M5
    title: 'hk-gnss is reachable only from its own tests: nothing schedules an L1 dwell, so the acquisition
      path has no caller'
    status: done
    priority: normal
    deps:
    - T-274
    parallel_group: M5A
    core_interface: true
    model: opus
    acceptance: 'T-274 built and tested GPS L1 acquisition (Gold codes, FFT parallel code-phase search,
      observables, S4, blind jamming assessment) and DELIBERATELY did not wire it into hk-pipeline, because
      wiring is where leakage risk lives. That leaves the sixth no-caller shape in this project''s history
      (T-242, T-247, T-206, T-267/T-287, T-297) - though this one is declared rather than accidental, which
      is the difference that matters. Wire it: C04 requests a scheduled L1 dwell, acquisition runs on that
      dwell, results reach C30 as evidence. THE CONSTRAINT THAT CANNOT BEND: no hk-detect -> hk-gnss dependency
      edge may appear, and blind_path_boundary.rs must stay green - if wiring seems to require that edge,
      STOP and report, because the alternative is the runtime flag ADR-0018 explicitly rejected as worse
      than no boundary. Prove non-vacuity as a falsifiable pair, the way T-287 and T-297 did: remove the
      wiring and a test fails; remove the acquisition and a different test fails'
  - id: T-323
    milestone: M5
    title: A full GNSS receiver means wrapping GNSS-SDR as a plugin, not reimplementing tracking loops
    status: todo
    priority: normal
    deps:
    - T-322
    parallel_group: M5A
    model: opus
    acceptance: 'T-274 built acquisition only. Tracking loops (DLL/PLL), nav-message decode, ephemeris and
      PVT are not built, and the C36 card''s recommendation is explicit: wrap GNSS-SDR as a C22 plugin over
