  - id: T-232
    milestone: M2-hardening
    title: "Temp-dir leak persists after T-229: one full suite run grew hk-replay dirs 30 -> 56, and 56 of 57 were dead-pid orphans carrying ring.ci8 files"
    status: done
    commit: 21fb50b
    priority: high
    deps: [T-229]
    parallel_group: PIPELINE
    use_cases: []
    found_by: "coordinator verification 2026-09-15 after merging T-229: measured before/after a full suite run rather than trusting the fix's own tests"
    acceptance: "CONFIRM the cause before fixing - two hypotheses, neither established: (a) a MERGE-ORDER GAP - of the 8 files calling temp_data_dir, only crates/hk-cli/tests/iq_buffer_allocation_http.rs (added by T-217, developed in parallel with T-229) lacks TempDataDirGuard, and it deliberately creates rings, matching the ring.ci8 in the orphans; (b) a second path - one pid left 25+ dirs, which a single test cannot explain but a cargo test binary running many tests in one process can, so a guarded call site may not be firing (process killed, helper not taking the guard, or the guard dropped after the harness forked). Then: every temp_data_dir call site holds a guard (assert it with a test that greps or a compile-time pattern); a full suite run leaves NO net new dirs once the sweep age is accounted for; and decide explicitly whether T-229's 1-hour sweep age means fresh leftovers are a BOUNDED lag (acceptable, document it) or an unbounded leak (not). Measure before and after a full suite run, not just targeted tests"
    area: crates/hk-cli (pipeline.rs temp_data_dir, iq_buffer_allocation_http.rs), tests/e2e
    needs: none
    model: sonnet
    effort: medium
    core_interface: false
    refined_diagnosis: "STRONGEST hypothesis after further evidence (still confirm before fixing): the leaked dirs belong to spawned `hk serve` CHILD processes, not to the test harness. Evidence: two different pids each left EXACTLY 25 dirs (a fixed set of tests in one cargo-test binary, e.g. api_contract start_server), and the contents are a running server data dir - baselines/, captures/, control-audit.jsonl, hackriff.db(+shm/wal), iqbuffer/ring.ci8 - not a scratch dir. A child killed at teardown never runs its RAII Drop, so TempDataDirGuard cannot fire, which also explains why T-229 own tests passed: they covered in-process guards, never killed children. Likely fixes: the PARENT owns and removes the child data dir; or tests stop the server with SIGTERM plus a graceful shutdown path that drops the guard; or the child registers its dir for the next sweep. Prefer parent-side ownership since a SIGKILLed child can never clean up by construction."

  - id: T-233
    milestone: M3
    title: "Fingerprint family_of gate stays DEFERRED: it merges within-family pairs (bpsk/qpsk, 2fsk/gfsk, am/wfm) into one emitter; decide whether the fingerprint needs a finer discriminator before it can ever land"
    status: done
    commit: e197175
    priority: normal
    deps: [T-218, T-201]
    parallel_group: M3B
    use_cases: [AWARE-053]
    found_by: "T-218 (2026-09-15): applied the gate experimentally and found bpsk vs qpsk at identical centre/bandwidth/rate compare as one emitter, as do 2fsk/gfsk and am/wfm"
    outcome_2026_09_16: "DISCRIMINATOR BUILT AND MEASURED; family_of RELAXATION WITHDRAWN, NOT DEFERRED.
      Landed: hk_model::ModulationStructure on Fingerprint - envelope_shape, the emission's own
      normalised fourth envelope moment mu4 = E|s|^4/(E|s|^2)^2 with the AWGN contribution removed
      in closed form (mu4s = mu4x(1+1/rho)^2 - 4/rho - 2/rho^2), carried WITH the sigma its producer
      measured it to (hk_classify::structure), compared at 3 sigmas so no width is fitted to any pair.
      It is exactly 1.0 for any constant-envelope emission and separates am from wfm and bpsk from
      qpsk (a shaped BPSK's 180 degree transitions pass through the origin; a QPSK's mostly do not).
      MEASURED on acceptance seeds at identical centre/bandwidth/symbol-rate/family, bandwidth-matched
      pairs: bpsk/qpsk false merge 0.097 at 20 dB and 0.027 at 25 dB against a baseline of 1.00, false
      split under 0.02; at the 15 dB PSK gate the band exceeds the 0.18 separation and it concludes
      nothing, which is the sigma working. WHY THE GATE STILL CANNOT RELAX: fsk is the only
      family-level label any producer writes (hk_estimate::blind emits Fsk but Bpsk/Qpsk/Ook), so the
      relaxation is exactly a licence to merge an fsk row with a 2fsk/gfsk/msk/4fsk one - and those
      are constant-envelope by construction, all read 1.00, and over 99 percent of distinct pairs
      compare as one at every SNR. The best statistic tried on that pair (IF bimodality) still left
      5.8-33 percent and was rejected for measuring the observation. The relaxation is also worth
      little: same_emission (T-082) already merges a tracker entry and a chain entry of one emission
      without looking at the family at all. SAFETY: structure is a scored feature, so it can only
      SPLIT, never merge - adding it contributes zero false-merge exposure, which is what made it
      safe to land while the relaxation is not. A second dimension (if_concentration, IQR/(P95-P5)
      of the instantaneous frequency) was built and REJECTED: its quantiles count samples, so it
      moved 0.014 -> 0.078 on one bpsk emitter between a 16384- and a 6144-sample record while
