  - id: T-406
    title: Iterative scan mode - step the tune and retain the full-spectrum survey
    milestone: M4
    status: done
    priority: normal
    parallel_group: PIPE
    core_interface: true
    model: opus
    deps: [T-368, T-408]
    acceptance: |
      USER 2026-09-16, item (2). Step the tune to the next region after sampling enough
      per step (~10-30 s, CONFIGURABLE), and POPULATE + RETAIN the full-spectrum survey
      so probable signals across the whole spectrum become visible.
      Build on what exists: the ATTENTION SCHEDULER (C04, sweep-to-find-where) and the
      COVERAGE MAP (T-368). This is not a new scheduler - it is a dwell policy over the
      one we have, plus retention of what each step saw.
      THE PROJECT'S OWN FINDING CONSTRAINS THE DWELL: "a HackRF sweeps 0-6 GHz in under
      a second but MISSES SHORT BURSTS" (docs/02). 10-30 s per step is a dwell, not a
      sweep, and the user chose it deliberately - so say what a step of that length can
      and cannot catch, and make the number configurable rather than tuned to one band.
      RETENTION IS THE HARD HALF, and it is shared infrastructure: what each step saw
      must accumulate into the SAME tile pyramid the big view (T-408) and the survey bar
      (T-405) read. Do not build a private accumulator. Max-hold downsample,
      grey = genuinely unobserved.
      HONESTY: a step that sampled a region for 10 s and found nothing is OBSERVED AND
      QUIET, which is a finding. A region the sweep has not reached yet is UNOBSERVED.
      These must stay distinguishable in the accumulation exactly as they are in
      hk_store::Coverage - a sweep that greys what it has already cleared is useless,
      and one that paints unreached spectrum as quiet is dishonest.
      A retune is a device action (T-343): one capture at a time, settle gap honoured,
      device_id recorded. And with multiple SDRs the sweep must not assume it owns the
      radio - the scheduler already arbitrates.
    commit: d07c75a
    result: |
      DONE - the user's feature (2) of four, and THE LOAD-BEARING DECISION WAS THE STEP PURPOSE,
      not the dwell.
      hk_core::scheduler::IterativeScan is a dwell policy over the EXISTING scheduler, not a second
      one: a ScanPolicy::DwellOnly plan over the device's own frequency_ranges with a configurable
      region_dwell_ns, written into extra.scheduler.region_dwell_s so the plan carries its own
      policy through a --plan JSON round-trip and SchedulerConfig::from_plan reads it back with no
      second code path. Default 15 s; recommended() REPORTS whether a dwell is inside the user's
      10-30 s range rather than clamping. Hard bound 300 s (the pass is linear in the dwell).
      Reachable as --survey-dwell SECONDS on hk run, hk replay and hackriffd.
      WHAT docs/16 §7 STEP 6 WARNED ABOUT, and the whole ticket: a DwellOnly hop emits
      Purpose::RegionDwell and ObservationRecorder writes ONE DwellRecord PER STEP with that step's
      own window and interval. ONLY Purpose::Sweep aggregates across a pass. Implementing the scan
      as long sweep hops - the obvious shortcut - would have produced exactly the coarse record the
      design warns about, and T-421's grid_over would have rasterised it as "the whole band, the
      whole time".
      The record -> CoverageSpan mapping moved OUT of hk-api into hk_store::spans_from_records,
      beside the rasteriser that consumes it, so ONE place decides what shape a record takes on the
      grid; /api/coverage now calls it instead of keeping a copy.
      PROVED AS ONE CHAIN, NOT PER LAYER: scheduler -> recorder -> observation log -> coverage
      spans -> grid_over, every link production code, nothing hand-writing a record or a span.
      THE THREE STATES: the pass rasterises as a DIAGONAL - on hop k's step, hop k is Observed
      (a positive sampling fact, no claim about energy) and every other hop is Unobserved - while
      the same spans collapsed to ONE ROW say the band WAS cleared over the pass. That difference
      is exactly what the time axis buys. Rows wholly before the oldest record are the fourth state
      via unknown_rows_before; an observed cell is never relabelled. The DC notch survives the
      chain as two bands per dwell, never one wide one.
      iterative_scan_device.rs runs it THROUGH THE MOCK SDR: retunes go through the existing gated
      typed path (no second path added), every record names its device_id, coverage spreads across
      the walked range AND STOPS THERE (one window beyond the plan edge is Unobserved, not quiet),
      and the SHARED spectrum-history pyramid holds frames across it (140/140 cells). No private
      accumulator; history ingest was already Purpose-agnostic and that test is now the guard
      keeping it so.
      THE BUDGET LINE IS MEASURED, and states the limit in the same breath as the capability:
        401 steps x 12.0 s = a 4812.0 s pass over 5999.000 MHz (15.000 MHz per step); each band is
        listened to 12.0 s in every 4812.0 s (duty 0.249 %). A step catches anything on the air
        during its own dwell; it catches nothing during the other 4800.0 s, and spectrum the pass
        has not reached is unobserved, never quiet.
      A dwell gives ~300x more listening per visit than a 50 ms sweep hop - what makes an ISM burst
      findable at all - and pays one-for-one in revisit latency.
      RETENTION, DECIDED WITH REASONS AND MEASURED: observation log 30 days / 512 MiB -> 180 days /
      2 GiB, both overridable per run. §5.4's arithmetic was marked unverified; now measured through
      the PRODUCTION codec at 618 B/line, so a 10 s dwell writes 5.3 MB/day and 2 GiB holds ~400
      days - THE AGE BINDS FIRST, the intended order.
      THE FINDING §5.4 DID NOT STATE: which bound binds DEPENDS ON THE POLICY. A 50 ms-hop sweep
      aggregates ~1500 hop visits per record and is ~2 orders denser per day, so THERE THE QUOTA
      BINDS - raising the age alone would not have moved that horizon at all. Both numbers had to
      move.
      Docs: docs/16 §5.4 + §7 step 6 (marked landed), docs/api.md, ADR-0012 §1.5/§11.
      LEFT OPEN FOR THE USER in ADR-0012 §11 open question 3, which was literally asking this:
      whether a 2 GiB ceiling is acceptable on the device's disk.

