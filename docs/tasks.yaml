    - T-298
    parallel_group: M3A
    model: opus
    acceptance: 'T-298 took held-out wrong-family from 5 of 396 to 1 of 396 by adding if_local_bimodality
      and if_local_modality (features@4), statistics about the window''s OWN local trend. ONE case remains:
      a chirped-FSK at 20 dB, seed 1700074, still reads analog/wfm. It sits at the LOW TAIL of its own generator
      on the dimension that closes the other three - if_local_bimodality 0.585 where its generator averages
      0.74 +/- 0.11. Both new dimensions fire, but weakly: neither becomes the SECOND-largest |z| that T-248''s
      tail term needs. THE REFUSAL TO PRESERVE: shrinking IF_LOCAL_WINDOW from 512 would catch it, and T-298
      explicitly declined because that is tuning a constant against an acceptance result. Do NOT do it.
      IF_LOCAL_WINDOW = 512 is the window ramp_linearity already fits a line over and the separation is
      unchanged at 256, so the length is not what is doing the work - a change there would be fitting the
      seed, not the physics. A fix must come from a dimension that separates this case on its merits, or
      from the tail term, or this stays an honest documented remainder. Two candidates are already measured
      and refuted: lag-product PAPR measures a coherent carrier not a sweep (chirped-FSK 2.61 but am 2.52,
      ssb 2.47), and per-window IF slope consistency does not separate (keying dominates the drift within
      a window). Report a negative honestly if the remainder cannot be closed without tuning'
