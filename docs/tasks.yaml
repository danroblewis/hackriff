  - id: T-408
    title: The coverage tile pyramid and the full-spectrum-over-time view - design before building
    milestone: M5
    status: done
    priority: normal
    parallel_group: DESIGN
    core_interface: true
    model: fable-or-opus-with-user
    deps: [T-368, T-342]
    acceptance: |
      USER 2026-09-16, item (3) - "the user promises it is very cool". Design doc
      written: docs/16-coverage-tile-pyramid.md. Roadmap entry to follow in docs/11.
      THE VIEW: Y = time, X = the whole spectrum, Google-Maps-style multi-resolution
      ZOOM LEVELS (tile pyramid) with downsampling so browser memory stays bounded.
      Mostly GREY = unobserved, AND THAT GREY IS THE POINT - you see where you scanned.
      Confirmed signals highlighted. Fills in as more SDRs are added.
      THE ARCHITECTURAL INSTRUCTION, which is why this is filed before its consumers:
      the tile pyramid is ONE piece of backend infra serving ALL THREE of the big view,
      the bottom survey bar (T-405) and the sweep accumulation (T-406). The survey bar
      is A MINIATURE OF THE BIG VIEW. Same coverage map, same max-hold downsample, same
      grey = unobserved. Built separately they WILL disagree, and visibly - the user
      will have the bar and the big view on one screen showing the same spectrum.
      STATUS blocked ON DESIGN SIGN-OFF, not on capacity. docs/16 section 5 lists five
      open questions that decide everything downstream, and two of them must be settled
      first: TILE ADDRESSING (map-style fixed tiles vs the per-axis budget idiom this
      repo already uses - they do not obviously compose) and WHEN DOWNSAMPLING HAPPENS
      (precomputed at seal time, bounding read latency and costing storage in a system
      that hit 9.5 GB free today, or on demand, which is the reverse trade).
      MOSTLY NOT NEW MACHINERY. docs/16 section 2 tabulates what exists: the tiered
      history pyramid, hk_store::Coverage, the max-hold fold with stated semantics, the
      device chain of custody, the never-truncating budget, the resolution tiers. THE
      GAP IS THE SECOND AXIS - today the pyramid is tiered in TIME and coverage answers
      per FREQUENCY CELL over a window; the big view needs both at several zoom levels,
      which is a different indexing problem from either.
      The invariants it must not lose are in section 4, and the one the user is already
      feeling is that FOLDING NEVER LOWERS A VALUE - that is what makes a peak survive
      downsampling, and its absence is T-405's washed-out yellow and red peaks.
      USER DECISION 2026-09-17 - UNBLOCKED. The two gating questions are settled
      GOOGLE-MAPS-STYLE:
      section 5.1 TILE ADDRESSING = FIXED (zoom, t_index, f_index) map tiles. NOT the
      per-axis budget idiom for this view. (The budget idiom stays correct for
      /api/timeline and /api/floor - this decision is about the big view's tiles.)
      section 5.2 DOWNSAMPLE TIMING = PRECOMPUTED at seal time for the coarse zoom
      levels, ON-DEMAND at the live/finest edge, with CLIENT-SIDE TILE EVICTION and a
      TILES-IN-FLIGHT CAP for bounded browser memory. Storage cost accepted (140 GB
      free at the time of the decision).
      THE REMAINING THREE (5.3 confirmed-signal highlighting, 5.4 retention horizon per
      zoom level, 5.5 eviction policy) ARE SETTLED WITHIN THAT FRAMEWORK AS PART OF THE
      DESIGN WORK. They do not gate and do not need the user.
      Note for 5.4 in particular: the horizons are already three different things - the
      IQ ring (seconds to minutes), spectrum history (longer, lossy) and the
      observation log (30 days) - so "which horizon does this zoom level answer for"
      has a real answer per level rather than one global choice, and the grey must mean
      unobserved AT THAT LEVEL'S HORIZON.
      Note for 5.3: T-386 settled that the durable catalogue is an INDEPENDENT surface
      from the view cursor, and this view is a history surface - so whose time frame
      the highlighted emitters belong to is a live question, not a styling one.

  - id: T-409
    title: Tuning nudge buttons - move a signal off the DC spike without losing it from the band
    milestone: M2-hardening
    status: done
    priority: normal
    parallel_group: UI
    core_interface: true
    model: opus
    deps: [T-343, T-392]
    acceptance: |
      USER 2026-09-16. Add TUNING NUDGE buttons: shift the tuned centre left/right by a
      fraction of the window width, offering 1/8, 1/4 and 1/2 of the CURRENT TUNED SPAN.
      MOTIVATION, which is a real RF problem and not a convenience: a signal sitting at
      the centre frequency lands on the DC/LO-leakage spike and cannot be cleanly
      demodulated or decoded. Nudging moves it off DC while keeping it in band.
      This repo has measured that spike repeatedly: T-317 identified DC/LO leakage as a
      ruled-out cause and the detector flags spur_reason on it; T-382 measured the
      8 kHz host comb's offset RELATIVE TO TUNER DC (-678.048 Hz on one capture); the
      2026-09-15 fixture's own tuner-DC box is one of the boxes T-394 leaves above
      20 dB. The spike is real, it is ours, and it sits exactly where a user naturally
      tunes.
      IMPLEMENTATION: each nudge is a retune via the existing POST /api/control/center
      (centre +/- fraction x span), so it is a DEVICE ACTION but UI-wise a small control
      set near the frequency controls / navigator: left/right x {1/8, 1/4, 1/2}.
      Batch with the UI polish (T-405, T-407). UI-ONLY GATE if it only calls the
      existing endpoint - confirm with just gate rather than assuming.
      THREE THINGS TO GET RIGHT, none of them obvious from the ask:
      (1) SNAP. The achievable centres are a grid (T-341's center_step_hz;
      HACKRF_ONE_TUNING_STEP_HZ is 30 MHz / 2^20 = 28.6102294921875 Hz). centre +
      fraction x span is not generally on it, so the nudge must snap - and then the
      actual shift differs slightly from the advertised fraction. Reuse T-341's
      snapState arithmetic; do not re-derive it.
      (2) CLAMPING IS NOT FREE, and the user's word for it deserves a second look. At
      the edge of the device range a clamped nudge MOVES LESS THAN THE BUTTON SAYS, so
      the control lies quietly. T-392 met this exact problem and chose deliberately:
      containsCenter is NOT snapCenter, precisely because snapping walks an out-of-band
      request inward and would call every out-of-range centre achievable at the band
      edge. Prefer DISABLING a nudge that cannot be taken in full, or showing what it
      will actually do, over silently clamping. If you do clamp, say so in the UI.
      (3) 1/2 SPAN MAY BE THE WORST OPTION for the signal being rescued. Moving a
      centred signal by half the span puts it at the BAND EDGE, where the anti-alias
      filter rolls off - out of the DC spike and into the skirt. Consider whether the
      offered fractions want a note, or whether the largest one is a trap for the case
      this feature exists to fix.
      THE CONSTRAINT THAT MUST HOLD: T-340's control asserts that no PAN and no WHEEL
      reaches a device route (a +/-1.0 drag of the whole 6 GHz bar through a spy client,
      calls empty). A button is an explicit, discrete action like T-392's region-select
      on release, so it may command the radio - but it must go through T-343's gated,
      typed DeviceAction with device_id recorded, one capture at a time and the settle
      gap honoured. Do not add a second path to the device.
      Control worth having: a nudge and its opposite return the tune to where it
      started (modulo one snap step), so the buttons are navigable rather than a
      one-way drift.
    commit: 4333b47
    result: |
      DONE. Six buttons beside Go to, each shifting the tuned centre by a fraction of the TUNED
      SPAN (live.bandwidthHz ?? device.sampleRateHz - never the zoom width).
      THE 1/2-SPAN TRAP, which was the ticket's own open question, is settled by T-418's
      derivation three hours earlier. `NudgeGeometry.landing` makes it a NUMBER: where a signal
      currently ON DC ends up, as a fraction of the way to the window edge - 1/8 -> 0.25,
      1/4 -> 0.50, 1/2 -> 1.00. So 1/2 lands a formerly-centred signal exactly at the band edge
      in the anti-alias skirt: it trades one hazard for the other, the opposite of what the
      feature exists to do.
      The button STAYS (it is the honest stride for stepping along a band) but is marked amber
      with a tooltip naming 1/4 as the offset that clears both, and stating the second cost:
      only 50% of the window is kept and a formerly-centred signal sits exactly on that
      boundary. 1/4 is marked ideal for T-418's reason - midpoint of the usable half-band,
      maximally far from the LO spike and the roll-off.
      CLAMPING: NONE, and the refusal is PER BUTTON. The test is `containsCenter` on the
      REQUESTED centre - T-392's distinction kept deliberately, because snapCenter walks an
      out-of-band request inward and would call every out-of-range centre achievable at the band
      edge. A nudge that cannot be taken in full is disabled and says so; DOWN STILL WORKS at
      the top of the band. The test asserts snapCenter WOULD have returned a shorter centre
      there, so the distinction cannot be quietly undrawn later.
      SNAP reuses T-341's snapCenter, not re-derived. snapErrorHz is carried to the tooltip
      rather than absorbed ("the move is 8 Hz short of the advertised fraction"), and a source
      with no stated step says "to ABOUT X MHz (this source states no tuning step, so nothing is
      snapped)".
      T-340's control re-asserted under the new code: a +/-1.0-and-beyond pan (incl. a 6 GHz
      overflow) through a spy client gives an empty call list while the pan still leaves an
      offer. A press goes through the existing gated applyDeviceAction/retuneAction with
      "nudge" added to the DeviceAction source union; nudge.ts names NO device route so
      app-centre.test.ts's two-callers source scan is unchanged. One POST /api/control/center,
      no rate call. The row disables in flight and the next press is computed from the centre
      this one asked for (pending, retired on any observed-centre change), so two quick presses
      are two nudges, never two overlapping retunes.
      REVERSIBILITY ASSERTED: a nudge and its opposite return to EXACTLY the starting centre
      from an on-grid start (round-to-nearest is symmetric), within one step from off-grid.
      AGENT'S ONE PICKED-NOT-DERIVED CONSTANT, declared: `intoSkirt` is landing >= 0.9, not
      >= 1, because the snap moves the landing point +/- step/span either way and an exact >= 1
      test flipped off on the real HackRF grid (14.3 Hz in 1.2 MHz). Documented edge region,
      conservative in the right direction, stable against both roundings.
      Gate classified `ui` on the staged merge; test-ui twice, 29/29 both times. Eager bundle
      33.2 KB gzip, inside the 45 KB budget.

  - id: T-410
    title: Presence is an interval with endpoints, not an accumulation of observations - box runs to the live edge until an END is detected
    milestone: M2-hardening
    status: done
    priority: high
    parallel_group: PIPE
    core_interface: true
    model: opus
    deps: [T-388, T-362]
    acceptance: |
      USER 2026-09-16 (message reached this session truncated at the front; the
      substance below is what arrived and is unambiguous - CONFIRM THE FRAMING).
      THE MODEL: a signal presence box extends FROM START STRAIGHT TO THE LIVE EDGE /
      TOP OF THE WATERFALL BY ASSUMPTION, capping only on a REAL DETECTED END. The
      stream needs only START / END / REOPEN events - NEVER a per-poll presence bump to
      advance the box top.
      EXPLICITLY REJECTED BY THE USER, record as rejected rather than re-proposing:
        - rapidly re-testing presence;
        - gating the next waterfall row on an end-decision.
      SCOPE: presence.rs / the emitter model (docs/07), the detection END-DETECTOR, the
      stream contract for start/end/reopen events (ADR-0004), and the UI box rendering.
      ADR IF IT TOUCHES THE PRESENCE CONTRACT - and it does, see below.
      THIS INVERTS A CONSTRAINT THE COORDINATOR IMPOSED ON T-388, DELIBERATELY. I told
      that agent "a box drawn to the live edge on the ASSUMPTION the signal is still
      there is a claim about air nobody measured", and it built three client-side
      refusals, the third of which is exactly what must now change:
      ui/src/presence.ts:65 - "Not contiguous. An extension whose span starts AFTER the
      end on screen describes a different stretch of air, with silence in between."
      The user's model is coherent and different, not looser: presence is an INTERVAL
      WITH ENDPOINTS, so the measurement is the START event plus the ABSENCE OF AN END.
      That is how tracking works - a track is open until it closes. The old model treated
      presence as accumulated observations, where anything not yet observed is not yet
      claimed. BOTH ARE DEFENSIBLE; THEY ARE DIFFERENT CONTRACTS, which is why this needs
      an ADR rather than an edit.
      THE LOAD-BEARING PIECE IS THE END DETECTOR, and the honesty burden moves onto it.
      Under the old model a late end-decision cost nothing - the box simply stopped
      growing. Under this one, a late or missed end means THE BOX OVER-CLAIMS AIR THAT
      WAS SILENT, and it over-claims all the way to the live edge. So: what is the end
      detector's latency, what is its false-negative rate, and what does the box do while
      an end is suspected but not decided? State these, because they are now the
      accuracy of the display.
      REOPEN NEEDS A DEFINITION: what distinguishes a reopen from a new start? There is a
      gap threshold in there somewhere and it should be derived, not picked. Note T-390
      already relies on track close for its fragment rule, and T-398/T-403 found that a
      permanently-on emitter HAS NO CLOSE until the 60 s idle timeout - so "end" is
      currently a slow and partly arbitrary notion, and this ticket depends on it being
      better than that.
      KEEP: T-388's other two refusals (no interval on the row conjures no box; a
      reordered record can never SHORTEN a box) and its rate bound. Keep the paused-view
      behaviour - no socket while paused - and T-362's rule that a box carries times, not
      screen positions.
  - id: T-411
    title: The left time-overview renders at the old 12px buffer size, so a few cells stretch into blocks
    milestone: M2-hardening
    status: done
    priority: high
    parallel_group: UI
    core_interface: true
    model: opus
    deps: [T-391, T-338, T-334]
    acceptance: |
      USER 2026-09-16, ITEM (A) OF THE FOUR-PART NAVIGATOR MESSAGE - LOST TO TRUNCATION
      AND RE-FILED AT THE USER'S REQUEST. Items (B) and (C) became T-397; (A) was
      dropped and never became a ticket. The user asked about it "a while ago". Filed.
      THE DEFECT: the LEFT TIME NAVIGATOR overview is badly PIXELATED because its render
      buffer is still as thin as the old ~12 px track, so a few cells stretch across the
      now-wider bar into meaningless blocks. T-391 widened the bar to 92 px; the buffer
      did not follow.
      REQUIRED: render the left time-overview at a RESOLUTION MATCHING THE WIDENED BAR -
      enough frequency bins across its width and enough time rows - so it looks like a
      normal waterfall over a very long time range. Lower-res than the main view is
      fine; BLOCKY GARBAGE IS NOT.
      Use MAX-HOLD when downsampling (same as T-397 for the bottom bar) so narrow and
      bursty signals are not averaged away, and SHARE THE WATERFALL INTENSITY SCALING.
      THE REFINEMENT THE USER ADDED FOR BOTH BARS: real rows at waterfall resolution,
      NEVER ONE CELL STRETCHED. This bar shows a long time range, so its rows are folded
      hard - but they must be ROWS, each a real fold of a real interval, not one row
      scaled up.
      ui-only gate WHERE POSSIBLE - but see the note in T-397: asking for R rows instead
      of 1 may not be a client-side change, and if /api/timeline cannot serve the row
      count this bar needs at the resolution it needs, say so rather than upsampling in
      the client. Upsampling is how the current blockiness happened.
      USER 2026-09-16, COLOURING - fold alongside the resolution / max-hold / multi-row
      work already here. The mini-waterfall strips render in shades of CYAN/TEAL ONLY,
      which does not match the main waterfall. They must use THE SAME COLORMAP AND THE
      SAME SCALING as the main WebGL waterfall, so they read as small versions of the
      real display rather than a monochrome ramp.
      COORDINATOR FINDING - the two halves are in very different places:
      SCALING IS ALREADY SERVED. T-342 made /api/coverage state its range_db and
      normalisation ("0 at range_db.lo, 1 at range_db.hi, linear in dB and clamped"),
      precisely so a strip could not be normalised against a range the response never
      named. Use it; do not re-derive a range in the client.
      THE PALETTE IS IN A SHADER. ui/src/waterfall.ts:73 `vec3 cmap(float x)` is GLSL -
      six stops (near-black, deep blue, cyan, yellow, red, white) with piecewise mixes at
      0.2 / 0.45 / 0.7 / 0.9. The navigator strips are 2D canvas. So "share the colormap"
      means one of two real choices, and they should be weighed rather than defaulted:
        (a) EXTRACT the stops and the mix to shared TS, have the shader and the strips
            both consume one definition - the strips then get the palette without WebGL,
            and a future change to the ramp moves both; or
        (b) RENDER THE STRIPS IN WEBGL too, which shares the code by construction and
            costs a second context per bar.
      COPYING THE SIX STOPS INTO THE CANVAS PATH IS THE WRONG ANSWER even though it is
      the quickest: it is the third place the same ramp would live, and the user is here
      because two renderings already disagree.
      A colormap is presentation, so T-340's ui/src guard does not forbid it - but the
      SCALE must still come from the wire, which is what that guard is protecting.

