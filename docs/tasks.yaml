      puts period_s, duty_cycle and burst_length_s in CLUSTER_FIELDS and compares them with NO across-silence
      exclusion - unlike every other comparison in the codebase, which T-250/T-262 taught to exclude window
      statistics when presence intervals are disjoint. One field at z > 3 separates a pair however much
      else agrees, and these also count toward CLUSTER_MIN_SHARED_FIELDS, so a single disagreeing burst
