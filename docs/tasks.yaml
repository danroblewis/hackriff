  - id: T-396
    title: One diff-aware gate command, so which-tests-to-run lives in the runner and not in agent judgement
    milestone: M2-hardening
    status: done
    priority: high
    parallel_group: CI
    core_interface: true
    model: opus
    deps: [T-358]
    acceptance: |
      USER 2026-09-16, and it SUPERSEDES the prose UI-only-gate rule recorded in
      CLAUDE.md + docs/10 hours earlier. Build `just gate` (or `just check`): it
      inspects the git diff - changed files vs the MERGE BASE for a branch, or the
      staged set - CLASSIFIES them, and runs exactly the needed suites.
      CLASSIFICATION -> SUITES:
        - only under ui/ (and NOT crates/, NOT docs/api.md) -> just test-ui + lint
        - anything touching crates/ or docs/api.md         -> full just test + just acceptance
        - docs-only                                        -> link/lint
        - python-only                                      -> test-py + lint-py
      Wire BOTH CI and the coordinator's per-merge check to call this ONE command,
      extending T-358's "the CI test job is one recipe call", so passing tests is
      enforced deterministically at the gate regardless of which agent ran it.
      Optional backstop: a git pre-push hook or a Claude Code Stop hook that runs
      `just gate` - but CI plus the merge gate is the real guarantee, not the hook.
      Keep full test + acceptance as the periodic/milestone check.
      Record in CLAUDE.md (Engineering) and docs/10, REPLACING the prose UI-only-gate
      rule with "run just gate".
      THE RULE THAT MAKES IT SAFE: classification MUST FAIL CLOSED. Any path that does
      not match a known class runs the FULL gate - never the cheapest. This is the
      repo's own "nothing said is never permissive" applied to the runner
      (BiasTee::Unknown is not Off; Coverage::Unobserved is not quiet). A new
      top-level directory must not silently inherit the ui-only treatment.
      Specifically NOT ui-only, and each for a reason: fixtures/ (acceptance inputs -
      T-317/T-373/T-382 all changed fixture metadata and the suites read it), the
      justfile and .github/ (they ARE the gate - a change to them must be verified by
      the expensive path), plugins/, py/ beyond the python-only class, and anything at
      the repo root.
      It must PRINT its decision - the class it chose and the suites it will run -
      before running them, so a human or an agent can see and challenge the choice.
      A silent classifier is a worse version of the judgement it replaces.
      Note docs-only "link/lint": check whether a link checker actually exists before
      wiring one in. If it does not, say so and wire lint only rather than inventing a
      dependency.
  - id: T-397
    title: The frequency navigator survey strip must fold with max-hold and share the waterfall's intensity scaling
    milestone: M2-hardening
    status: done
    priority: high
    parallel_group: UI
    core_interface: true
    model: opus
    deps: [T-368, T-391]
    acceptance: |
      USER 2026-09-16, items (B) and (C) of a four-part message that REACHED THIS
      SESSION TRUNCATED. What arrived, verbatim and partial:
        "(C) ...tensity - match its intensity scaling/colormap to the main waterfall
         (with the max-hold from B) so signal prominence reads truthfully."
      ITEM (A) AND THE FIRST HALF OF (B)/(C) WERE LOST. What is recoverable is that
      (B) introduces a MAX-HOLD fold for the survey strip, and (C) requires the strip's
      intensity scaling and colormap to MATCH THE MAIN WATERFALL so that prominence
      reads truthfully. CONFIRM WITH THE USER BEFORE BUILDING - the missing half may
      change the fold.
      Why it matters, and why it is core_interface despite looking cosmetic: T-368
      built the strip over the coverage map, where grey means GENUINELY UNOBSERVED and
      Coverage::of refuses to let "never looked" be spelled as "looked and it was
      quiet". A strip with a different intensity scale from the waterfall above it
      makes the same energy read as two different strengths on one screen - which is
      the honesty problem one layer up from the one T-368 solved. Max-hold is the fold
      that stops a brief emission vanishing when many time cells collapse into one
      survey column.
      THE FOLD IS BACKEND (it decides what a column MEANS and must not fabricate
      coverage); the colormap/scaling is thin-client presentation. Split accordingly:
      the fold part takes the FULL gate, the UI part the ui-only gate - the user said
      exactly this.
      Constraint: max-hold must not turn an UNOBSERVED cell into an observed one. A
      column holding some observed and some never-observed cells is partially covered,
      and the strip must still say so - the max of nothing is not zero, it is unknown.
      Keep T-340's guard green: no RF constant or signal logic in ui/src; a colormap
      shared with the waterfall means sharing the CODE, not copying a scale.
      T-342 UPDATE (merged 58cc961): the BACKEND HALF IS DONE. /api/coverage now
      serves a shade block - fold, rule, scale, range_db, normalisation - and an
      unobserved cell carries NO shade key at all, which is stronger than null. The
      max-hold fold is the same one /api/timeline uses, transposed, and hk-store
      pins collapsing_a_window_to_one_row_is_the_max_over_its_columns, which is the
      burst-survives-the-collapse property item (B) needs.
      WHAT REMAINS: the client sharing the waterfall's colormap CODE (not copying a
      scale), and THE USER'S CONFIRMATION of the truncated half of their message.
      That makes the remainder a ui-only change.
      USER REFINEMENT 2026-09-16, and it changes the shape of this ticket: the strip
      currently looks like it renders a SINGLE ROW (one spectrum across the frequency
      range) STRETCHED VERTICALLY to fill the bar height. That is wrong.
      IT SHOULD BE A PROPER MINI-WATERFALL: several TIME ROWS stacked (time down,
      frequency across the survey range), as many rows as fit the bar's height AT THE
      MAIN WATERFALL'S NATIVE ROW RESOLUTION - the same vertical resolution as the big
      waterfall, just a short window of recent history. Each row is a max-hold-folded
      spectrum of the whole survey range.
      NET: the bottom bar is a SMALL RECENT-HISTORY SPECTROGRAM OF THE WHOLE SPECTRUM,
      not one row scaled up. Same principle as T-411's left overview: REAL ROWS AT
      WATERFALL RESOLUTION, NEVER ONE CELL STRETCHED.
      THE ARCHITECTURAL CONSEQUENCE, which the coordinator is flagging rather than the
      user: this is no longer a ui-only change. T-342 delivered the backend half as a
      fold PER FREQUENCY CELL OVER A WINDOW - one row. A mini-waterfall needs
      ROWS x CELLS, which is the SECOND AXIS docs/16 section 2 names as the one real gap
      between what exists and the tile pyramid: "the pyramid is tiered in TIME and
      coverage answers per FREQUENCY CELL over a window; the big view needs both at
      several zoom levels".
      So the bottom bar being a mini-waterfall makes it literally a miniature of T-408's
      big view - which is exactly what the user said it was when they described the
      shared pyramid. DO NOT build a private two-axis query for this bar. Read docs/16
      first; if the answer is that this waits on the pyramid's second axis, say so.
      USER 2026-09-16, COLOURING - fold alongside the resolution / max-hold / multi-row
      work already here. The mini-waterfall strips render in shades of CYAN/TEAL ONLY,
      which does not match the main waterfall. They must use THE SAME COLORMAP AND THE
      SAME SCALING as the main WebGL waterfall, so they read as small versions of the
      real display rather than a monochrome ramp.
      COORDINATOR FINDING - the two halves are in very different places:
      SCALING IS ALREADY SERVED. T-342 made /api/coverage state its range_db and
      normalisation ("0 at range_db.lo, 1 at range_db.hi, linear in dB and clamped"),
      precisely so a strip could not be normalised against a range the response never
      named. Use it; do not re-derive a range in the client.
      THE PALETTE IS IN A SHADER. ui/src/waterfall.ts:73 `vec3 cmap(float x)` is GLSL -
      six stops (near-black, deep blue, cyan, yellow, red, white) with piecewise mixes at
      0.2 / 0.45 / 0.7 / 0.9. The navigator strips are 2D canvas. So "share the colormap"
      means one of two real choices, and they should be weighed rather than defaulted:
        (a) EXTRACT the stops and the mix to shared TS, have the shader and the strips
            both consume one definition - the strips then get the palette without WebGL,
            and a future change to the ramp moves both; or
        (b) RENDER THE STRIPS IN WEBGL too, which shares the code by construction and
            costs a second context per bar.
      COPYING THE SIX STOPS INTO THE CANVAS PATH IS THE WRONG ANSWER even though it is
      the quickest: it is the third place the same ramp would live, and the user is here
      because two renderings already disagree.
      A colormap is presentation, so T-340's ui/src guard does not forbid it - but the
      SCALE must still come from the wire, which is what that guard is protecting.

  - id: T-398
    title: A strong WFM+RDS station takes ~40 s to reach Confirmed when a human sees it in under five
    milestone: M3
    status: done
    priority: high
    parallel_group: M3A
    core_interface: true
    model: opus
    deps: []
    acceptance: |
      USER, live testing 2026-09-16, and the user CORRECTED THEIR OWN EARLIER FRAMING:
      the problem is NOT flicker or stability. It is TIME-TO-CONFIRM LATENCY.
      It takes roughly 40 s for the system to decide 101.3 is FM (reach Confirmed with
      family=wfm). It is obvious in under 5 s - a human sees it instantly, and the
      19 kHz stereo pilot is a SUB-SECOND WFM giveaway. The earlier "40 s stable poll"
      observation caught the tail: it was already confirmed by then.
      THIS DIRECTLY VIOLATES A CLAUDE.md INVARIANT: "Detection is fast, continuous and
      self-cleaning - a region's few real signals should resolve quickly (target
      ~2-10 s)."
      THE WORK, in order:
      1. Replay fixtures/hackrf/capture-2026-09-16-101p3-diag/ FROM COLD START and
         MEASURE, for the 101.3 station: time-to-first-detection, time-to-family=wfm,
         and time-to-Confirmed. Numbers first.
      2. Find WHICH STAGE gates the ~40 s. Named candidates: the candidate->confirmed
         accumulation threshold or trust hysteresis; the classifier's integration
         window; or a requirement to RDS-lock or decode CRC-valid frames before
         confirming. Do not guess - instrument.
      3. SEPARATE BACKEND CONFIRM TIME FROM UI DISPLAY LATENCY. T-388 fixed poll-gated
         box growth but the inventory poll is still 5 s and LIVE_OFFER_NS is 5 s, so
         part of any observed latency is display, not decision. Report the two
         separately or the fix will be aimed at the wrong layer.
      4. Make an obviously-strong, high-SNR signal confirm and classify FAST (target a
         few seconds) WHILE KEEPING FALSE-CONFIRM PROTECTION for genuinely ambiguous
         signals. Use cheap fast evidence - wide occupied bandwidth plus 19 kHz pilot
         lock - to SHORT-CIRCUIT WFM confirmation.
      DoD: a strong WFM+RDS station reaches Confirmed WFM within a few seconds of
      appearing, asserted BLIND on time-to-confirm (not tens of seconds).
      THE DANGER, and the reason this is core_interface: a short-circuit that confirms
      fast is a short-circuit that can confirm WRONG fast. The accumulation threshold
      and trust hysteresis exist to stop false confirms, and T-233's line holds - a
      blind test must never merge two genuinely distinct emitters, and nothing may be
      confirmed as a family the measurement did not support. The short-circuit must
      require POSITIVE evidence (a pilot LOCK, not a pilot-shaped bump) and must fall
      back to the slow path when that evidence is absent, not merely lower a threshold
      for everything. Report what the false-confirm rate does on the existing M3 suite
      (ADR-0016 section 7 floors: unknown recall >= 0.90, top-1 >= 0.90, top-2 >= 0.95,
      wrong-label <= 0.02 overall / 0.05 per bin, false-known <= 0.10).
      Also note the synthetic-vs-live gap the user named: M3 PASSED ON SYNTHETIC while
      this fails live. If a synthetic WFM fixture would have caught it, say what the
      synthetic lacks - that gap is worth more than this one fix.
  - id: T-399
    title: The receiver-line survey has no production caller - classify_box is handed one burst, not a capture window
    milestone: M3
    status: done
    priority: high
    parallel_group: M3A
    core_interface: true
    model: opus
    deps: [T-394]
    notes: |
      T-394 built the receiver-line survey and said plainly it is NOT WIRED IN.
      SymbolEstimator::survey_receiver_lines is the entry point; nothing calls it in
      production. The reason is real, not an oversight: the survey needs at least a
      second of the RAW TUNED SPAN, and hk_pipeline::classify::classify_box is handed
      one burst's samples - 27 ms would pin a line to +/-600 Hz and the "notch" would
      be the whole band.
      So it needs a caller that holds a CAPTURE WINDOW: ring-reader cadence, once per
      capture state, NOT once per classification (which has a documented per-event cost
      bound). The survey is a property of the receiver in a configuration, so it should
      be measured when that configuration changes and reused until it does.
      THIS IS THE EIGHTH INSTANCE OF THE NO-CALLER PATTERN in this repo (T-242, T-247,
      T-206, T-267/T-287, T-297, T-334, T-363-judged-dormant). The others were found by
      audit after the fact; this one was declared at birth with its reason, which is
      the right way round - but it is still a capability that does nothing until it is
      called.
      Until it lands, the measured artefact exclusions from T-373/T-382 remain the only
      protection, and they are per-capture records that do not generalise to a
      different host, capture or temperature - which is the whole reason T-394 exists.
      Also carry forward T-394's unresolved observation: a coherent 9.4 dB bump at
      1316.9 Hz sits below the 12 dB threshold and shows through as one box's argmax.
      It was deliberately NOT chased by lowering the threshold, which would have left
      1.9 dB over the measured null - tuning to one fixture. Revisit only with more
      captures, never by moving the number.
  - id: T-400
    title: just gate regenerates incremental state that every agent is configured to avoid
    milestone: M2-hardening
    status: todo
    priority: normal
    parallel_group: CI
    deps: [T-396]
    notes: |
