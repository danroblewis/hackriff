  - id: T-347
    milestone: M2-hardening
    title: Pause is global run state, so one browser pausing freezes every other browsers waterfall
    status: done
    priority: normal
    deps:
    - T-339
    parallel_group: UI
    core_interface: true
    model: opus
    acceptance: 'T-339 found this while proving pause never reaches the device. POST /api/control/pause
      sets DisplaySettings.paused on the RUN, shared by every connected client - so one browser pausing
      freezes all of them. The user''s invariant says the UI''s time window is INDEPENDENT VIEW STATE, and
      today there are two unrelated mechanisms for what the user describes as one thing: a server-side publish-stop
      (Pause) and a client-side time cursor (scrub). Neither touches capture, so T-339''s invariant is satisfied
      - this is about the split being wrong, not unsafe. Suggested shape from T-339, to weigh rather than
      adopt blindly: Pause becomes pure client view state (stop advancing the time window, keep consuming
      the stream) and /api/control/pause is kept only as a bandwidth or CPU control, or retired. Decide
      with T-337 and T-340''s design in view, since all three are about what is view state and what is world
      state. Whatever is decided, ONE mechanism should serve what the user calls one thing'
    commit: 3f17e0e
    result: |
      FIXED by RETIRING the route, not re-scoping it. A run-wide boolean cannot represent N
      viewers, so no scoping of DisplaySettings.paused was ever going to be right. Removed, not
      hidden: /api/control/pause and /resume (404), DisplayState.paused, DisplaySettings.paused,
      RunControl/PipelineController/DisplayControl::set_paused, the spectrum reader's
      publish-stop, and the Device panel button.
      ONE MECHANISM, AND IT ALREADY EXISTED: the client's `time.live` - {live:true} or
      {live:false, tS, spanS} - already read by the presence push, the inventory window, the
      live-only notes and the box layout. Pausing IS entering the state scrubbing already
      produced, so the time navigator's LIVE control became the one play/pause toggle. No third
      state for "scrubbed but not paused", which is what makes it one mechanism rather than two
      wearing one label.
      IT REJECTED MY STEER toward a per-connection re-scope, and was right: that needs new
      contract surface (consumer identity on the wire, per-consumer suspend in hk-stream) for a
      saving T-348 says to measure first - and T-348's own finding is that the display STFT runs
      BEFORE the publish step, so the old flag saved nothing anyway.
      ROOM FOR T-348 WITHOUT A ROUTE: a paused client closes its stream subscription (reopening
      on Live backfills from history, as a fresh Live view already does). If per-run cost later
      dominates, the honest control is a server-side low-power mode keyed on NO CONSUMERS
      ATTACHED, which the registry can already answer and which is an operator's decision.
      THE TEST IS CROSS-CLIENT because the defect is: two WebSocket consumers, three legs on
      values not status codes - retired routes 404 and run.display carries no `paused`; A pauses
      (on the wire, nothing) and B's rows keep arriving with strictly advancing capture
      timestamps; A stops draining its socket entirely and B still advances 50 rows. 4.76 s, so
      it genuinely waited on rows.
      view_pause_keeps_capture keeps T-339's seam and INVERTS its middle assertion: b.rows == 0
      became b.rows > 0.
      FLAGGED FOR THE USER: a SCRUBBED view now displays "PAUSED". The agent argues that is the
      design statement rather than a mislabel - scrubbing IS pausing under this model - but it is
      the one wording they might want different.
      Verified on the merge: 2303/2303 at --test-threads 8, lint green, ui 29/29.

