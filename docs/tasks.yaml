  - id: T-383
    title: A bounded-wait plugin test fails under parallel load and is not in the heavy-serial group
    milestone: M2-hardening
    status: done
    priority: normal
    parallel_group: PIPE
    deps: []
    notes: |
      Reported independently by T-373 and T-371 in the same hour.
      hk-pipeline::data_path::a_live_chain_feeds_a_plugin_that_never_reports_ready_after_its_bounded_wait
      failed once under parallel load ("the plugin decoded what it was fed") and passed
      alone and on every later run. It is a bounded-wait test; with three or four other
      agents building, the wait expires for the wrong reason.
      Related to T-344 (a different load-sensitive test outside heavy-serial), and the
      two should probably be fixed the same way. .config/nextest.toml already pins the
      heavy/timing-sensitive tests to a serial group; the question is whether this test
      belongs there or whether its bound is simply too tight to be meaningful on a
      loaded machine - a test that asserts a timeout was reached is only as good as the
      machine's idleness.
      It WILL bite the coordinator's full check on a loaded machine, which is how both
      agents met it.
      THIRD INSTANCE (T-320, 2026-09-16): hk-cli::api_contract
      coverage_greys_only_what_was_never_observed_and_names_the_device_that_looked
      timed out at 60 s waiting for spectrum history under parallel agent load, and
      passes alone in 53.2 s. It is sitting 6.8 s inside its own timeout, so it is
      not a race - it is a budget that was set on an idle machine.
      That makes three (T-344, this ticket's original, and now this one) and they
      are one problem: A TIMEOUT IS A STATEMENT ABOUT THE MACHINE, not the code.
      Fix them together, and prefer removing the wall-clock dependency to raising
      the number - T-401 is establishing the capture-clock pattern for exactly this
      reason and its shape should be reused here.
      FOURTH INSTANCE (T-313, 2026-09-16): hk-pipeline::presence_push::
      a_live_signals_box_tracks_the_live_edge_and_stops_when_the_emission_does
      failed under parallel load, passed in isolation and on re-run (2090/2090).
      presence_push.rs is NOT in the heavy-serial nextest group - a new file that
      joined the timing-sensitive set without joining the group that protects them.
      That is the structural half: the group is a hand-maintained list, so every new
      timing test is a silent opt-out. Consider whether membership can be derived
      (a marker on the test, or the file) rather than remembered.
      FIFTH INSTANCE (coordinator, 2026-09-17, T-249's merge gate): the SAME test as
      the third instance, hk-cli::api_contract coverage_greys_only_what_was_never_
      observed..., timed out at 60 s under four concurrent agents and then passed
      ALONE IN 21.1 SECONDS. Note the pair: T-320 measured it at 53.2 s alone, this
      run at 21.1 s. The isolated time varies by 2.5x, so the 60 s budget has
      essentially no headroom on a loaded machine and the test says nothing about the
      code when it fails. It cost a full 7-minute gate re-run to clear a diff
      (classifier score tables) that cannot reach the spectrum-history strip at all.
      That is the concrete cost of leaving this: every load flake makes the coordinator
      re-run the whole gate to find out it was nothing.
    commit: 9e6a6ae
    result: |
      FIXED, and the measurement dissolved most of the premise. T-344 closed in the same diff.
      THE COVERAGE TEST WAS NEVER A LOAD FLAKE. The wait that expires is the SECOND one
      (spectrum-history shade), not the coverage wait, which takes 0.11 s. `shades()` folds with
      nt = 1, so overview_level sizes the tier by the whole 120 s window and reads LEVEL 1 (60 s
      cells). A level-1 cell exists only once a level-0 block seals, and LEVEL-0 BLOCKS ARE
      ALIGNED TO THE UNIX EPOCH. So the wait is (time to the next epoch-aligned 60 s boundary) +
      seal_lag(2 s), a quantity ranging over (2 s, 62 s]. Six consecutive runs matched that
      formula to within 0.1 s (26.86->29.07, 55.67->57.82, 56.03->58.20, 55.78->57.90,
      56.02->58.11, 55.45->57.65).
      A 60 s BUDGET OVER IT FAILS ON A COMPLETELY IDLE MACHINE whenever the run starts in the
      first ~2.2 s of a wall-clock minute - about 3.6% of runs. Every "isolated" figure anyone
      quoted was that phase and nothing else: 53.2 s (T-320), 21.1 s (coordinator), 5.3 s and
      58.2 s (T-383). Load only pushed it over the edge more often.
      Fix: ask the shade values over an explicit 20 s window, resolving at level 0 whose 1 s cells
      the run has actually written. 58 s -> 0.63 s, deterministic. NOTHING WEAKENED - the rule-text
      assertions now also run against the default-window answer, so the test asserts strictly more.
      BOUNDED-WAIT TEST: a budget problem, reproduced BY MUTATION rather than by waiting for luck.
      --start-delay-ms 20000 against settle_s = 2.0 fails on exactly the reported message and
      passes at 30.0. The 2.0 was this test file's own invention; 30 s is PLUGIN_WAIT_STALL, the
      number the chain already uses for the same question on its lossless branch.
      TWO OF THE FIVE INSTANCES WERE STALE. presence_push's named test was contract A's per-poll
      extension record, DELETED by ADR-0019/T-410; the current test has no wall-clock quantity and
      published byte-identical output 6/6 at load 57, so it was deliberately NOT added to
      heavy-serial. T-344's decoded_capture has been in heavy-serial since the commit that created
      the file (T-092, 8866566) - that ticket's title was wrong when written.
      THE STRUCTURAL ANSWER: membership was never the problem. THREE OF THE FOUR TESTS WERE
      ALREADY MEMBERS. `max-threads = 1` serialises the group against ITSELF inside one nextest
      invocation; it does nothing about the ~27 tests running concurrently outside it and nothing
      about four agents building on the same box. Derivation would not have helped either -
      nextest filtersets see only package, binary and test name, so the only derivable marker is a
      naming convention, which is "remembered" relocated rather than removed.
      The rule that DOES generalise is now in .config/nextest.toml where the next person reaches
      for the list: A TEST MAY NOT BOUND A QUANTITY WHOSE NATURAL RANGE IT HAS NOT MEASURED.
      No retry added, no assertion weakened, no scanner built, no name added to heavy-serial.
      Reported not fixed -> filed as T-426.

  - id: T-384
    title: The output and decode surfaces cannot re-derive for a scrubbed window, and the decode route has no time parameter to ask with
    milestone: M2-hardening
    status: done
    priority: high
    parallel_group: UI
    core_interface: true
    model: opus
    deps: [T-379]
    acceptance: |
      The remaining half of the user's cross-cutting rule (CLAUDE.md 2026-09-16):
      every surface is a view over one (time range x frequency range) window and must
      show all the data it has for it. T-379 fixed the waterfall, both navigators and
      the Candidate list. THE OUTPUT/DECODE SURFACES ARE THE OPEN HALF.
      T-379's census: the output panel, decode inspector, status feed, pipelines and
      dock are LIVE-EDGE-ONLY and never subscribe to the cursor. Worse, the feed
      opener exposes no history form, so NO CALLER CAN ASK.
      The backend gap is the root: GET /api/inventory/{id}/decode has NO TIME
      PARAMETER AT ALL, so even a correctly-wired panel could not re-derive for a
      scrubbed window. Meanwhile /api/captures/{id}/frames?from_t=&to_t= EXISTS and
      the whole UI is unaware of it. Establish which of those is the right route for
      this before adding a parameter to either.
      ALSO IN SCOPE, same root cause: ui/src/app/decode/plots.ts still windows frame
      buffers on Date.now()*1e6 (three sites) - the exact wall-clock-against-capture-
      data bug T-379 removed from the inventory path, still live here.
      Hold T-379's standard: ask on the CAPTURE clock; never widen the window to look
      full; distinguish empty-because-unobserved from empty-because-not-fetched using
      hk_store::Coverage rather than a second notion of emptiness; and include the
      control that a window which DOES hold data renders its rows, or every other
      assertion is satisfiable by an always-empty panel that explains itself well.
      Respects the incremental-decode invariant: live decoding EXTENDS a region and
      decodes only the newly-arrived part. Re-deriving a view over past frames must
      not re-decode what is already done.
  - id: T-385
    title: The focus panel tells the user a row was deleted when it is merely outside the window
    milestone: M2-hardening
    status: done
    priority: high
    parallel_group: UI
    deps: [T-379]
    notes: |
      Found by T-379's census. The focus panel caches by emitter id only, so a row that
      is simply outside the current (time, frequency) window renders as "no longer in
      the inventory".
      That is not a missing render - it is a FALSE CLAIM to the user about their data,
      and it is the exact failure mode the exploration-first principle exists to
      prevent: the system asserting something it did not measure. An emitter outside
      the window is unobserved-here, not deleted.
      The fix is to key the cache on the window as well as the id, and to say which of
      the two is true. T-379 built the four-way emptiness vocabulary for exactly this
      (no window / unobserved / observed-and-quiet / coverage unknown) - reuse it.
      Control: an emitter that genuinely WAS deleted must still say so.
