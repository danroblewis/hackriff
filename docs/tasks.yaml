  - id: T-372
    title: Attribute a visit's bias-tee state by switch time, not by whole read
    milestone: M4
    status: done
    priority: medium
    parallel_group: CTX
    deps: [T-359]
    notes: |
      T-359 is deliberately coarse: a chunk read that is mixed anywhere marks EVERY
      visit in it Unknown, including visits lying wholly inside one state, because
      provenance is summarised per read region rather than per time cell. That is the
      safe direction and it stays the fallback.
      The summary's `steps` carry switch timestamps, so a visit can be attributed by
      comparing its extent against them - recovering usable off/on rows either side of
      a switch instead of an interval of Unknown.
      The rule must stay claim-nothing at the boundary: a visit STRADDLING a switch is
      Unknown, not assigned by midpoint. Control: the 9:1 majority case from T-359
      still yields Unknown, i.e. this must not become a dominance rule by the back door.
    commit: 09c9e4b
    result: |
      DONE, and the measurement justified landing it. `BiasTeeTrack::over(start, end)` walks the
      summary's BIAS_TEE steps: a switch at or before start advances the state, a switch STRICTLY
      INSIDE returns Unknown, a switch at or after end is ignored.
      THE PART EASY TO GET WRONG AND GOT RIGHT: the extent is ROW-ALIGNED, over the cells the visit
      actually read, not the visit's raw [start, end). A 1 s time cell containing the switch pools
      frames from BOTH states, so a visit that read that cell straddles the switch even when its own
      timestamps do not. The consequence is exact - a mid-cell switch costs that cell and nothing
      else; a cell-boundary switch costs nothing.
      THE PROHIBITION HOLDS, asserted three ways. A straddling extent names neither side at 9:1,
      1:9, 1:1, and at 999999999 ns : 1 ns in BOTH directions - the rule is not "a wide enough
      margin wins". The row-level fold is untouched: interval_bias_tee still needs unanimity, so
      T-359's own "a row straddling a switch claims neither state" passes unmodified. The
      refinement improves the EVIDENCE under the row and never gives the row a majority verdict.
      MEASURED RECOVERY through the production path - real frames into a real pyramid, sealed,
      reopened, read back via evaluate_band:
        480 visits over a 240 s read with one bias-tee switch -> 240 off, 240 on, 0 UNKNOWN.
        T-359 gave 480 unknown.
      With the switch 400 ms into a 1 s cell: 99 of 100 rows recovered (50 off, 49 on, 1 unknown).
      So the loss is bounded by ONE TIME CELL PER SWITCH, not by the read - the coarse fallback was
      discarding a whole chunk to protect one cell. This is why it was worth landing; had recovery
      been small, the coarse answer would simply have been right, which is what the brief asked it
      to check.
      FAILS CLOSED to T-359's Uniform(Unknown) unless a COMPLETE timeline for a SINGLE front end can
      be rebuilt, each refusal separately asserted: dropped steps; more than one known origin; an
      unknown origin (a pre-format-3 tile is not evidence of one device); frames from another
      origin; a step chain whose `from` disagrees with the previous `to`; two steps at one instant;
      a step whose `from` equals its `to` (what a pre-T-332 tile reads back as); mixed-but-no-step;
      and a first-frame state appearing nowhere in the timeline. Two SITES with one source still
      reconstructs - the tee moved with the device (T-259/T-305).
      Coordinator note: first gate run hit view_pause_keeps_capture at 2490368 samples over a phase
      of 2500000 - BIT-IDENTICAL to what T-406 reported hours earlier on a different tree, 6/6 green
      isolated here. Already filed as T-433's second instance. Re-run passed full.

  - id: T-373
    title: A periodic gain step at fs/8192 puts a 293 Hz comb into every fixture, and nothing excludes it
    milestone: M2-hardening
    status: done
    priority: high
    parallel_group: M3A
    core_interface: true
    model: opus
    deps: [T-317]
    acceptance: |
      T-317 found it while identifying the 100.465 MHz emission, and nearly
      published a wrong answer because of it. The raw stream carries a PERIODIC
      GAIN STEP: samples 0-895 of every 8192-sample period are 0.431 dB lower in
      power than samples 896-8191, over all 13,184 periods. It is stream-wide -
      present in wideband total power, on the receiver's own DC line (27 dB) and
      its reference harmonic (16 dB), and in bands with NO emission at all (23 dB
      at 100.150 MHz). The 2026-09-13 2.4 Msps capture has it too.
      It puts a 292.969 Hz comb (= 2.4 MHz / 8192) with at least 27 harmonics into
      amplitude, and through a channel filter into the DISCRIMINATOR of anything
      narrowband and weak, with sinc nulls of the 896/8192 duty near harmonics 9
      and 18. READ NAIVELY IT LOOKS LIKE A 3.41 ms TDMA FRAME - T-317 chased it as
      one until a control on the receiver's own CW lines exposed it.
      This is the recurring defect family in its purest form: a feature measuring
      the OBSERVATION rather than the SIGNAL. Two jobs, in this order.
      FIRST, establish blast radius: does any SHIPPED analysis read it today?
      hk-classify's cyclic line dimensions (features@4, T-328) are the obvious
      suspect, along with any symbol-rate or cyclostationarity estimator, and the
      acceptance suite runs on exactly these fixtures. Report what is and is not
      affected with measurements, not inspection.
      SECOND, exclude it where it is read: periodicity and cyclostationarity
      analysis must reject n * fs/8192 on these captures. Excluding it must be
      DERIVED from the capture (the artefact is recorded in
      hackriff:provenance.capture_artefact), never a hardcoded 293 Hz - a
      different sample rate moves the comb.
      Control that matters: a GENUINE emission whose symbol rate lands near a comb
      harmonic must still be found. An exclusion that silently eats real structure
      is worse than the artefact.
      Note the source is UNIDENTIFIED - T-317 could not say whether it originates
      in the HackRF, the host USB path, or hackrf_transfer. Identifying it is
      welcome but not required; excluding it is.
  - id: T-374
    title: Nothing can say "these emitters are harmonics of one fundamental nobody can see"
    milestone: M3
    status: todo
    priority: normal
    parallel_group: M3B
    core_interface: true
    model: opus
    deps: [T-317]
    acceptance: |
      A capability gap T-317 proved by having to do the work BY HAND across four
      captures. T-302 gates image/harmonic/IMD attribution on the receive chain,
      which is correct and stays - but it reasons about ONE emitter against the
      device. Nothing reasons about a FAMILY of emitters against an unseen common
      cause.
      T-317's method is the specification: fit f = n * f0 over several emitters in
      DIFFERENT bands, check the residual pins the indices (off-by-one must move
      the intercept by a whole f0), and check the corroborating physics - rms width
      proportional to n, because a fundamental's frequency noise multiplies with the
      harmonic number. Line-shape correlation (T-317 measured 0.967-0.988) is
      further evidence.
      This is the user's "signal relationships / reflection detection" roadmap item,
      and it is device-local reasoning under T-259/T-305: a harmonic family is a
      property of one receive chain plus one emitter, never shared air.
      It must be able to say NO. A fit over enough emitters will always find some f0;
      the control is a set of unrelated real emitters that must NOT be declared a
      family. Per T-233, evidence that can only merge is not evidence.
  - id: T-375
    title: 50 ohm terminator capture - is the oscillator family radiated or conducted?
    milestone: M2-hardening
    status: blocked
    blocked_on: >-
      the user, at the bench. A single 50 ohm terminator capture separates conducted from
      radiated coupling: conducted survives the terminator, radiated does not. It is now the
      open question on TWO artefacts, not one - T-317 could not decide it for the 2.336 MHz
      oscillator family, and T-382 traced a second family to hackriff own ring-reader path. No
      software work unblocks it.
    priority: normal
    parallel_group: HW
    needs: hardware
    deps: [T-317]
    acceptance: |
      USER ACTION, already on the project's needs-the-user list; T-317 gives it a
      concrete question. T-317 identified the 100.465 MHz emission as harmonic 43
      of a free-running ~2.336 MHz oscillator, but could NOT decide whether that
      oscillator radiates into the antenna or couples into the receive chain
      conducted (host supply, USB). All four captures share one antenna and one
      host, and the 20 Msps pair is quantisation-limited, so removing the amp moved
      the family's excess no more than it moved the real stations'.
      A capture into a 50 ohm terminator separates them: conducted coupling survives
      the terminator, radiated does not. Record settings in SigMF as usual.
      This decides whether the emitter is the user's own equipment (fix it) or
      something in the room (catalogue it), and it is the honest close of T-317's
      one open question.
