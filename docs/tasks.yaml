      max-holds, max of occupancy_max, summed frames, mean coverage) plus the grid''s own range_db.
      resolution.source is T-341''s enum (spectrum-history / survey-overview, never live-iq).
      UI: ui/src/app/capture/timeline.ts lost WINDOW_S and reduceActivity; every helper now REQUIRES
      the window span (no default, asserted by a test) and the band renders the served grid to a
      canvas with image-rendering: pixelated (upscale only). Tests: 8 unit tests on the fold in
      hk-store, api_contract the_timeline_spans_the_capture_window_and_draws_it (property: the span
      follows a reconfigured --iq-retention across two servers, 90s then 300s; control: the history
