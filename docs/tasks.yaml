  - id: T-423
    milestone: M2-hardening
    title: docs/16 step 2 - coverage reaches the wire with a time axis, and the invariant gets a test home before any tile exists
    status: done
    priority: high
    parallel_group: PIPE
    core_interface: true
    model: opus
    deps: [T-421, T-419]
    use_cases:
    - AWARE-011
    found_by: 'coordinator (2026-09-17), sweeping docs/16 §7 after T-421 landed step 1 - steps 2, 4, 5 and 7 had no tickets'
    acceptance: |
      docs/16 §7 STEP 2, quoted: "/api/timeline grows a per-cell coverage state; /api/coverage
      grows a time axis. docs/api.md and crates/hk-cli/tests/api_contract.rs together, per T-079,
      asserting the FIELD'S VALUE and not the response shape (T-315's standard)."
      SERVES: T-405 (the survey bar stops reading "sampled, level not retained" for a cell the
      radio was tuned away from) and T-411 (the left time navigator, the same fix on the other
      axis). Both are already merged and both are currently wrong in this specific way, so this
      is a user-visible correctness fix, not plumbing for later.
      UNBLOCKS, and this is the reason to do it now rather than after the tiles: "the invariant
      gets a test home BEFORE any tile exists, which is where it is cheapest."
      THE WORK IS A WIRE CHANGE ONLY. T-421 landed the whole computation in
      hk-store::coverage - `grid_over`, `coarsen` (a SUM), `at_tf`, `by_device_over`,
      `union_grid_over`, `unknown_rows_before`. Read that module first; do not re-derive any of
      it, and do not add a second rasteriser next to it. The readers that feed it
      (hk-api::coverage::ring_spans / observation_spans) already carry whole (t0, t1) intervals
      per segment and per hop visit.
      THE FOURTH STATE IS THE CORE-INTERFACE DECISION HERE, and T-421 deliberately left it to
      you. docs/16 §5.4 names a state distinct from observed and from unobserved: "we no longer
      know whether we looked" - rows lying wholly before the oldest surviving record.
      `CoverageGrid::unknown_rows_before(oldest_record)` names those rows but adds no `Coverage`
      variant, because only the caller that read the observation log knows where the horizon is.
      §5.4 says a third variant is a core_interface change TO MAKE DELIBERATELY. Make it here,
      or state with reasons why the wire should carry it another way - but the wire must be able
      to say it, and it MUST NOT be spelled as grey. Grey means measured-and-nothing-was-there;
      forgetting is not the same claim, and collapsing them is the exact dishonesty this whole
      feature exists to avoid.
      DEVICE STAYS IN THE KEY. by_device_over never merges two radios and union_grid_over wears
      Device::Any with is_named() == false. Per T-259/T-305, whether we looked is DEVICE-LOCAL;
      do not let the route flatten it.
      DoD: /api/timeline and /api/coverage serve per-(t, f) coverage; docs/api.md and
      api_contract.rs updated TOGETHER (T-079); contract tests assert the VALUE of the coverage
      field for a cell the radio was tuned away from - not merely that the field exists (T-315's
      standard, and the failure T-315 was filed for).
    notes: |
      T-421's motivating case is the one to carry onto the wire: a dwell on 100-110 MHz for the
      first 10 s of a 60 s window. The COLUMN answer calls that band Observed for the whole
      window; with six rows, row 0 is observed at duty 1.0 against the row and rows 1-5 are
      Unobserved with sampled().is_none(). Assert that shape through the route.
      Copy T-419/T-421's control discipline: prove a level against LEVEL 0, never against a
      parent. A parent-vs-child assertion can only prove the fold is a fold - the buggy max
      satisfied it at every level while being wrong by f_factor at every level.
      Floors (ADR-0016 §7.1, which T-415 just wrote and which is now the ONE place to quote):
      re-derive with `just acceptance-m3` rather than trusting a number in a brief or a commit
      message. T-415 found that T-404's 0.9480 was real, accurately transcribed, and described
      a commit that never reached main.
      Gate: crates/ + docs/api.md, so FULL. Run the affected suite twice (T-403).
    commit: ed5521b
    result: |
      DONE - docs/16 §7 step 2, with ZERO new arithmetic. T-421's step 1 was complete enough that
      grid_over, by_device_over, union_grid_over and unknown_rows_before were used exactly as they
      landed.
      THE §5.4 DECISION (which T-421 left to the caller that knows where the horizon is):
      "state": "unknown" is a FOURTH VALUE of the cell's existing state field, carrying NO
      measurement keys by the same structural rule as "unobserved", beside a `horizon` block
      (oldest_record_s, unknown_rows, rows) that makes the claim CHECKABLE rather than something
      the client must take on trust.
      NOT a third Coverage variant, for three reasons now in the module header and docs/api.md:
        (1) THE FOLD HAS NO INPUT FOR IT. Coverage is computed from spans and no span carries the
            horizon that produced it. Coverage::of - the one construction site, whose whole job is
            refusing to mint an observation out of nothing - would have to be handed a horizon it
            cannot check to decide a question it was never asked.
        (2) IT IS A PROPERTY OF A ROW, NOT A CELL. A discarded record takes every frequency with
            it. A per-cell variant would permit "unknown at 100 MHz, unobserved at 101 MHz" in the
            SAME ROW, which is unrepresentable in reality.
        (3) A variant breaks every consumer to say something none of them could compute, and
            disturbs the two-variant design that makes state 3 unrepresentable as state 2.
      The horizon is a MIN over consulted sources: a row is knowable if AT LEAST ONE record reaches
      it. With no record at all every row is "unknown" - a server that has forgotten its tune
      history cannot claim the radio was not there. An OBSERVED cell is never relabelled: a
      surviving measurement is itself proof we looked. resolution.grey_rule now says in the
      response that "unknown" is not grey and not a level, naming hatching (T-413) as the drawing.
      THE TRAP WORTH RECORDING: /api/timeline ALREADY HAD a grid.coverage array and IT IS NOT THIS.
      That one is FRAME coverage - it reads 0 both where nothing looked AND where the pyramid's
      byte budget evicted what it saw. Treating it as the coverage plane would have shipped step 2
      as already-done while still being wrong. docs/api.md now carries a table separating the two.
      CONTRACT ASSERTIONS ON VALUES, each with a control the other half cannot satisfy (T-315's
      standard): row 0 observed at duty ~1 AGAINST ITS OWN ROW while rows 2.. are exactly
      {"state":"unobserved"} - one key, so no measurement key at all - with the control that the
      identical window at rows=1 still answers `observed`, i.e. the wrong answer T-405/T-411 were
      reading, asserted as still-wrong-without-the-axis. The column's observed_s is the SUM of the
      rows' and its duty is re-derived against the column's own extent (< 0.25, ~1/6 not 1),
      grounded against the rows themselves and never against a coarser answer per T-419/T-421. A
      window before the oldest record: every cell exactly {"state":"unknown"}, unknown_rows ==
      rows, unobserved_cells == 0, oldest_record_s > t1, asserted != the unobserved cell from
      property 1 AND unknown_rows == 0 inside the live window, so neither state is a constant.
      BEYOND SCOPE AND CORRECTLY SO: three client sites would have collapsed the new value into
      grey - a regression this change itself introduced. CoverageCell.state admits "unknown",
      unobservedCount counts only "unobserved", windowCoverage maps it to its existing null (NOT
      KNOWN), and the survey strip draws it as nothing rather than borrowing grey. ~15 lines. The
      distinct hatched fill belongs to T-405's follow-up once the strip reads the per-(t,f) plane.

  - id: T-424
    milestone: CI
    title: The coordinator's every gate runs full, because two permanently-untracked user directories force fail-closed
    status: done
    priority: normal
    parallel_group: CI
    deps: [T-396]
    found_by: 'coordinator (2026-09-17), merging T-415 - a docs-only ADR edit classified full'
    acceptance: |
      MEASURED WHILE MERGING T-415. `just gate --dry-run` in the main working tree reports:
        fixtures/hackrf/capture-2026-09-16-101p3-diag/iq.sigmf-data  [full] acceptance input
        fixtures/hackrf/capture-2026-09-16-101p3-diag/iq.sigmf-meta  [full] acceptance input
        tools/fm_rx.py       [full] unclassified path - the gate fails closed
        tools/sweep_plot.py  [full] unclassified path - the gate fails closed
      Both directories are UNTRACKED AND PERMANENT: tools/ holds the user's HackRF experiments
      and is explicitly never committed (CLAUDE.md), and the 101p3 diagnostic capture is a
      fixture that is never staged. The gate counts untracked files DELIBERATELY (T-396) and
      fails closed on unclassified paths - both correct rules. Their combination in the
      coordinator's tree is not: the diff-aware gate degrades to ALWAYS-FULL in the one place
      it was built to save time, and it does so for files that can never be part of any merge.
      MEASURED COST: T-415 was a single-file ADR text edit. Default classification: full
      (lint + test + acceptance-ci, ~7 minutes). Correct classification: docs, NOTHING TO RUN.
      T-409 was ui-only - `just test-ui`, ~10 seconds - and would also have been charged full.
      THE FIX IS PROBABLY NOT IN THE CLASSIFIER. `just gate --staged` already gives the honest
      answer, and for a MERGE gate it is the right source: during `git merge --no-ff
      --no-commit` the index holds exactly the merge result versus HEAD, which is exactly what
      is about to be committed. The default (working tree, untracked included) remains right
      for an AGENT checking its own uncommitted work.
      SO THE LIKELY ANSWER IS DOCUMENTATION plus possibly a `just gate-merge` alias, and the
      ticket exists to make that a decision rather than a habit I drift into.
      CARE REQUIRED, and this is why it is a ticket and not an edit: --staged is NARROWER than
      the default, and T-396's own rule is that the gate must not certify its own weakening.
      Establish and write down WHY the narrowing is sound here - the argument is that untracked
      files cannot become part of main, while noting the one real counterexample: an untracked
      fixture CAN change acceptance results, and a docs-only classification skips acceptance
      entirely. Decide whether that counterexample matters (a docs-only merge skips acceptance
      by design regardless) or whether it argues for something narrower than a blanket --staged.
      DoD: a decided, written rule in docs/10 + CLAUDE.md for which source the coordinator's
      per-merge gate uses and why, with the weakening argument stated explicitly rather than
      assumed. If a recipe is added, py/tests/test_gate.py covers it.
    notes: |
      Do NOT "fix" this by adding tools/ or fixtures/ to a gate ignore list. fixtures/ is full
      for a real reason - the suites read it - and the classifier having a silent ignore list is
      precisely the shape of self-weakening T-396 wrote the fail-closed rule to prevent.
    commit: 6df409c
    result: |
      DONE, and the reframe is the answer: IT IS NOT "IGNORE SOME FILES", IT IS "CLASSIFY THE RIGHT
      DIFF". Two subjects, two sources - `just gate` (unchanged) for an AGENT checking its own work,
      where untracked counts because a file nobody has git-added yet is still about to be committed;
      and the new `just gate-merge` for the COORDINATOR inside git merge --no-ff --no-commit, where GIT
      ITSELF built the index as the merge result versus HEAD and `git commit` commits the index. THE
      INDEX IS THE CHANGE BEING CERTIFIED.
      THE WEAKENING ARGUMENT, since this IS a narrowing: it classifies a strict subset and classify()
      is monotone (any full path forces full), so a smaller input can only be cheaper or equal. Three
      things make it sound:
        (1) for the merge subject the DEFAULT is the wrong question - untracked files are not in the
            index and cannot reach main through that merge;
        (2) THE COUNTEREXAMPLE DOES NOT SURVIVE CONTACT - an untracked fixture can change what a suite
            sees, but classifying untracked paths as full never protected against that, because the
            suites read the WORKING TREE. Fail-closed on untracked buys COST, NOT SAFETY, for this
            subject; contamination is a property of where suites run, not of how the diff is classified;
        (3) it is GUARDED - it REQUIRES MERGE_HEAD (or SQUASH_MSG) or forces the full gate, which a
            blanket --staged would not do and is exactly why the recipe is --merge; and every
            uncommitted path it did not classify is PRINTED with the class it would have had. No ignore
            list, no exempt path: fixtures/ or tools/ STAGED INTO a merge is still full.
      MISUSE STATED: gate-merge inside a real merge while the tree holds an unstaged edit to something
      the suites read means that path is classified out - printed in the `outside` list every time. The
      residual risk is delayed discovery of a problem existing only in the coordinator's tree, never a
      change reaching main unverified.
      DELIBERATELY NOT DONE: generalising T-437's "prove this path inert". A proof argued in a merge
      commit is categorically different from a list the classifier consults silently, and generalising
      it would require the classifier to model what each suite reads - itself a weakening surface.
      Noted in docs/10 as earning its own ticket if it recurs.
      FIRST PAYOFF, same hour: T-440's merge classified `ui` -> just test-ui instead of the full
      ~25-minute gate it would have drawn purely because of untracked tools/.
      Verified live from inside its own merge; it classified ITS OWN diff as full, because it touches
      justfile and the classifier's source.
    commit: 6df409c
    result: |
      DONE. THE REFRAME IS THE ANSWER: it is not "ignore some files", it is "CLASSIFY THE RIGHT DIFF".
      `just gate` (unchanged) asks "what is in my tree that isn't on main?" for an AGENT, where
      untracked counts because a file nobody has git-added is still about to be committed. New
      `just gate-merge` asks "what will this merge put on main?" for the COORDINATOR inside
      git merge --no-ff --no-commit, where GIT ITSELF built the index as the merge result vs HEAD and
      `git commit` commits the index. THE INDEX IS THE CHANGE BEING CERTIFIED.
      WEAKENING ARGUMENT (it IS a narrowing): it classifies a strict subset and classify() is monotone,
      so a smaller input can only be cheaper or equal. Sound because (1) for the merge subject the
      default is the WRONG QUESTION - untracked files cannot reach main through that merge;
      (2) THE COUNTEREXAMPLE DOES NOT SURVIVE - an untracked fixture can change what a suite sees, but
      classifying untracked as full never protected against that, since the suites read the WORKING
      TREE. Fail-closed on untracked buys COST, NOT SAFETY, here; contamination is about where suites
      run, not how the diff is classified. (3) GUARDED - it REQUIRES MERGE_HEAD or forces the full
      gate, which a blanket --staged would not, and every unclassified path is PRINTED with the class
      it would have had. No ignore list: fixtures/ STAGED INTO a merge is still full.
      MISUSE STATED: an unstaged edit to something the suites read is classified out, and printed in
      the `outside` list. Residual risk is delayed discovery of a problem only in the coordinator's
      tree, never an unverified change on main.
      NOT DONE: generalising T-437's "prove this path inert" - a proof argued in a merge commit differs
      categorically from a list the classifier consults silently, and generalising it would need the
      classifier to model what each suite reads, itself a weakening surface.
      FIRST PAYOFF SAME HOUR: T-440's merge classified `ui` -> just test-ui instead of the full
      ~25-minute gate it would have drawn purely because of untracked tools/.

  - id: T-425
    milestone: M2-hardening
    title: The retune seam gap is BIMODAL - 40% of runs land at 1.32 row periods against a 1.5 threshold, with a bit-identical value
    status: done
    priority: high
    parallel_group: PIPE
    deps: [T-417, T-383]
    found_by: 'coordinator (2026-09-17), measured on clean main while gating T-416'
    acceptance: |
      MEASURED, NOT INFERRED. hk-cli::api_contract::a_retune_keeps_connected_stream_consumers_
      connected fails on CLEAN MAIN, with no merge staged, 4 of 10 runs - and the failure value
      is BIT-IDENTICAL every single time:
        "at least one row's worth of time must be MISSING at the seam, not filled:
         gap 0.052906667 s against a 0.040106667 s row period"
      The assertion is `gap_s > period_s * 1.5`, i.e. 0.0529 against a required 0.0602. So the
      seam lands at 1.32 row periods, NOT below one - the panic message undersells its own
      threshold and should be fixed to state 1.5 while you are here.
      THIS IS NOT JITTER AND NOT THE T-383 FAMILY. Jitter would spread the value; this is two
      discrete outcomes, and the failing one repeats to the nanosecond. Something about the
      retune either does or does not cost one extra row - a retune landing mid-row versus on a
      row boundary is the obvious hypothesis, and the fixture's row period (0.0401 s) against
      the observed gap (0.0529 s) says the difference is about 0.0128 s, roughly a third of a
      row. MEASURE IT before assuming.
      CONFIRMED NOT A REGRESSION FROM T-416: the same 10-run measurement was taken on main
      before merging it, and 8 runs on the merge gave 3 failures - 40% vs 37.5%, indistinguishable.
      WHY IT MATTERS MORE THAN ITS SIZE SUGGESTS: at 40% it fails roughly every other full gate,
      and nextest's fail-fast then cancels ~384 remaining tests, so ONE bimodal seam hides the
      state of a fifth of the suite. It already cost one full gate re-run today. It has also
      been misfiled twice as a load flake (T-249's agent saw it under load; T-416 believed it
      had caused it and "fixed" it with an unrelated drop(cr) that was a real improvement for a
      different reason).
      DoD: explain the bimodality with a measurement - which code path produces the two
      outcomes and why. Then either make the seam deterministic, or make the assertion measure
      the quantity that is actually invariant. DO NOT simply lower 1.5 to 1.2: T-383 just
      established the standing rule for this repo - A TEST MAY NOT BOUND A QUANTITY WHOSE
      NATURAL RANGE IT HAS NOT MEASURED - and loosening a bound to fit an unexplained bimodal
      distribution is the same error in the other direction. The honesty constraint the test
      defends is real (T-410's open cap, T-413's hatched revoked gap): a break in the data while
      the front end moves is TRUE and must stay visible, so the fix must not be to let the seam
      be papered over.
    notes: |
      RATE RE-MEASURED 2026-09-17 by the coordinator, on main at 0f5399c, nothing staged:
      7 OF 10 FAIL, up from the 4 of 10 recorded above. The failing value is STILL bit-identical
      (gap 0.052906667 s against a 0.040106667 s row period), so the bimodality is unchanged -
      what moved is how often it lands on the failing branch.
      Five merges landed in between: T-416 (5017fe1), T-402 (0c8fad1), T-383+T-344 (9e6a6ae),
      T-422 (5a717f1), T-423 (ed5521b). Two are worth knowing about:
        T-416 TOUCHED THIS EXACT QUANTITY AND BELIEVED IT WAS FIXING IT. Its declining chain held a
          ChainReader across a write, back-pressuring the capture thread in lossless replay and
          "shrinking the retune seam gap by two row periods"; it measured 2/6 failing on its branch
          against 0/6 on main at the time, fixed it with drop(cr), and got 4/4 clean. So a change
          that PROVABLY IMPROVED the seam on its own branch now sits on a main where the rate has
          GONE UP. Either there is more than one contributor, or that fix moved the distribution
          rather than removing the cause.
        T-383 edited crates/hk-cli/tests/api_contract.rs - the same file, a different test (the
          coverage/shade wait). Probably unrelated; rule it in or out rather than assuming.
      The agent was told directly, and told to report the before-rate IT measures rather than mine.
      At 70% this is worse than filed: fail-fast now cancels most of the suite most of the time.
      Read T-383's result first - it is the worked example for how to take this kind of
      measurement, and its conclusion (an epoch-aligned quantity ranging over (2, 62] under a
      60 s bound) is exactly the shape of answer to look for here.
    commit: 695f4eb
    result: |
      FIXED, and the diagnosis inverted the ticket. THE SEAM WAS NEVER THE VARIABLE.
      Row-level tracing shows the identical sample grid every run: last old-window row at sample
      2158592, first new-window row at 2293760 carrying STREAM_START|RATE_CHANGE|GAP|
      PROVENANCE_CHANGE, exactly 52.906667 ms later. The gap decomposes as
          gap = hole + period_old + n x period_new
        hole = 12.8 ms of genuinely missing capture time (settle discard + what the re-plumb
          consumed) - ABOUT A THIRD OF A ROW, NEVER A WHOLE ONE. So "at least one row's worth of
          time must be MISSING" was never true of this system, and the 1.5 x period bound
          (60.2 ms) sat ABOVE the real seam of 52.9 ms.
        period_old = 40.107 ms (96256 @ 2.4 MHz); period_new = 40.0 ms (192000 @ 4.8 MHz).
        n = NEW-WINDOW ROWS THE CONSUMER NEVER RECEIVED. bridge::watch_peer looked for the
          replacement publisher once per WATCH_TICK (50 ms) while the new segment fills its first
          row in ~40 ms - a phase race, n in {0,1,2} giving 52.9 (fail), 92.9, 132.9.
      Proved by mutation BOTH WAYS: WATCH_TICK = 1 ms makes the old assertion fail 6/6 at exactly
      52.906667; 200 ms makes it pass 4/4. THE OLD BOUND ONLY EVER PASSED BECAUSE ROWS WERE BEING
      DROPPED IN DELIVERY.
      THE FINDING THAT CHANGED THE FIX: a mutation that PAPERS THE SEAM OVER COMPLETELY - every
      row's timestamp continuing the previous cadence across segments - PASSED ON MAIN, because the
      dropped rows forged a gap that was not there. So this was never "deterministic seam OR better
      assertion": no assertion here means anything until the delivery loss is gone. Both were done,
      in that order.
      THE DELIVERY LOSS IS A PRODUCT BUG. Every retune was silently swallowing the new window's
      first rows with NO DROP MARKER, making each retune look like a longer break in the air than
      it was - on a surface whose entire purpose is that a break in the data must be TRUE.
      watch_peer now waits on the registry's offer generation (a Condvar, wait_for_offer_after):
      0.15-0.8 ms to re-subscribe instead of up to 50 ms. Peer/drain detection unchanged.
      The assertion now bounds what is INVARIANT: the first new row begins strictly later than ONE
      row period after the last old row. period_old is not fitted - it is the exact value a held,
      repeated, interpolated or back-filled seam produces - and it stays a LOWER bound, since a
      stalled consumer losing rows can only push the measurement up. No upper bound, because n has
      no measured ceiling (one run in eight showed a 560 ms stall). Plus: no step after the seam is
      shorter than the new window's period, so the hole cannot be squeezed back in. With both, the
      papering mutation FAILS 4/4.
      RATES (agent, at branch point 651335f): before 2/14 idle and 4/10 under 12-way load; after
      0/12 and 0/12. Plus 6/6 pass in the WATCH_TICK = 1 ms configuration where the old assertion
      failed 6/6.
      MY 40% AND 70% READINGS WERE THE SAME COIN AT DIFFERENT LOADS - the rate is a property of the
      MACHINE, not of the tree - so no merge moved it. T-416's drop(cr) changed re-plumb timing and
      therefore the phase: it moved the distribution, not the cause, which is exactly why it
      measured 2/6 then 4/4. T-383's edit was 5600 lines away in the coverage test: ruled out.
      New guard `the_carry_over_re_subscribes_on_the_offer_not_on_the_watch_tick` bounds the
      re-subscribe at 25 ms (half a tick, 30x the measured worst case); fails 2/3 against pre-fix
      polling, passes 10/10 under load.
      Coordinator verification: 12/12 passes on the merge against 7/10 FAILING on main an hour
      earlier; full gate passed. A first gate run hit
      the_band_collapsed_activity_series_is_measured_and_states_its_fold, which passes 6/6 isolated
      and passed on the re-run - the load family, not this diff.
      FOUND NOT FIXED -> T-430 (coverage per-cell test bounds inter-request latency) and the
      tuned-in-place residue: Output::reoffer finishes the old publisher and offers the new one
      microseconds apart, so no re-attach can win that race and ~1 row is still lost there.
      Removing it needs consumer carry-over at the publisher - an hk-stream contract change.

  - id: T-426
    milestone: M2-hardening
    title: /api/coverage serves no shade for the first minute of a server's life though the finer levels hold the data
    status: done
    priority: normal
    parallel_group: PIPE
    core_interface: true
    deps: [T-383]
    found_by: 'T-383 (2026-09-17), while root-causing the coverage test - reported deliberately unfixed'
    acceptance: |
      T-383 found this while establishing that the "load flake" was an epoch-alignment problem,
      and deliberately did not fix it because it changes documented fields.
      On the DEFAULT capture window, /api/coverage serves no shade for the first minute of a
      server's life EVEN THOUGH THE FINER LEVELS HOLD THE DATA, because `overview_level` takes
      the COARSEST ADEQUATE TIER and never falls back to a populated finer one. Level-0 blocks
      are aligned to the Unix epoch, so a level-1 cell does not exist until the first aligned
      60 s boundary has sealed - while level 0 has had 1 s cells all along.
      THIS IS THE USER'S OWN RULE VIOLATED (CLAUDE.md, 2026-09-16): "Whenever data exists for
      that window it must be shown; a surface may render grey/empty ONLY where data genuinely
      does not exist. 'We have it but didn't render it' is a bug." It is the same failure as the
      black Live waterfall and the fixed-size grey block, one layer down.
      It is core_interface because it changes `level` and `src_t_cell_s`, which /api/timeline
      documents - so docs/api.md and api_contract.rs move together (T-079).
      DoD: a populated finer tier is used when the coarsest adequate one is empty, with the
      served `level` telling the truth about which tier answered. Assert the VALUE for a window
      in the first minute of a server's life (T-315's standard).
    notes: |
      T-383 named this in the coverage test's own comment so it could not be lost. The fix
      interacts with T-423's new coverage plane - read that first.
    commit: a934419
    result: |
      FIXED. ADEQUATE IS A CEILING, NOT A TARGET - the reframe that makes the fix small. A tier is
      adequate when its time cells are no larger than one drawn column AND its grid fits the cell
      budget; every tier FINER than the coarsest adequate one satisfies both, so the adequate tiers
      are a RUN of the ladder and the coarsest is only PREFERRED (reading finer costs cells for
      detail the fold immediately collapses). The fallback therefore relaxes nothing - it picks a
      different member of the set the rule already admitted. overview_level -> overview_levels
      (candidates, preferred first); overview_read takes the first that holds anything.
      FINER IS THE SAFE DIRECTION: T-334's warning is about src_t_cell_s LARGER than the drawn cell,
      where one measured value repeats across columns. A finer source is the opposite - more
      resolution than asked for, folded onto the identical grid - so it needs no warning and fakes
      nothing. THE WALK IS ONLY EVER DOWNWARD: coarse tiles are rolled up from fine ones, so a
      coarser tier cannot hold what a finer one lacks.
      /api/coverage's shade block had NO tier field at all, so the fallback would have been invisible
      exactly where the defect lived. It now carries level, src_t_cell_s, src_f_cell_hz, level_rule.
      THE BEST PART IS A TEST THE AGENT DELETED: its first version used a 30 s budget and THE MUTANT
      PASSED IN 19.5 s, because the old code does eventually shade once the minute seals. Any budget
      over 2 s lets this defect wait its way to green - the same clock dependency that spent a month
      logged as a load flake (T-320/T-383). The wait was removed entirely: one request, one answer,
      8.5-10.3 ms over four runs, with the level asserted under a phase computed from a clock read
      BEFORE the server starts. The control lives where no clock is involved: level 1 asserted empty,
      level 0 answers, then seal_through and the same call flips back to level 1.
      Coordinator verification: three runs at default concurrency each failed a DIFFERENT
      timing-sensitive test, all green isolated, none reachable from a pub(crate) hk-api change; the
      full suite then ran 2298/2298 with NO exclusions at --test-threads 8. That observation became
      T-436.

  - id: T-427
    milestone: M3
    title: pulsed/pulse is the fourth broken hand-written class table - top-1 0.000, wrong-label 1.000 at gate+5
    status: done
    priority: normal
    parallel_group: M3A
    deps: [T-422]
    use_cases:
    - SIGNAL-062
    found_by: 'T-422 (2026-09-17), measured while fixing fsk and psk-qam; recorded in code'
    acceptance: |
      The fourth instance of the same family. T-249 fixed analog (the last hand table, as it was
      then believed); T-422 fixed fsk (the actual last one) and found psk-qam's failure was in
      the verifier instead. `pulsed`/`pulse` measures top-1 0.000 with wrong-label 1.000 at
      gate+5 - a class that is never named correctly and always named confidently wrong.
      DoD follows T-249's and T-422's form, which is now well established: state the MEASURED
      cause before proposing a fix, and name WHICH DIMENSION fails to separate the classes. The
      four causes found so far, as hypotheses to test in order:
        - a conjunction written from noiseless physics whose feature is noise-limited at this
          geometry (T-249's cw: sigma_af < 0.02, unreachable until ~28 dB, 18 dB above gate);
        - a tie broken by a feature that does not measure what its name says, resolved
          ALPHABETICALLY (T-249's ssb vs am on carrier_line_db);
        - a constant written at the transmitter against a feature measured after the receive
          filter (T-422's gfsk: if_bimodality < 0.66 against a channel filter that already
          smoothed both classes);
        - a post-sync verifier re-ranking a correct tree call away (T-422's msk and qam16).
      Then fix the call or withhold it below a DERIVED gate with a recorded reason
      (T-297/T-311/T-312), never a confidently wrong name. Pin properties, not numbers.
      Family floors: quote ADR-0016 §7.1 and RE-DERIVE with `just acceptance-m3` - see T-428,
      which is live on exactly this point.
    commit: 6c860da
    result: |
      FIXED. `pulsed`'s table was `duty > 0.25 -> ppm 0.65 / pulse 0.35` - "a position-modulated
      train keys twice per bit, so it is busier than a radar PRI", true AT THE TRANSMITTER. But
      `duty` is #{a[i] > 0.5 x mean(a)} / n: a fraction over a threshold set by the snippet's OWN
      mean envelope, and for a sparse train that mean is dominated by the OFF time, so the
      threshold collapses toward the noise and the noise clears it.
        class  true   10dB    15dB    20dB    25dB    30dB
        pulse  0.050  0.655   0.538   0.200   0.143   0.051
        ppm    0.333  0.471   0.415   0.400   0.392   0.390
      The ranges CROSS between 15 and 20 dB and below the crossing THE ORDER IS INVERTED - the
      5%-duty radar train reads a HIGHER duty than the 33%-duty PPM train. The 0.25 threshold was
      right only in the 20-25 dB window where the two straddle it, which is exactly why `pulse` was
      1.000 wrong at gate+5 (15 dB) and 1.000 correct at gate+10 (20 dB).
      THE DIMENSION: `duty` does not distinguish a sparse pulse train from a busy one; it
      distinguishes a HIGH-SNR snippet from a LOW-SNR one. A fifth variant of the family - here the
      constant and the feature share a name AND units and still measure different quantities. It is
      also the exact case T-429 was filed for an hour earlier: `duty` IS one of the 30 features the
      observation guard covers, and passes it every run because that guard holds SNR at 25 dB.
      THE TOP-2 TELL DOES NOT APPLY TO THIS FAMILY, and noticing that is the better half of the
      work. `pulsed` has TWO classes, so top-2 is 1.000 BY CONSTRUCTION whenever a name is given -
      the baseline's top-1 0.00 / top-2 1.00 looks like T-422's signature and carries no
      information. The replacement diagnostic is the densities' own arg-max, already right 6/6 for
      both classes at every SNR from 10 to 30 dB, on dev and blind, margins 53-70 nats: T-249's
      shape, evidence fitted and on disk with the call site not reading it. The verifier is not
      involved (skips `pulsed` with NoModel), so not T-422's cause 4.
      FIX: `pulsed` routes through density_classes. No gate derived - no bin left to withhold.
      GUARDRAIL FOUND WHILE FIXING IT: the 19:1 candidate clamp does not bound what its comments
      claim for a SMALL family. It caps the leader at 19/(19+K-1) - 0.826 at K=5, 0.864 at K=4, but
      0.95 AT K=2, above the 0.9 this repo calls confident. Routing `pulsed` through it unchanged
      would have made it the one place a wrong name can return at p >= 0.9 (T-422's 0.903 hazard).
      CLASS_MAX_P = 0.87 is read off that same arithmetic, fitted to nothing, clamping to whichever
      bound binds; for K >= 4 the 19:1 clamp still binds and no score changes. Pinned by a new unit
      test.
      MOVED: pulsed/pulse at gate+5 top-1 0.000 -> 1.000, wrong 1.000 -> 0.000. Diffing the whole
      T-206 report against stashed main gives EXACTLY ONE CHANGED LINE. ppm unchanged. Family-level
      re-derived and bit-identical.
      MEASURED AND FILED, NOT CHANGED -> T-431: the same inflation costs `pulse` its FAMILY at the
      gate. At 10 dB it measures 0.630-0.680, clears PULSED_MAX_DUTY (0.60) and is denied `pulsed`
      for continuous_envelope - a 5%-duty radar train ruled out of the pulsed family for being
      always on. That is an admissibility gate and moving it moves a family-level number.

  - id: T-428
    milestone: DOCS
    title: Four agents measured the same held-out unknown recall on main and got two different answers
    status: done
    priority: high
    parallel_group: DOCS
    deps: [T-415]
    found_by: 'coordinator (2026-09-17), reconciling four agent reports after T-415 landed §7.1'
    acceptance: |
      T-415 established ADR-0016 §7.1 as the ONE canonical set, with a population named per
      figure and `just acceptance-m3` as the re-derivation command. Within the same day, four
      agents re-derived the held-out unknown recall ON MAIN and split two-two:
        T-249  -> unknown recall 0.9444 / false-known 0.0556
        T-421  -> 0.9520 / 0.0480   ("matched your stated values exactly")
        T-416  -> 0.9520 / 0.0480   ("I ran the same command on main: identical")
        T-422  -> 0.9444 / 0.0556   ("predates my diff. Worth feeding to T-415")
      Each measured what it believed was merged main; T-422 additionally re-ran under stash to
      confirm the figure predated its own diff. §7.1 records 0.9520 / 0.0480.
      THE 216-SNIPPET READING IS NOT THE EXPLANATION - T-415 measured that at 0.9954 / 0.0046,
      which matches neither. So this is a THIRD population, a non-determinism, or main genuinely
      moving between measurements. All three are worth knowing, and they need different fixes.
      WHY HIGH: this is the exact failure §7.1 was written to end, appearing the same day §7.1
      landed. If the canonical number itself is not reproducible then every "no floor moves"
      claim in every brief is unfalsifiable, and the stash-and-measure protocol - which is the
      one defence we have - returns a different answer depending on who runs it.
      DoD: determine WHICH of the three it is, with the commits each agent actually measured
      (their worktrees are gone, but their merge bases are in the git history and each reported
      its own branch point). If it is non-determinism, find the source and either remove it or
      state the figure with its spread instead of four decimal places - a number quoted to 4 dp
      that varies in the 3rd is worse than a number quoted with its range. Update §7.1 with what
      is actually true, including how many runs back the claim.
    notes: |
      Related: T-415's own finding, that T-404's 0.9480 was real and accurately transcribed but
      described a pre-commit tree that never reached main. That was a third failure mode nobody
      had enumerated. This may be a fourth.
      Note that the two family figures everyone agrees on (top-1 0.9345, top-2 0.9861) are
      computed by a different path from unknown recall / false-known. Whatever this is, it is
      specific to the open-set numbers - which is a clue, not a coincidence.
    commit: b573283
    result: |
      RESOLVED - and it was NONE of the three explanations I posed. A THIRD POPULATION, with both
      figures printed by the SAME RUN of the SAME COMMAND.
      NOT non-determinism: 9 runs on 651335f returned identical per-generator breakdowns and
      identical aggregates, byte-identical across 4 full-binary runs. Structurally there is
      nowhere for it to come from - the classification path takes no hk-dsp compute provider, so
      thread count and machine load never reach it.
      NOT main moving: the command was run on SEVEN commits spanning 2026-09-17 (41f6aa1, ca40832,
      d7ccd59, 522f94c, 9e6a6ae, 5a717f1, 651335f), straddling both that touched hk-classify, and
      read 0.9520 / 0.0480 at EVERY one. The branch points did not line up with the split either -
      T-416 branched BEFORE T-249 landed and reported 0.9520, T-422 branched after and reported
      0.9444 - which was the first sign the tree was not the variable.
      WHAT IT IS: `just acceptance-m3` prints TWO held-out readings under the same name in one run.
        m3_grid.rs::held_out, seeds ACCEPTANCE_SEED_BASE+700_001.. - THE GATE - 377/396 = 0.9520
        hk_classify::harness, seeds CONTINUING the synthetic-acceptance sequence - a different 396
          snippets, same 11 generators - 374/396 = 0.9444
      Same denominator, different draw. Nobody misread and nobody was stale: each agent quoted
      whichever line it scrolled to.
      The two also SCORE differently (gate: family=="unknown" OR open_set_score>=0.5; harness:
      family=="unknown" alone) - the obvious suspect, and NOT the cause. Instrumenting held_out()
      to count both predicates over the gate's draw gives 377 EITHER WAY. The open_set clause
      contributes zero; the whole 3-snippet gap is the seed range.
      THE FOURTH DECIMAL PLACE WAS NEVER DEFENSIBLE. Re-running the gate's own draw at eight seed
      bases: 370, 377, 377, 377, 378, 379, 380, 381 of 396 - 0.9343 to 0.9621, mean 0.9530, sd
      0.0084. THE DISAGREEMENT THAT PRODUCED THIS TICKET IS 0.0076 - under one standard deviation
      of the same quantity on identical code.
      §7.1 now carries its RUN COUNT (9 runs / 4 runs per figure, plus the 7-commit sweep, stated
      as measured rather than assumed), pins the unknown-recall row to its seed range, and says
      explicitly that two other held-out readings are printed by the same command and neither is
      the gate. HOW TO QUOTE IT: the gate's assertion stays exact (377/396, what CI checks); a
      brief citing it as a do-not-regress baseline quotes ~0.95 (draw sd 0.008; a +/-0.02 move is
      noise).
      NEW §7.2 records this as a FOURTH failure mode, distinct from the three already there: one
      metric name over two draws from one command, where the quantity's own sampling spread
      exceeds the gap being argued about.
      The stash-and-measure protocol gains its blind spot IN WRITING: it establishes which TREE was
      measured and cannot catch reading the wrong LINE. T-422 followed it correctly and still got
      0.9444.
      Harness markdown Summary rows relabelled so the non-gate draw identifies itself in the output
      - where the next agent will actually look.
      FLAGGED, OUTSIDE SCOPE: a FIFTH draw of this same metric exists in
      crates/hk-classify/tests/accuracy_sweep.rs:272, on its own seeds, also printed as "held-out
      unknown recall". Not in acceptance-m3, so out of scope here, but the same trap.
      No regression found - the floor is met at every commit measured.

  - id: T-429
    milestone: M3
    title: The observation guard varies ONE axis - record length - and holds SNR fixed at 25 dB, so every SNR-dependent feature is invisible to it
    status: done
    priority: high
    parallel_group: M3A
    core_interface: true
    model: opus
    deps: [T-404, T-427]
    use_cases:
    - SIGNAL-062
    found_by: 'coordinator (2026-09-17), reading feature_length_invariance.rs after T-427 reported `duty` measures the SNR'
    acceptance: |
      THE GUARD IS GOOD AND IT WORKS. crates/hk-classify/tests/feature_length_invariance.rs is 932
      lines covering 30 features, it found SEVEN defects on its first run (all fixed by T-404), and
      its exemption discipline is the right one - exempt BY NAME, each exemption carrying the
      mechanism and a measurement, so fixing one makes the exemption disappear from a diff.
      IT VARIES EXACTLY ONE AXIS. Line 110-112:
        /// SNR the invariance is measured at: well above every family gate, so what moves is the
        /// record.
        const SNR_DB: f64 = 25.0;
      That is the CORRECT choice for testing length invariance - holding SNR fixed is what isolates
      the record as the variable. But "the observation" has more than one axis, and the guard is
      structurally blind to the others BY CONSTRUCTION. A feature that measures the SNR instead of
      the signal passes it every time.
      TWO DEFECTS THIS WOULD HAVE CAUGHT, both found the hard way TODAY:
        T-427 (2026-09-17): `duty` measures the SNR, not the transmitter's on-fraction. `duty` IS in
          the guard's 30 features and passed, because at a fixed 25 dB there is nothing for it to
          track.
        T-249 (2026-09-17): `cw` required sigma_af < 0.02, and measured sigma_af on the SAME keyed
          carrier is 0.170-0.207 at 10 dB, 0.068-0.092 at 15 and 0.038-0.050 at 20 - a clean
          1/sqrt(rho) law, a FOUR-FOLD move across the operating range, on a feature named as a
          property of the signal (frequency excursion). The conjunct could never fire below ~28 dB.
          That is the same defect as `duty`, and it cost a whole class its top-1.
      So this family has now been swept THREE times (T-281's audit, T-404's six, T-427's fourth
      table) and the fourth instance arrived on an axis nobody was testing.
      WHAT TO BUILD: a second axis on the SAME test, extending it in place - do NOT build a parallel
      suite, and do not build a scanner or a watchdog. Vary SNR with the signal and the record
      length fixed, and assert per-feature as the length axis already does.
      THE HARD DESIGN QUESTION, and it is the whole ticket: "does not move with SNR" is the WRONG
      assertion for most features, because every estimator's VARIANCE grows as SNR falls - that is
      physics, not a defect. What must not move is the feature's EXPECTATION. Distinguish:
        - a feature whose expectation is stable and whose spread widens as SNR falls -> healthy;
        - a feature whose expectation SLIDES with SNR -> it is reading the noise, and a threshold
          written against it is a threshold on the receiver (T-249's sigma_af, T-427's duty).
      Deciding how to measure that - and with how many seeds per SNR step to make it credible - is
      the core_interface judgement here. State the method before the results.
      An SNR axis needs its OWN exemption list: snr_db and any deliberate SNR statistic are exempt
      BY NAME, with the mechanism recorded, exactly as OBSERVATION_STATISTICS does for length. An
      exemption without a measurement is not an exemption (the existing file's own rule).
      DoD: the second axis exists in the same test, its exemption list is audited and each entry
      carries its mechanism, and it REPRODUCES both known defects when they are reintroduced - a
      guard that cannot catch the two bugs that motivated it is not a guard. Then report what else
      it found, which on the length axis's precedent will not be nothing.
      Family floors must not move; quote ADR-0016 §7.1 and RE-DERIVE (see T-428, live on whether the
      open-set figures there are reproducible).
    notes: |
      A THIRD AXIS probably exists and is worth naming even if not built here: receiver gain state /
      segment count. T-404's `carrier_line_db` fix already had to reckon with segment count ("biased
      in the segment count T-312 left moving"), and T-259/T-305 established that images, harmonics,
      IMD and noise floor are DEVICE-LOCAL. Say whether the axis is real and what it would cost.
      Read feature_length_invariance.rs's header comment first - it is the best short account in the
      repo of this defect family, and the method it settled on (per-feature tolerances derived from
      what the estimator can do, exemption by name with a measurement) is the method to reuse rather
      than reinvent.
    commit: 8cbd463
    result: |
      DONE, and IT CORRECTED MY BRIEF ON BOTH THE RULE AND THE THIRD AXIS.
      MY FRAMING WAS UNACHIEVABLE. I specified "the expectation must not slide while the spread may
      widen". T-429 measured that FIRST: on a 21-class x 7-rung x 24-seed grid NEARLY EVERY
      feature's expectation moves with SNR, and legitimately - the noise is part of the record, so a
      normalised cumulant is attenuated by the noise in its normaliser, `flatness` tends to 1, and a
      line-over-floor statistic is an SNR by construction. Asserting flat expectation would have
      exempted ~25 of 30 features: a rubber stamp. Finding that out before writing the rule rather
      than after is the work.
      THE RULE THAT WORKS IS ABOUT ORDER:
        A feature named as a property of the signal may MOVE with SNR. It may not rank two emissions
        of one family one way at one SNR and the other way at another.
      A pair is RESOLVED at a rung when the class means are further apart than
      3*sqrt(sd_a^2 + sd_b^2) - the spread of a difference of two SINGLE DRAWS, not a standard
      error. That is the whole separation: a widening spread makes the pair STOP being resolved and
      drop out (honest degradation); a sliding expectation keeps it resolved and returns it WITH THE
      OPPOSITE SIGN. Single draws also make the criterion independent of seed count, so seeds buy a
      reliable sd rather than sensitivity - otherwise the guard's strictness would be a function of
      how long someone let it run, which is the "tolerance fitted to the harness" the file's own
      first rule forbids. SNR_SEEDS = 24 is where the finding set stops moving (identical at 10/12/24
      seeds and on 4-, 5- and 7-rung ladders). Ladder 10/15/20/25/30 dB, exactly what both defect
      tables used. WITHIN-FAMILY, because that is the comparison a within-family class call makes -
      which is also why both defects live there.
      PROOF, by removing each entry and reproducing the ticket's own diagnosis:
        sigma_af am/cw: resolved at 10 dB (apart +0.8609 vs 0.6261), UNRESOLVED at 15 because the
          spread widened, resolved again at 20 (-0.0336 vs 0.0237) and 30 (-0.0152 vs 0.0058) with
          the sign INVERTED. The healthy case sits BETWEEN two resolved rungs of opposite sign - the
          mechanism doing exactly what it was designed for.
        duty ppm/pulse: 0.4708 vs 0.6584 at 10 dB (apart -0.1877); 0.3905 vs 0.0511 at 30 (+0.3394).
      Both reproduce the tickets' published figures: duty pulse 0.658/0.539/0.197/0.142/0.051 vs
      T-427's 0.655/0.538/0.200/0.143/0.051; sigma_af cw 0.206 at 10 dB vs T-249's 0.170-0.207. The
      stale direction is demonstrated too (a planted entry fails naming itself).
      EXEMPTIONS SCOPED TO (feature, family, a, b), not the feature - `duty` inverts 1 of 28 pairs
      and exempting the whole feature would discard the other 27. ASSERTED AS AN EXACT SET BOTH
      WAYS: an undeclared inversion fails, AND a declared one that no longer reproduces fails naming
      the entry to delete. "Fixing one makes the exemption disappear from a diff" stops being a
      discipline and becomes a failing test - the one thing this axis does better than the length
      axis rather than just differently.
      Seven entries: duty ppm/pulse (T-427); sigma_af am/cw (T-249 - IF of noise is near-uniform on
      (-pi,pi] so measured sigma_af = sqrt(emission^2 + c/rho); `am` has no excursion of its own and
      slides 250-fold, `cw` is floored by its keying at 0.019 and slides 11-fold); low_fraction
      ppm/pulse (NEW); and four inherent - carrier_line_db ppm/pulse, gamma_max am/cw, c42_norm
      am/cw and am/wfm. The c42_norm entry carries an EXACT LAW: Gaussian noise contributes zero to
      a fourth cumulant but full power to its normaliser, so the reading is attenuated by
      (rho/(1+rho))^2 - checked on cw at 0.880/0.959/0.985/0.995/1.000 against the law's
      0.828/0.942/0.982/0.996/1.000.
      C14's six family scores are exempt at feature level (a family score is EVIDENCE, and evidence
      is MEANT to grow with SNR) and C14 is not run on this axis at all - measured, not assumed:
      with it on and off the other 24 features are bit-identical across all 1764 probe rows. 8 s
      instead of 82 s; the whole file runs in 11.9 s.
      WHAT ELSE IT FOUND: `low_fraction` is `duty`'s defect ONE THRESHOLD DOWN (0.3x the same mean),
      not previously reported - a 5%-duty train that should read ~0.95 at every SNR reads 0.132 at
      10 dB. Same mechanism, same family, same fix, same owner -> added to T-431.
      THE THIRD AXIS, and it corrected me here too: SEGMENT COUNT IS ALREADY THE LENGTH AXIS, since
      segments(n) is a function of the record at a pinned transform and Looks::Segments exists for
      it; T-404's carrier_line_db note is about that axis, not a new one. The real third axis is
      FRONT-END STATE - quantisation headroom, LO offset, IQ imbalance, DC, clipping, gain - with a
      strong prior of findings (c20/c40_norm are explicitly offset-sensitive, and `symmetry` is a
      sideband balance about the carrier, precisely what IQ imbalance forges). The criterion
      transfers verbatim. The cost is not the code but the FIDELITY OF WHAT CAN BE VARIED:
      SynthConfig models three impairments; T-213's py/hkpy/synth/amc grid adds LO ppm, phase noise,
      blockers/IMD and ADC clipping and is meant to replace it; and the version that would find what
      T-259/T-305 named - images, IMD, spurs, all device-local - is a HIL ladder against a stable
      reference emitter that no synthetic grid models at all.
      MEASURED AND DELIBERATELY NOT ASSERTED -> T-435: the class NAME changes with SNR in 3 of 252
      sequences, all psk-qam, including a 16-QAM returned as `analog/ssb` at 15 dB - a
      confidently-wrong FAMILY at the gate, T-422's shape. Not asserted because it is a classifier
      assertion rather than a feature one and its exception list would be seed-count-fragile.
      Test-only diff; no product code touched, so no floor could move.

  - id: T-430
    milestone: M2-hardening
    title: The per-cell coverage contract test bounds the capture time elapsing between two HTTP round-trips
    status: done
    priority: normal
    parallel_group: PIPE
    deps: [T-423, T-425]
    found_by: 'T-425 (2026-09-17), hit in its own gate run and measured on the base before reporting'
    acceptance: |
      `coverage_answers_per_cell_in_time_and_says_when_it_no_longer_knows_whether_it_looked`
      (crates/hk-cli/tests/api_contract.rs, from T-423) asserts `summed == row0_observed_s` to
      1e-6 over a window whose row 1 begins at a LIVE EDGE READ BY A PREVIOUS HTTP CALL. So it is
      bounding the capture time that elapses BETWEEN TWO ROUND-TRIPS - measured at 6.8 ms when it
      failed.
      T-425 measured it rather than assuming, and it is PRE-EXISTING: under identical load, base
      1/10 fail and branch 3/10; idle, base 0/10 and branch 1/10. It cannot be reached by T-425's
      change (it never opens a WebSocket, and the only production code of T-425's it executes is
      `register()` at startup).
      SAME CLASS AS T-383 AND T-425: a test bounding a quantity whose natural range it has not
      measured - here, inter-request latency. T-383's rule, now in .config/nextest.toml, applies
      directly: measure the range, then either remove the wall-clock dependence (ask for an
      explicit window rather than one anchored on a previously-read live edge) or bound what is
      actually invariant.
      DoD: state the measured range of the quantity, fix accordingly, and report a before/after
      failure rate over at least 10 runs at comparable load. Do not loosen 1e-6 to fit an
      unmeasured spread - T-425's ticket carried the same prohibition for the same reason.
    commit: 704cf22
    result: |
      FIXED, with T-433 in the same diff, and the finding is one line: ALL THREE TESTS BOUND A QUANTITY
      THAT MOVES IN WHOLE CAPTURE BLOCKS, not a continuous spread. Every "6.8 ms latency" and every
      "2490368 samples" reported by three agents on three trees is a CONSTANT.
      T-430: the coverage log appends ONE 16384-SAMPLE BLOCK at a time, so row 1 reads 0 or an exact
      multiple of 16384/2.4e6 = 6.8267 ms - never anything between. The "6.8 ms inter-request latency"
      T-425 and T-436 both recorded IS THAT CONSTANT. Idle it fires 1/10; at load ~47 the
      rows-vs-column site fires 12/20 and survived only because its tolerance was 0.05 rather than
      1e-6 - the two bounds differed in nothing but which happened to be generous.
      view_pause_keeps_capture: the phase closes when the SOURCE's emitted counter passes 2500000 and
      wait_emitted overshoots to the next whole block (153 x 16384 = 2506752); it then asserts on the
      CAPTURE and RING counters, which trail by the block in flight. 6752 samples of headroom, LESS
      THAN HALF A BLOCK. One block in flight gives exactly 2490368 - the number two agents reported
      independently. Reproduced deliberately: 3 of 48 failures, ALL THREE reading 2490368, playing
      control at 2506752 + k x 16384 every time.
      dropped == 0 MOVED TO THE BENCH TIER, and the counter-argument is right, which is why the CI
      version was wrong: blind_live is Pacing::Unpaced at ~4.5x real time, so `dropped` counted the
      test's own in-process sink failing to drain an arbitrarily accelerated stream. The ticket's
      premise that the chain runs in real time is not true of the primary test. The claim now lives in
      the ignored release RealTime{speed:1.0} perf test that docs/10 §2 already assigns to timing
      claims. At CI tier the replacement is the STREAM CONTRACT: every gap in seq declared by a marker
      naming the missing range, plus lost_samples == 0, which IS a code property here. Net 3
      assertions removed, 8 added - and non-vacuous by evidence, since at load 81 one run published
      dropped: 9 and PASSED because the nine records were declared.
      RATES under deliberate load: coverage 1/20 -> 0/20; view_pause 3/48 -> 0/48; concurrent_demod
      0/18 with one run carrying declared loss.
      ON T-436 it sharpens rather than settles: concurrency is not the defect, it is the SAMPLING RATE
      on defects like these. Every failure fixed here is reachable on an IDLE machine (the T-430 one
      at 10-20% per run at zero load), so a thread cap would have made them rarer and harder to
      diagnose - which is what happened for months. Cap to stop paying 7-12 min per false red, but
      keep filing the defects: three were sitting under one ticket.

  - id: T-431
    milestone: M3
    title: A 5%-duty radar train is denied the pulsed family for being always on, because the admissibility gate reads the same inflated duty
    status: done
    priority: normal
    parallel_group: M3A
    deps: [T-427, T-429]
    use_cases:
    - SIGNAL-062
    found_by: 'T-427 (2026-09-17), measured while fixing the class call; left alone deliberately'
    acceptance: |
      T-427 fixed the pulsed CLASS call and measured, but did not change, the same defect one
      level up in the FAMILY gate.
      `duty` is the fraction of samples above 0.5 x the snippet's own mean envelope, so for a
      sparse train the mean is dominated by the OFF time and the noise clears the threshold.
      T-427 measured `pulse` (true duty 0.050) reading 0.655 at 10 dB and 0.538 at 15 dB. At the
      gate it therefore clears PULSED_MAX_DUTY (0.60) and is denied the `pulsed` family for
      `continuous_envelope`: A 5%-DUTY RADAR TRAIN RULED OUT OF THE PULSED FAMILY FOR BEING
      ALWAYS ON.
      T-427 left it because this is an ADMISSIBILITY gate - moving it moves a FAMILY-level
      number, unlike a class call which writes only Classification::class after the family is
      decided. That makes it a different risk class and correctly a separate ticket.
      STRONGLY RELATED TO T-429: the root cause is that `duty` tracks SNR, and the observation
      guard holds SNR fixed at 25 dB so it cannot see that. Sequence this AFTER T-429 if T-429
      lands first - a corrected or SNR-robust duty may dissolve this ticket entirely, and fixing
      the gate against an uncorrected feature would be fitting a constant to a defect.
      DoD: either the feature is made SNR-robust (preferred, and may be T-429's work) or the gate
      is derived against the measured curve rather than the transmitter's intent. Family-level
      floors must hold: quote ADR-0016 §7.1 and RE-DERIVE, and note §7.2 - the held-out figures
      have a draw sd of 0.008, so a +/-0.02 move is noise, not a regression.
      Separately noted by T-427 and out of scope here: at 30 dB `pulse` goes `unknown` on an
      open-set score of 0.93-1.00, a different mechanism above the grid's gate+10 ceiling.
    notes: |
      SECOND THRESHOLD, found by T-429 (2026-09-17) and not previously reported: `low_fraction`
      is the SAME defect one threshold down - 0.3x the snippet's own mean envelope where `duty`
      uses 0.5x. A 5%-duty train should read ~0.95 at every SNR and reads 0.132 AT 10 dB. Same
      mechanism, same family pair (ppm/pulse), same fix, and it is now a declared exemption in
      the SNR-order guard, so fixing the estimator must delete BOTH entries or the guard fails
      naming the stale one.
      So this ticket is not "fix a gate constant" - it is fix the estimator at both of its
      thresholds, and the gate follows.
    commit: 06e4b7d
    result: |
      FIXED THE ESTIMATOR, not the constant - which is what the ticket preferred and what the evidence
      supported.
      MEASURED CAUSE: `duty` and `low_fraction` both referenced their threshold to THE RECORD'S OWN
      MEAN ENVELOPE (0.5x and 0.3x). For an emission that is mostly off, that mean is set by the OFF
      time, so the threshold collapses toward the noise and the noise clears it. A threshold relative
      to the record's mean is a threshold relative to HOW MUCH OF THE RECORD IS SILENCE - the very
      quantity being reported. `pulse` (true 0.050) read 0.655 at 10 dB; `low_fraction` (true 0.950)
      read 0.132 at 10 dB.
      THE FIX: both fractions are now taken against the emission's own ON LEVEL - the fixed point of
      L = mean(a | a > L/2), started at mean(a), so ITERATION 1 IS EXACTLY THE OLD ANSWER and every
      one after is a correction. Climbs monotonically, terminates in 2-11 iterations, and settles on
      the LOWEST on level consistent with the record ("on unless the record proves otherwise").
      Measured over 12 seeds x 5 rungs: `pulse` 0.050 / 0.950 AT EVERY RUNG; `ppm` 0.329-0.341 (true
      1/3); `coded-pulse` 0.175 (true 0.173); ofdm/noise-like flat to +/-0.005. Below the gate it
      fails honestly rather than sliding - 0.502 at 5 dB, because the duty of pulses you cannot see is
      not measurable.
      FEATURES_VERSION 6 -> 7, both density files refitted (T-286/T-312 precedent). PULSED_MAX_DUTY
      0.60 -> 0.40, re-derived on the CORRECTED curve: the gap runs from ppm 0.341 to the true-50%
      keyed carriers cw/ook at 0.465, and 0.40 is its middle. 1/2 WAS REJECTED because a true-half
      emission does not READ half (cw/ook span 0.465-0.552), so a gate at 0.50 would admit or deny the
      same class by seed. The constant moves NO acceptance figure (suite identical at 0.40 and 0.60),
      so it rests on the derivation rather than a score.
      REJECTED, each on a measurement: CFAR above the noise floor (trades one SNR slide for another -
      ppm 0.342 -> 0.565 as the threshold falls into the filter skirts); Otsu on envelope power (exact
      on pulsed classes, useless as a feature - a two-way split of a UNIMODAL envelope is still a
      split, so ofdm reads 0.205, BETWEEN pulse and ppm); -6 dB from a high quantile (vsb-am 0.429 ->
      0.999); the same fixed point on the median (the mean is what lets the iteration climb out of the
      noise basin; the median does not).
      BOTH GUARD EXEMPTIONS DELETED - duty ppm/pulse and low_fraction ppm/pulse are gone from
      SNR_ORDER_EXCEPTIONS; five remain, every one a statistic that IS an SNR. T-429's exact-set
      assertion was the completion check and it passes.
      NUMBERS, quoted against §7.2's 0.0084 draw sd, merge base and branch measured back to back
      (T-419's method): known top-1 0.9345 -> 0.9325, top-2 unchanged, wrong-label overall 0.0040 ->
      0.0032 (better), held-out unknown recall 0.9520 -> 0.9444. That move is -0.0076, INSIDE the
      0.0084 draw sd and well inside the +/-0.02 noise band; every floor met. All of it is psk-qam's
      open set (0.875 -> 0.819); every other family unchanged to 3 dp. Against that, the defect:
      `pulse` at the pulsed gate goes top-1 0.00 / unknown 1.00 -> TOP-1 0.92, and the pulsed family
      at that rung 0.50 -> 0.96.
      NOT CHANGED, and it is the next instance of the family -> T-447: phase_features and derotate take
      their Azzouz-Nandi "strong envelope" subset over the SAME 0.5 x mean(a) rule, so for a sparse
      train that subset is mostly noise (0.63 of the record at 10 dB instead of 0.05) - sigma_ap,
      sigma_dp and the de-rotation for `pulse` are measured over noise.

