  - id: T-380
    title: One view window, even with multiple SDRs - extra front ends widen coverage, they never split the view
    milestone: M2-hardening
    status: deferred
    priority: normal
    parallel_group: UI
    core_interface: true
    model: opus
    deps: [T-379, T-378]
    acceptance: |
      USER INVARIANT 2026-09-16, CLAUDE.md, same message as T-379. Verbatim:
      "One view window, even with multiple SDRs. The UI always presents a single
      (time range x frequency range) window. Additional SDRs (when supported)
      COLLECT DATA PASSIVELY IN THE BACKGROUND, widening the coverage available to
      display; they do not add view windows or split the view. The frequency
      navigator may show where background collection is happening (lit coverage
      segments), but the main view stays one window over whatever data exists there,
      FROM WHICHEVER SOURCE CAPTURED IT."
      This settles a question the architecture had left open. The multi-SDR rule was
      "do not bake a single-device assumption into the source layer, scheduler or
      inventory" - which is about CAPTURE. This says the VIEW is single by design:
      N front ends are a coverage-widening mechanism, not N panes.
      Tension to resolve explicitly, not silently: the main view must draw from
      whichever source captured the data, while T-259/T-305 says dedup, clustering
      and identity must NOT read the device, and images/harmonics/IMD/noise floor
      MUST. Drawing a cell captured by device B into a view centred on device A's
      tune is a DISPLAY union, and it is legitimate; asserting the two devices saw
      the same emitter is an IDENTITY claim, and it is not. Write down where that
      line falls in ADR-0017 and hold it in the code.
      Depends on T-378: coverage cannot say which device looked where over the long
      horizon until observation-log spans carry a device.
    result: |
      FOLDED INTO docs/16 §8 AND SUPERSEDED BY T-437 (user decision, 2026-09-17).
      The brief states it directly: the unified surface "subsumes T-380 - fold T-380 into this
      design". T-380's invariant is NOT dropped; it is restated in a stronger form. T-380 said
      extra front ends widen COVERAGE and never split the VIEW. Under §8 the surface is one
      surface and panes are VIEWPORTS ONTO IT, so there is still exactly one thing being looked
      at - panes are where you look FROM, not additional things to look at. The multi-SDR case
      that motivated T-380 (ranges far apart, unwatchable at one density) is what panes exist to
      solve, and it is now §8.4 rather than a separate ticket.
      Deferred rather than cancelled: if the T-437 spike does not prove out, this invariant still
      needs a home and this ticket is it.

