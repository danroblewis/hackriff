  - id: T-387
    title: Four live surfaces cannot re-derive because the websocket transports have no history form
    milestone: M2-hardening
    status: done
    priority: normal
    parallel_group: PIPE
    core_interface: true
    model: opus
    deps: [T-384]
    acceptance: |
      T-384 wired the output panels and decode plots to the view window and left four
      surfaces on the live edge FOR A STATED REASON, which is this ticket.
      The packet inspector, status feed, pipelines list and outputs dock are live
      WEBSOCKET transports: /ws/open/inspector and /ws/open/stage have NO HISTORY
      FORM, so no caller can ask them for a past window. Adding one is a STREAM
      CONTRACT change (ADR-0004), not a UI fix, which is why T-384 correctly stopped.
      The user's rule (CLAUDE.md 2026-09-16) covers these surfaces too: every surface
      is a view over one (time range x frequency range) window and must show all the
      data it has for it.
      Settle FIRST whether these surfaces should re-derive at all. A status feed and a
      pipelines list may be legitimately live-only - they describe the RUN, not the
      air - in which case the honest fix is for them to SAY they are live-only rather
      than silently appear scrubbed. The packet inspector is different: packets are
      data about the air and have capture-clock timestamps.
      T-384 found the honest substitute already works for the plots - they reach the
      same frames through /api/captures/{id}/frames?from_t=&to_t=, which already has
      the window. Ask whether the inspector can do the same before extending the
      stream contract.
      Hold T-384's standards: ask on the capture clock; never widen the window to look
      full; distinguish empty-because-unobserved from empty-because-not-fetched via
      hk_store::Coverage; and include the control that a window which DOES hold data
      renders its rows.
  - id: T-388
    title: A live signal box extends UP slowly because growth is poll-gated, not detection-gated
    milestone: M2-hardening
    status: done
    priority: high
    parallel_group: PIPE
    core_interface: true
    model: opus
    deps: [T-362, T-354]
    acceptance: |
      USER, live testing 2026-09-16. The scrolling presence boxes now follow the
      waterfall (T-362 confirmed) - but a live signal box EXTENDS UP SLOWLY.
      The user's diagnosis, which is specific and should be verified rather than
      assumed: detection is NOT the bottleneck (it runs per-frame). Box growth is
      POLL-GATED - t_end_s only advances on an inventory/presence poll, the UI does
      not extrapolate between polls (inventory.ts), inventory/presence is poll-only
      with NO WEBSOCKET PUSH, and the cadences are lazy: capture-overview poll 60 s,
      session 2 s, presence committed at roughly tracker-interval granularity.
      REQUIRED: a live signal box extends in near-real-time. Either shorten the
      live-view presence poll materially and/or add a PRESENCE-EXTENSION PUSH over
      the stream contract. The user prefers the push - "the live edge advances
      continuously".
      SCOPE: the live/following view only. PAUSED AND SCRUBBED VIEWS STAY
      POLL-BASED - they are answering about a fixed past window, which T-379/T-384
      just wired to the view window, and a push has nothing to add there.
      SUCCESS: a continuing signal box's top tracks the live edge within ~1 s, not
      tens of seconds.
      File in docs/14 + the stream contract (ADR-0004).
      THE HONESTY CONSTRAINT, which is why the fix is a push and not client-side
      extrapolation: a box drawn to the live edge on the ASSUMPTION the signal is
      still there is a claim about air nobody measured. The box may only extend as
      far as presence has actually been observed. Fast is the goal; inventing the
      most recent second is not. The user names the absence of extrapolation as part
      of the diagnosis, not as the thing to change.
  - id: T-389
    title: Confirmed presence boxes never draw unselected, and the candidate LIST disagrees with both the boxes and the API
    milestone: M2-hardening
    status: done
    priority: high
    parallel_group: UI
    core_interface: true
    model: opus
    deps: [T-379]
    acceptance: |
      USER, live testing 2026-09-16, items (1) and (2) - filed together because they
      share a suspected root cause and the same files.
      (1) CONFIRMED presence boxes are not drawing when the signal is UNSELECTED. The
      user sees the solid/teal confirmed box only AFTER clicking the row (when it
      becomes the yellow selected band), never the unselected
      .c-presence-box.confirmed - even though every confirmed row has a live
      last_interval per the API. Verify confirmed boxes render AT ALL TIMES, and that
      teal is actually visible against the waterfall.
      (2) LIST vs BOXES DISAGREE: the UI shows "1 candidate" while /api/inventory
      returns 20 candidate rows and the waterfall draws MULTIPLE dotted candidate
      boxes. THREE different numbers. The list and the boxes it renders MUST NEVER
      DISAGREE (docs/api.md).
      COORDINATOR FINDINGS, as leads to verify and not conclusions:
      - overlays.ts presenceBoxes() ALREADY emits unselected confirmed boxes and
        skips only the FOCUSED row (`if (r.id === focusedId) continue;` - T-193 gives
        the focused row a full-height bracket instead). That is the OPPOSITE of the
        reported symptom, so the cause is very likely UPSTREAM of the renderer.
      - The renderer's other early-out is `const iv = r.presence?.last_interval; if
        (!iv) continue;`. So the question is whether rows IN THE STORE carry
        `presence` at all. inventory.ts mentions a "`presence` projection" at two
        places (lines ~195, ~211); if the list fetch projects presence for candidates
        (their activity dots need it) but not for confirmed, that explains (1)
        exactly.
      - live-spectrum.ts draws from presenceBoxes(Object.values(s.inventory.rows)),
        i.e. THE SAME STORE the list renders from - so a disagreement between list and
        boxes means one of them applies a further filter. Note fetchInventoryPage is
