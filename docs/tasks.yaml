  - id: T-433
    milestone: M2-hardening
    title: concurrent_demod asserts dropped == 0 on a real-time chain, a quantity whose range under contended CPU has never been measured
    status: done
    priority: normal
    parallel_group: PIPE
    deps: [T-383]
    found_by: 'T-427 (2026-09-17) with the perf record attached; a second instance seen by T-406 the same hour'
    acceptance: |
      T-383 established this repo's standing rule, now in .config/nextest.toml: A TEST MAY NOT BOUND
      A QUANTITY WHOSE NATURAL RANGE IT HAS NOT MEASURED. Three tests still do.
      PRIMARY: tests/e2e/tests/concurrent_demod.rs asserts `dropped == 0` in four places
      (lines 379, 416, 516 and the per-stream check) on a chain that is running in REAL TIME. Zero
      dropped samples is not a property of the code - it is a property of the machine keeping up.
      T-427 caught it with the perf record attached, which is why this ticket can state the regime
      rather than guess it:
        FAILING run: dropped 63, load average 34.85 on 28 cores, cpu_load 0.817, age_s 129.1,
          latency_ms_max 61.7, the whole acceptance step taking 132 s.
        PASSING runs: cpu_load 0.53, age_s 1.35, dropped 0, the same step in 8.68 s.
      So the test drops samples when the box is oversubscribed - which is the coordinator's normal
      state, since up to four agents build concurrently by design (CLAUDE.md, T-144). Re-running
      `just acceptance-ci` on an idle box gave exit 0, 3/3.
      SECOND INSTANCE, same hour, different test: T-406 saw hk-pipeline::view_pause_keeps_capture
      fail once at 99.6% of its target ("2490368 samples over a phase of 2500000"). It did not
      assume - 5/5 green isolated, the hk-pipeline suite 3x clean on the merge base and 7x on its
      branch (6 clean) - and then removed the only plausible mechanism anyway by replaying UNPACED
      rather than in real time, getting bit-identical results in 2.2 s. THAT IS THE SHAPE OF THE
      FIX and it is already proven in-tree: a test that does not need real-time pacing should not
      pay for it.
      DoD: measure the range of `dropped` under deliberate load (T-383's method: generate the load,
      do not wait for luck), then either remove the real-time dependence as T-406 did, or assert
      what is actually invariant. DO NOT simply raise the bound to a number that passes today -
      that is the same error T-425 was forbidden from making in the other direction.
      Note the honest counter-argument and address it rather than dismissing it: `dropped == 0` on
      a real-time chain is a MEANINGFUL product assertion - the whole point of the always-on
      capture path is that it does not lose samples - so the answer may be that this assertion
      belongs in a HIL/bench tier (T5/T6 in docs/10) where the machine is not contended, and that
      the CI-tier test should replay unpaced and assert on content instead. Say which, and why.
    notes: |
      Related but distinct: T-383's finding that heavy-serial's `max-threads = 1` serialises the
      group against ITSELF within one nextest invocation and does nothing about the ~27 tests
      outside it, nor about four agents building on the same box. Adding a name to that list will
      not fix this one either.
    commit: 704cf22
    result: |
      CLOSED in T-430's diff. See T-430's result - the dropped == 0 assertion moved to the bench tier
      because the CI test is UNPACED (~4.5x real time), so the quantity it bounded was the test sink's
      ability to drain an arbitrarily accelerated stream rather than any product property.

  - id: T-434
    milestone: MCANVAS
    title: docs/16 step 4 - LevelConfig::t_factor and the view scheme, and the step where the storage cost lands
    status: done
    priority: normal
    parallel_group: PIPE
    core_interface: true
    model: opus
    deps: [T-421, T-423, T-419]
    use_cases:
    - AWARE-011
    found_by: 'coordinator (2026-09-17), sweeping docs/16 §7 after steps 1, 2, 3 and 6 landed'
    acceptance: |
      docs/16 §7 STEP 4, and the next step in the sequence. Quoted:
        "LevelConfig::t_factor and the view scheme (§6.1, §6.2). Sealed coarse levels produced by
         the EXISTING seal path, uniform 256 x 256 tiles, the coverage plane from step 1, the
         input-statistic provenance from step 3. No new view yet. Serves: nothing visible.
         Unblocks: steps 5 and 6. THIS IS WHERE THE STORAGE COST LANDS, SO IT IS THE STEP TO
         MEASURE DISK ON."
      Read §6.1 and §6.2 for the settled scheme before designing anything, and note that four of the
      eight steps are already in - steps 1 (T-421), 2 (T-423), 3 (T-419) and 6 (T-406). Step 6 ran
      early because it only ever depended on step 1.
      WHAT YOU INHERIT, AND MUST NOT REBUILD:
        T-421's hk_store::coverage - grid_over, coarsen (a SUM, not a max), at_tf,
          unknown_rows_before. The fold rule is settled and proved; do not write a second one.
        T-423's wire - per-cell coverage on /api/timeline and /api/coverage, and the fourth state
          "unknown" as a VALUE with a horizon block, not a Coverage variant. Do not disturb that
          distinction, and do not spell unknown as grey.
        T-419's control discipline - PROVE A LEVEL AGAINST LEVEL 0, never against a parent. The
          buggy max fold satisfied "a parent never exceeds its best child" AT EVERY LEVEL while
          being wrong by f_factor at every level.
      MEASURE THE DISK, because the step exists partly to find out. T-406 has just set the precedent
      for how: it measured the observation log through the PRODUCTION codec at 618 B/line rather than
      estimating, and found what §5.4 had not stated - WHICH BOUND BINDS DEPENDS ON THE POLICY (a
      50 ms-hop sweep is ~2 orders denser per day than a dwell, so the quota binds there where the
      age binds for a dwell). Expect the same kind of surprise here and look for it: state bytes per
      tile and per level from a real encode, then say which retention horizon binds at which zoom.
      If the cost is worse than §6 assumed, that is the finding - report it rather than quietly
      choosing a smaller tile.
      DoD: t_factor exists and is independent of the frequency factor; coarse levels come from the
      EXISTING seal path (no second producer); the coverage plane and the input-statistic provenance
      ride along; disk measured and reported per level. No new view - resist building one, since
      step 5 serves the route and step 7 the client.
    notes: |
      Steps 5 (the tile route, GET /api/tiles/... under the chunked-lock discipline with §5.5's
      in-flight cap) and 7 (the big view client - LRU eviction with the two pins, the LIFO
      cancellable queue, the parent-upscaled-and-labelled fallback) are NOT yet filed. File them when
      this lands, not before; §7's standing instruction is that T-405 and T-406 must not foreclose
      the scheme, and both now accumulate into it rather than into private accumulators.
      Gate: crates/ so FULL. Run the affected suite twice (T-403). Floors: ADR-0016 §7.1, and read
      §7.2 first - the held-out figures have a draw sd of 0.008, so a +/-0.02 move is noise.
    commit: 5684346
    result: |
      DONE - de-welded, and the disk measurement overturned two of §6's assumptions.
      level_f and level_t become independent coordinates DERIVED FROM THE GEOMETRY rather than
      carried beside it: Geometry::f_axis()/t_axis() give the distinct cell widths per axis,
      axes_of(level) and level_at(level_f, level_t) translate. hk_model::TileKey is UNCHANGED, so
      scheme 1 keeps its weld and is bit-identical.
      TWO THINGS THE ROUTE MUST HONOUR, both forced by the implementation: level_at returns None
      where a scheme has no such node - A WELDED LADDER IS THE DIAGONAL of the lattice - so the
      route answers "no such node" rather than snapping to a level whose time cell is a day; and
      Resolution::MaxCells/Cell still scan levels in INDEX order, which is a coarseness order only
      for a ladder, so T-438 must address by explicit (level_f, level_t) and not rely on them.
      MEASURED DISK COST, real encodes through the production codec (lattice_cost.rs, now docs/16
      §6.4-§6.5):
        a 256x256 level-0 tile costs 1548 + 1.24 x cells bytes - a full tile ~83 kB, not the
          ~918 kB its 14 B/cell implies; 64x64 tiles cost 2.30 B/cell, so §6.2's 256x256 is the
          cheaper tile as well as the uniform one;
        THE LEVEL COUNT IS MULTIPLICATIVE, THE BYTES ARE NOT - a 4x4 lattice is 4.8x its finest
          node and 3.2x the welded ladder embedded in it as the diagonal, same data and same run.
          64 nodes cost a handful of finest levels, not 64;
        THE SURPRISE: A COARSE CELL COSTS MORE THAN A FINE ONE - 3.4-3.6 B/cell against level 0's
          2.30, a 1.5x penalty, because folding destroys the temporal correlation zstd was living
          on. §6 assumed bytes proportional to cells and understates by half as much again;
        WHICH BOUND BINDS MOVES: 20 MHz dwelled continuously, scheme 1 writes 771 MB/day and its
          8 GiB budget binds at 11 days, while the §6.2 view lattice writes 1.26 MB/day and would
          not bind for 6842 - so the observation log's 180-day AGE binds instead at every
          (level_f, level_t), and T-423's fourth state, which §5.4 argued was unreachable in
          practice, BECOMES REACHABLE after half a year.
      DE-WELDING COSTS THE PERCENTILES: a tile keeps one histogram per frequency cell over the
      whole tile, which is the parent cell's histogram ONLY when a child tile is one parent time
      cell - the weld. So a de-welded fold writes no p_low/p_high; they stay unknown and reach the
      wire as `unknown` rather than inventing a distribution. View tiles carry measurement,
      occupancy and coverage; the noise floor stays a scheme-1 question.
      LEFT FOR T-438/T-439, stated by the agent: no production view-scheme instance is opened
      alongside scheme 1 (PyramidConfig::view_lattice exists and is tested, nothing in hk-pipeline
      opens it); and the finest-node RAM/latency question - §6.2's V(0,0) keeps a level-0 tile open
      for 9.1 h per 25.6 MHz block at ~3 MB of accumulator, fine for a survey and wrong for a live
      edge, which is F1's problem from the other side.
      COORDINATOR ERROR: this merge was completed accidentally by a `git commit` of board files
      while it was staged - git commits everything staged during an active merge - so it landed
      before its gate finished and under a tasks.yaml message. Message amended; main verified
      separately at 445/445 (hk-store + hk-pipeline), 332/332 (hk-e2e + hk-api + hk-cli), and zero
      FAIL lines across the 2230 tests of the interrupted full run.

  - id: T-435
    milestone: M3
    title: The class NAME changes with SNR in 3 of 252 sequences, and one of them is a confidently-wrong FAMILY at the gate
    status: todo
    priority: normal
    parallel_group: M3A
    deps: [T-429, T-422]
    use_cases:
    - SIGNAL-062
    found_by: 'T-429 (2026-09-17), measured while building the SNR-order guard and deliberately not asserted there'
    acceptance: |
      T-429 built a guard asserting that a FEATURE may not reorder two emissions across SNR. While
      there it probed the next question up - does the CLASS NAME change with SNR? - over 21 classes
      x 7 rungs x 12 seeds, and found 3 flips in 252 sequences, all in psk-qam:
        qam16 <-> qam64 across 20 vs 25 dB (2 seeds);
        ONE 16-QAM RETURNED AS `analog/ssb` AT 15 dB - exactly its family's gate - before becoming
          qam16 at 20 dB and above.
      THE THIRD IS THE ONE THAT MATTERS. It is not a within-family ranking wobble: it is a
      confidently-wrong FAMILY call at the gate, which is T-422's shape (there the ALRT took N0
      from the SNR meter and both truths flipped together). A digital QAM emission named as
      suppressed-carrier analog voice is the kind of answer the open set exists to refuse.
      T-429 deliberately did NOT assert it, and the reasons are good: it is a CLASSIFIER assertion
      rather than a feature one, so it does not belong in the feature guard; its exception list
      would be seed-count-fragile (1 flip at 6-8 seeds, 3 at 12); and the M3 acceptance grid
      already measures per-SNR-bin wrong-label over a far larger population. Accept those reasons -
      do not simply move the probe into the guard.
      DoD: establish the MECHANISM of the analog/ssb flip first, as T-422 and T-249 did - state
      which dimension carries a 16-QAM into the analog family at 15 dB and not at 20. Then decide
      where the assertion belongs: the M3 grid, a targeted regression, or an abstention. If the
      right answer is that the acceptance grid already covers it at a population where it does not
      show, say so with the numbers rather than adding a test that duplicates it.
      Floors: ADR-0016 §7.1, re-derived, and read §7.2 first - the held-out figures have a draw sd
      of 0.008, so a +/-0.02 move is noise. The gate's RULING line is the one to quote, not the
