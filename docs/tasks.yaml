  - id: T-316
    milestone: M2-hardening
    title: On real air the pipeline fires 866 detections and 5 candidate emitters into a band measured flat
      to 2.3 dB
    status: done
    commit: dd13a8d
    priority: high
    deps:
    - T-289
    parallel_group: M3B
    core_interface: true
    model: opus
    acceptance: 'T-289 measured 101.42-101.49 MHz in the 2026-09-15 FM capture as flat noise - at most 2.3
      dB excess per 10 kHz, no pilot, nothing in any of 1648 time bins - and the pipeline emitted 866 DETECTIONS
      and 5 CANDIDATE EMITTERS there. It also emitted 2 detections (SNR 4.4 and 5.2 dB) and a candidate
      at 100.3 MHz, where the measured excess is 1.1 dB and the SNR is -11.5 dB. This is the same shape
      as the 82 near-duplicate candidates the user reported from live Explore, but now on REAL AIR with
      measured silence to check against, which no synthetic fixture provides. Find why the detector reaches
      a candidate on noise at this SNR: start from the CFAR/threshold path and the false-alarm rate it is
      designed for, and compare the designed rate against 866 in 45 s over 70 kHz. T-295 found exactly this
      shape before - a short-burst onset test comparing against sigma squared alone, firing about 100/s
      against a designed 0.01/s - so check whether that fix covers this path or only the burst one. DO NOT
      raise a threshold to make the count smaller: establish the designed false-alarm rate, measure the
      actual one, and fix the mechanism that differs. The fixture''s measured-absent list is the ground
      truth to test against, and fm_band_measured_silence_is_not_catalogued already asserts the Confirmed
      half - this is about the candidate and detection layers beneath it'
  - id: T-317
