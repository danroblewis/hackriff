  - id: T-281
    milestone: M2-hardening
    title: 'Audit features that measure the OBSERVATION rather than the signal:
      burst_length varies with watch duration, sigma_ap with snippet length'
    status: done
    commit: ef8ac7f
    priority: normal
    deps: []
    parallel_group: M3A
    use_cases:
    - SIGNAL-062
    found_by: 'coordinator 2026-09-16: three instances in one night - T-240 found
      sigma_ap/sigma_dp accumulate with observation length (95.5 at 4k samples vs 252.3
      at 381k), T-250 found burst_length differing 0.68 s vs 0.37 s between two rows of
      the SAME station purely because one was watched 19 times and the other 6'
    acceptance: 'audit every fingerprint and classification feature for dependence on how
      long or how often the signal was watched rather than on the emission. For each,
      either normalise it so it is a property of the signal, or mark it explicitly as an
      observation statistic that must never be used as distinguishing evidence between
      two rows. Report the full list with which category each falls into. This is a
      measurement-honesty audit, not a tuning exercise: no threshold moves'
    area: crates/hk-context (signature features), crates/hk-classify (instantaneous statistics)
    needs: none
    model: opus
    effort: medium
    core_interface: false
    fourth_instance_2026_09_16: 'T-280 found snr_mean_db is a band AVERAGE, so a host
      strength FALLS as its emission widens - penalising exactly the emissions that must act
      as hosts (station mean 7.3 dB vs fragment 4.7 dB = 2.6 dB under a 6 dB margin, where
      the peaks are 14.3 vs 5.9 = 8.5 dB). Fourth instance after sigma_ap (snippet length)
      and burst_length (watch duration). Include it in the audit.'
    fifth_instance_2026_09_16: 'T-288 measured THREE simultaneous instances on one emission, and
      in the case T-262 explicitly scoped out. The 101.46 MHz cluster on the 2026-09-15 FM
      capture yields ten tracks whose stored fingerprints carry bandwidth 13.1-53.8 kHz,
      duty_cycle 0.0082-0.4592 (56x) and burst_length 0.0065-0.0429 s - all three differing
      between rows of ONE emission. Track.bandwidth_hz is a running mean of whichever
      threshold-crossing boxes associated (s.bw += (g.bw()-s.bw)/8), and within EVERY second the
      same emission box widths span 3.0-15.0x, so the between-row spread is smaller than the
      within-second spread. T-262 excludes duty_cycle / burst_length / period only when presence
      intervals are DISJOINT; here they OVERLAP, so all three are compared and duty alone
      (0.0099 vs 0.4592 against tol 0.115 = error 3.9) blocks the merge. The audit must cover
      the OVERLAPPING-window case, not just the across-silence one, and must decide what a
      fragment duty cycle even means. This is the honest route to the 16 -> 4-7 dedup target;
      T-288 made no change rather than move a threshold.'
    fifth_instance_2026_09_16: 'T-288 found THREE more at once, and they are the reason
      the 101.46 cluster will not merge. (a) Track.bandwidth_hz is a running mean
      (s.bw += (g.bw()-s.bw)/8) of whichever threshold-crossing boxes happened to
      associate - association history, not the emission. Within EVERY SINGLE SECOND one
      emission box widths span 3.0-15.0x, so the spread BETWEEN tracks is smaller than the
      spread WITHIN one second of one emission. xdb_bw is no better (mean |xdb-obw| 2.5 kHz,
      range 4.7-75.0 kHz). (b) duty_cycle 0.0082-0.4592 (56x) and (c) burst_length
      0.0065-0.0429 s hold the five rows apart on their own - duty 0.0099 vs 0.4592 against
      tol 0.115 is error 3.9, blocking the merge by itself. IMPORTANT SCOPE NOTE: T-262
      excludes those three statistics only when presence intervals are DISJOINT. Here they
      OVERLAP, so nothing excludes them. This audit must cover the overlapping-window case,
      not just the disjoint one.'

