      easier number. The ADR states unknown recall >= 0.80 and false-known <= 0.10 as if
      they were independent floors; the gate derives one from the other, so the binding
      constraint is recall >= 0.90 and the stated 0.80 is dead text. Establish which was
      intended: (a) recall >= 0.80, which means false-known <= 0.20 and the M3 gate would
      pass today at 0.1490; or (b) false-known <= 0.10, which means recall >= 0.90 and
