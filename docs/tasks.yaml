  - id: T-288
    milestone: M2-hardening
    title: 'Second dedup mechanism: one station yields ten comparable-strength,
      time-overlapping tracks that entity resolution collapses only to five rows'
    status: done
    priority: high
    deps:
    - T-280
    parallel_group: PIPE
    use_cases:
    - AWARE-053
    found_by: 'T-280 (2026-09-16), which isolated it after fixing the host-strength defect:
      candidates went 20 -> 16 and the 99.55-99.80 MHz region collapsed 5 rows -> 1, but
      101.46 MHz yields tracks with counts 261/231/112/65/58/56/51/39/8/3 at widths 18-64 kHz,
      and 101.67 adds three more'
    acceptance: 'NO host/fragment rule can reach these - widest/narrowest is 3.4x against the
      4x gate, and there is no 6 dB gap between a station core and itself, so T-280''s fix is
      not extensible to them. This needs the bandwidth route T-280 ruled out for fragments,
      PLUS a discriminator separating a skirt island from a genuine subcarrier: widening a
      narrow in-band emission to its host extent would break the invariant T-280 protected
      (a 12.5 kHz subcarrier inside a 180 kHz station must stay its own entry). Keep
      t219_a_narrow_signal_inside_a_confirmed_wide_station_stays_visible and
      t219_two_adjacent_stations_with_separated_extents_stay_two_entries green, and do not
      move OVERLAP_MIN_FRACTION, bandwidth_ratio, inband_fragment_bw_ratio or
      FRAGMENT_SNR_MARGIN_DB. Report the candidate count and settle time against the user
      a-priori target of ~4-7 signals in ~2-10 s; T-280 reached 16 in 13.24 s stream time'
    area: crates/hk-detect, crates/hk-estimate (bandwidth), crates/hk-model (entity resolution)
    needs: none
    model: opus
    effort: high
    core_interface: false
    outcome_2026_09_16: 'MEASURED, NO PRODUCT CHANGE - the prescribed route does not exist.
      Replayed the 45 s 2026-09-15 FM capture through the whole pipeline (16 rows, 25 tracks,
      reproducing T-280 exactly) and instrumented the detector directly. (1) THE BANDWIDTH
      ROUTE IS UNAVAILABLE: the cluster never reaches the +6 dB integration SEED - its settled
      spectrum is 3.04-3.74 dB over the floor across 101.4328-101.4984 MHz - so NO
      IntegratedEmitter region is ever formed over it, and its detections carry repeat=883 /
      unconfirmed=3 and ZERO Candidate::Integrated across all 177 evaluations. Only four
      integrated regions exist in the whole 2.4 MHz span; the nearest (101.2336-101.3789, the
      101.3 station) stops 50 kHz short of the cluster. T-280 asserted this extent was
      "already computed and already attached to each record" without measuring it.
      (2) TWO PREMISES CORRECTED: widest/narrowest is 4.87x (64.0/13.1 kHz), not 3.4x - i.e.
      ABOVE the 4.0 gate, not below it; and the 3.4x figure is the fingerprint
      Tolerances::bandwidth_ratio (1.5), a different constant from inband_fragment_bw_ratio
      (4.0). (3) THE REAL MECHANISM IS WIDTH INSTABILITY AT THRESHOLD, and it is a T-281
      instance rather than a new mechanism: within EVERY single second the same emission
      box widths span 3.0-15.0x (typically 5.0-7.5x), so the spread BETWEEN tracks is smaller
      than the spread WITHIN one second of one emission. Track.bandwidth_hz is a running mean
      (s.bw += (g.bw()-s.bw)/8) of whichever threshold-crossing boxes happened to associate,
      so it measures association history, not the emission. xdb_bw is no better (mean
      |xdb-obw| 2.5 kHz, range 4.7-75.0 kHz). (4) WHY FIVE ROWS, MEASURED: the five stored
      fingerprints carry duty_cycle 0.0082-0.4592 (56x) and burst_length 0.0065-0.0429 s - the
      T-281 window statistics - and T-262 does not reach them because it excludes those only
      when presence intervals are DISJOINT; here they overlap. duty 0.0099 vs 0.4592 against
      tol 0.115 is error 3.9, blocking the merge on its own. (5) WHY THE RELATION LAYER CLAIMS
      NOTHING (emitter_relation empty): bands_compete needs 0.6 of BOTH bands; the ten pairs
      give frac_wider 0.0-0.599, with two at 0.593 and 0.599 - just under the floor. Moving
      OVERLAP_MIN_FRACTION to 0.59 is exactly the forbidden move T-250 warned about, so it was
      not made. COUNT/SETTLE UNCHANGED: 16 rows in 99.6-102.0 MHz, settle 13.24 s STREAM time
      (= wall clock on a live device), against the ~4-7 in ~2-10 s target; the full 45 s
      replays in 3.87 s wall clock (debug, unpaced), which is why stream time is the honest
      figure. The four constants are untouched and the four invariant tests are green.
      REMAINDER: filed as the fifth T-281 instance - making width/duty/burst properties of the
      emission in the overlapping-window case is a measurement-honesty change to the real-time
      path and belongs with that audit, not a threshold move here.'
    separate_defect_found_2026_09_16: 'fixtures/hackrf/capture-2026-09-15-fm-band/iq.sigmf-meta
      (committed in f2c4dc5) is REJECTED by `hk replay`: "invalid SigMF metadata: missing field
      `overload`". Its hackriff:provenance block lacks overload, quantisation_limited,
      clock_source and clock_locked, which every 2026-09-13 fixture carries. The committed
      fixture therefore cannot be replayed at all; every measurement in T-288 used a locally
      patched copy. Needs a one-line fixture fix - not made here, as fixtures are outside this
      task''s scope. Blocks T-289.'
