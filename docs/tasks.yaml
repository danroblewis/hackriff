  - id: T-291
    milestone: M3
    title: 'M3 open set is short by ONE snippet (0.8990 vs 0.90): carrier recovery or a
      symbol-rate estimate C14 will trust on a near-constant-envelope constellation'
    status: done
    priority: high
    deps:
    - T-286
    parallel_group: M3A
    use_cases:
    - SIGNAL-062
    found_by: 'T-286 (2026-09-16): 356 of 396 abstain where 357 are needed. Residue 40 -
      VSB-AM 11, pi/4-DQPSK 14, 16-APSK 13, 8-FSK 2'
    acceptance: 'THE USER/SUPERVISOR SHOULD PICK THE ROUTE - T-286 names two and they
      differ in cost and reach. (a) CARRIER RECOVERY: substantial new DSP, and it also
      closes T-246, because T-286 located that pathology in the smeared input (an M-th
      power estimate removes constant phase but not residual carrier frequency offset).
      (b) C14 RATE TRUST on a near-constant-envelope high-order constellation: narrower,
      and unblocks 13 of the 40 (C14 currently gives a trusted rate on 0 of 36 16-APSK
      AND 0 of 36 genuine 8-PSK, so this is not specific to out-of-taxonomy inputs).
      Whichever is chosen: every other floor holds (top-1 >= 0.90 - currently 0.9087,
      top-2 >= 0.95, wrong-label <= 0.02/0.05), confidently-wrong stays at zero, and no
      floor constant moves. Being short by one snippet is NOT grounds to round or to
      revisit the floor - the supervisor ruling on T-285 settled that'
    area: crates/hk-classify, crates/hk-estimate (C14 symbol rate)
    needs: user or supervisor choice of route
    model: opus
    effort: high
    core_interface: false
    route_chosen_2026_09_16: 'SUPERVISOR RULING: take the CARRIER RECOVERY route. It
      fixes a real measurement defect (residual CFO) rather than widening what the
      classifier trusts. Keeping M3 red at 0.8990 until a genuine fix crosses 0.90 is
      correct - do not round, do not loosen. The C14 rate-trust option is NOT taken.'
    outcome_2026_09_16: 'DONE as a REFUTATION plus a real fix. (1) The route''s premise is
      wrong - residual CFO is NOT the cause. With lo_offset_hz = 0 the QPSK residual is
      unchanged (16.29 vs 16.08 N0 at 30 dB, EVM 12.8 vs 12.7%), and a control waveform
      with zero carrier offset reproduces the whole pathology. 8-bit quantisation and IQ
      imbalance were ablated too; neither matters. So there was nothing for carrier
      recovery to remove. (2) A REAL product-side defect was found and fixed in
      verify::symbol_samples: it skipped the matched filter''s edge transient in SAMPLES on
      a grid anchored to the SYMBOL PHASE, displacing every symbol in the record by
      (guard mod sps) - up to a full symbol, since sps = sample_rate / C14 rate is an
      integer essentially never. On a clean control EVM tracks that quantity exactly: 12.4%
      at sps 6.1, 12.2% at 6.2, 8.4% at 6.3, 10.4% at 6.73, and 1.5% at 6.0 AND at 6.5
      (guard 13 = exactly 2 symbols), which is what rules out "integer sps" as the
      explanation. The fix returns every sps to ~1.45%. Pinned by a new unit test in
      verify.rs; all 69 hk-classify tests pass. (3) The gate is UNCHANGED at 0.8990 /
      0.1010 and could not have moved - the verifier re-ranks class WITHIN a family and
      never touches the family, which is what unknown recall is computed from. No floor
      constant moved; wrong-label 0.0000; 0 of 396 held-out inputs given a family that is
      not their own. (4) T-246 is NOT closed: re-measured after the fix and still monotone
      in constellation size. Its cause is relocated to T-293. (5) The 40-snippet residue is
      untouched and carrier recovery reaches NONE of it - 13 of 40 (16-APSK) have no symbol
      clock at all, and the 27 psk-qam snippets are blocked by T-294.'
    outcome_2026_09_16: 'ROUTE REFUTED BY ABLATION, and the coordinator chose it. No
      carrier recovery was implemented because there is nothing to remove: zeroing the
      generator carrier offset moves genuine QPSK residual 16.08 -> 16.29 N0, and a
      zero-offset control reproduces the whole pathology. T-286 CFO mechanism is refuted.
      Worse, the route could never have worked: the verifier re-ranks class WITHIN a
      family and never touches the family, which is what unknown recall is computed from,
      so NO post-sync fix reaches the residue. Knowable from ADR-0016 4.5 before the
      choice. What it did fix is real: verify::symbol_samples guarded by whole SAMPLES
      instead of whole SYMBOL PERIODS, so every symbol was sampled guard mod sps early or
      late. Gate unchanged at 0.8990 / 0.1010.'

  - id: T-301
    milestone: M3
