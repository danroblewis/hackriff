  - id: T-327
    milestone: M3
    title: C14 rate-search lower edge and whitening block width scale with the record, so the analysis geometry
      moves with the observation
    status: done
    commit: ac8c52d
    priority: high
    deps:
    - T-310
    parallel_group: M3A
    core_interface: true
    model: opus
    acceptance: 'T-310''s root cause, and the reason its own ticket could not be fixed in features.rs. C14''s
      rate search sets f_min = max(rate_min_cells*fs/n, ..) and its whitening block width likewise scales
      as fs/n, so both move with the record length: f_min is 1964.6 Hz over N/8 against 1121.7 Hz over N
      on 2fsk. At the short window the true symbol-rate line falls BELOW the search floor and only its harmonic
      is findable - the best line lands at 0.49x/0.42x/0.50x/0.57x for 2fsk/4fsk/gfsk/msk, which is exactly
      the set of classes whose cyclic_db reads LOWER the longer they are watched. Pin the rate-search lower
      edge and the whitening block width in Hz so neither scales with the record. THIS IS NOT A RESCALING
      INSIDE features.rs: it changes significance_db for every C14 consumer - symbol-rate trust, the demod
      path, and hk-estimate''s own tests - which is why T-310 did not attempt it. Expect to re-measure those
      consumers and say what moved. No floor changes; if the honest fix costs the M3 gate, report the numbers
      rather than compensating'
  - id: T-328
    milestone: M3
    title: Carrying the four cyclic line significances as separate dimensions nearly doubles class separation,
      but only after the window dependence is fixed at source
    status: done
    commit: 117c031
    priority: normal
    deps:
    - T-327
    parallel_group: M3A
    core_interface: true
    model: opus
    acceptance: 'T-310 measured this and REFUSED to ship it, correctly. Carrying the four line significances
      as four dimensions instead of their max gives, at 20 dB and above, median pairwise d'' 7.77 against
      3.46 at fixed length and 4.22 against 1.65 mixed; separable class pairs 0.66 -> 0.96 and 0.41 -> 0.85;
      held-out distance to nearest class 0.21 -> 1.07. It was refused because it makes the window-dependence
      harm WORSE: fitting on full windows and scoring the same class''s N/8 bursts, the cyclic dimensions
      contribute mean clamped sum z^2 of 19.9 today against 55.0 with four dimensions, and four simultaneously-off
      dimensions is precisely T-248''s second-largest-|z| signature for withholding a claim - so genuine
      short bursts would be rejected from their own class. T-310 also did not run the gate on it, because
      choosing it on gate numbers would have been acceptance-tuning. Revisit ONLY after T-327 pins the analysis
      geometry, then measure the same short-burst harm again before deciding. If it still rejects genuine
      short bursts, say so and leave it unshipped - a large discrimination win that breaks ephemeral emissions
      is not a win, because CLAUDE.md makes those first-class'
  - id: T-329
    milestone: M2-hardening
    title: 'With the false alarms gone the analog chain session adds 0 sightings where it added 1: is the
      count or the test wrong?'
    status: done
    commit: 81e9233
    priority: high
    deps:
    - T-316
    parallel_group: PIPE
    core_interface: true
    model: opus
    acceptance: 'T-316 takes real-air false alarms from 875 detections to 2 and 5 candidate emitters to
      1, and one test fails as a consequence: hk-pipeline::signal_062_session_writes::signal_062_one_session_counts_one_sighting_and_stores_its_refined_tuning_once
      expects the analog chain session to add exactly 1 to the station emitter''s count, and it now adds
      0. T-316 BISECTED IT rather than assuming: reverting WIDEBAND_FM_OBW_HZ alone leaves it failing, so
      it is the detector change and not the constant. The ledger rows are IDENTICAL to main - two analog-chain
      demodulation rows plus one hk-track row, all count 1 - and only emitter.count differs, 2 on main against
      1 here, so the chain''s first demodulation sighting counted before and now resolves against the existing
      entry instead. Identification is unaffected: /chains/identifications still fires and PI 1694 still
      decodes. DECIDE WHICH IS RIGHT, on the semantics rather than on which makes the suite green: does
      a chain session that re-observes an emitter the detector already has constitute a new sighting, or
      the same one? The run is otherwise more accurate (10 emitters against 16, station width 136 kHz against
      333 kHz), which is evidence that resolving against the existing entry is the correct behaviour and
      the test pinned a count inflated by duplicates - but verify that rather than assuming it, because
      the opposite reading is that a genuine second observation is now being swallowed. This is T-209 sighting-semantics
      territory. Whichever way it goes, state the rule in the code so the next person does not re-derive
      it from a failing assertion'
  - id: T-330
    milestone: M4
    title: 'ALGID is parsed and unit-tested but unreachable from IQ: it lives in voice frames and nothing
      demodulates those'
    status: blocked
    blocked_on: >-
      a capability that does not exist: ALGID lives in the voice frames on the granted channel
      and nothing demodulates those yet (T-270 said so at the time). Unblocked by a voice-frame
      decode existing - not by a slot, and not by anyone deciding anything. Was sitting as todo
      and making the unblocked-work census lie until 2026-09-16.
    priority: normal
    deps:
    - T-270
    parallel_group: M4B
    model: opus
    acceptance: 'T-270 implemented and unit-tested the full ALGID table (0x80 clear, 0x81 DES-OFB, 0x84
      AES-256, 0xAA ADP, unlisted values Encrypted carrying the byte) and said plainly that it is NOT reachable
      from IQ in M4: an ALGID lives in the voice frames on the granted channel, and nothing demodulates
      those yet, so the e2e half rests on service options instead. That honesty is the right shape - the
      capability is proven where it is reachable - but it leaves the authoritative encryption statement
      unread. When a voice-frame decode exists, wire ALGID through it and make the call''s own header override
      the grant-time announcement, which is the whole reason the service-options bit may only RAISE to Encrypted
      and never lower to Clear. The VoicePermit seam already exists (hk-detect/src/trunk/voice.rs): a future
      vocoder must take one in its signature and the only way to get one is to ask. Keep that property -
      do not add a bypass for the decode path that reads the ALGID'
  - id: T-331
    milestone: M2-hardening
    title: Floor context is not keyed on bias-tee state, so an active antenna and a passive one pool into
      one noise floor
    status: done
    commit: b0aee72
    priority: normal
    deps:
    - T-325
    parallel_group: PIPE
    core_interface: true
    model: opus
    acceptance: 'T-325 made bias-tee state visible and deliberately changed no scoring. hk_dsp::floor::tracker::GainKey
      keys on gain state and an antenna_port hash but NOT bias_tee, so bias-tee-on and bias-tee-off frames
      pool into one floor context even though an active antenna''s LNA shifts the floor. This is the same
      shape T-303 fixed for BaselineKey, one layer down, and it is device-local physics by T-259''s rule
      so it belongs on the reads-the-device side. Add bias_tee to the key, or state with evidence why gain
      state already separates them and pin that with a test. Adding it changes floor CONTINUITY behaviour
      - a switch will start a new context rather than continuing one - so say what happens to an in-flight
      floor estimate at the moment of the switch, and make the answer safe: a floor silently restarting
      immature is a novelty-alarm storm, and one silently continuing across the switch is the bug. Treat
      Unknown as its own context, never as off'
  - id: T-332
    milestone: M2-hardening
    title: A bias-tee switch is not a device provenance step, so switching it can raise a spurious floor-rise
      anomaly
    status: done
    commit: 90cd0bb
    priority: normal
    deps:
    - T-325
    parallel_group: PIPE
    model: opus
    acceptance: provenance_steps in the report API already carries gain, calibration, spur-mask and antenna-port,
      so the explain-the-device-first path can suppress a novelty alarm the operator caused. A bias-tee
      switch is exactly such a self-inflicted change - an active antenna's LNA shifts the floor the instant
      it powers - and it is not in that list, so switching the tee currently presents as an unexplained
      floor rise. Add a bias-tee step. T-303 already relies on this machinery for the antenna-port case,
      where it noted that a port change is SEQUENTIAL and the alarm path explains it as self-inflicted;
      the same argument applies here. Do not suppress the anomaly - explain it, so the operator sees what
      caused the change rather than seeing nothing
  - id: T-333
    milestone: M2-hardening
    title: Baselines should refuse or disclose comparisons across differing bias-tee state, and treat unknown
      as incomparable
    status: done
    commit: 2968fa6
    priority: normal
    deps:
    - T-325
    - T-331
    parallel_group: PIPE
    model: opus
    acceptance: 'A capture taken with an active antenna powered is not comparable with one taken without
      it, and occupancy and floor baselines currently compare them silently. Decline the comparison, or
      disclose it in the result - and treat Unknown as INCOMPARABLE rather than assuming off, which is the
      whole point of T-325''s three-valued type. Sequence after T-331 since it depends on what the floor
      key does. The failure mode to avoid is the one T-303 measured: pooling two incomparable sources does
      not mainly cause false alarms, it causes MASKING - a real 12 dB rise scored 1.000 against its own
      baseline and 0.000 against the pooled one'
  - id: T-334
    milestone: M2-hardening
    title: 'The waterfall and timeline must be served at span-matched resolution: data, timestamps and resolution
      are backend, time-to-pixel mapping and view state are thin client'
    status: done
    commit: db5db5a
    priority: high
    deps: []
    parallel_group: UI
    core_interface: true
    model: opus
    acceptance: 'USER DIRECTION, received 2026-09-16 (the opening clause of the message was truncated in
      transit - it reads from ''at matching resolution'' onward, so if a specific trigger was named, confirm
      with the user before assuming). THE RULE: data, timestamps and SPAN-MATCHED RESOLUTION are the backend''s
      responsibility; time-to-pixel mapping and view state are thin-client presentation. So when a view
      asks for a span, the backend serves that span at a resolution matched to it - the client never downsamples,
      never interpolates, and never infers a timestamp. This follows CLAUDE.md''s thin-client rule (all
      signal logic in hk-api/hk-pipeline; ui/src holds interaction and presentation only, which explicitly
      includes pixel-to-Hz axis mapping) and extends it to the TIME axis. Fold into docs/07 (the data model
