  - id: T-349
    milestone: M2-hardening
    title: Timestamp is serde-transparent over i64, so the same response can carry nanoseconds and seconds
      with no naming cue
    status: done
    commit: 1f03e2e
    priority: high
    deps:
    - T-337
    parallel_group: PIPE
    core_interface: true
    model: opus
    acceptance: 'T-337 found this while auditing which records carry absolute capture time. hk_model::Timestamp
      is #[serde(transparent)] over i64, so ANY directly-serialized hk-model struct ships raw NANOSECONDS
      while its own envelope uses SECONDS - /api/occupancy''s interval, /api/observations record spans,
      SignatureMatch.t and SurveyReport.generated_at all do this. Same response, values 10^9 apart, and
      NO NAMING CUE distinguishes them: a field called t_s and a field called t sit side by side and mean
      different units. This is a latent correctness bug, not tidiness - a client that reads one as the other
      is off by 31 years, and nothing in the type system or the field name would catch it. Decide the rule
      (suffix every serialized time with its unit, or serialize Timestamp as seconds everywhere, or both)
      and apply it consistently; whichever way, the wire must be self-describing. Update docs/api.md and
      crates/hk-cli/tests/api_contract.rs together per T-079 and assert the VALUES - a contract test that
      checks shape would not have caught this. Check every consumer including ui/src before changing a unit
      on the wire'
