  - id: T-446
    milestone: MCANVAS
    title: After a retune the spectrum-history pyramid stops recording, permanently - the ring advances and coverage says observed, but nothing is written
    status: done
    priority: high
    parallel_group: PIPE
    core_interface: true
    model: opus
    deps: []
    use_cases: [AWARE-011, AWARE-042]
    found_by: 'T-437 (2026-09-17), the unified-surface spike - finding F4, reproducible in ~3 minutes'
    acceptance: |
      A LIVE BACKEND DEFECT, found by the spike and not diagnosed there (it was a UI spike).
      CONTROLLED EXPERIMENT, dedicated backend on :18788, fresh data dir, one retune:
        BEFORE retune   centre 100 800 000   grid observed = 88 / 128   level 0
        retune -> {action: retune, id: mock:hackrf:...d2b861dc263bc293}, segment 1
        T+20s  after    centre 433 920 000   grid observed =  0 / 128
        T+80s                                grid observed =  0 / 128
        T+140s                               grid observed =  0 / 128
        retune BACK to 100 800 000 (segment 2), +45 s -> grid observed = 0 / 32  NEVER RECOVERS
      AT THE SAME MOMENT, ON THE SAME SERVER:
        the IQ RING IS HEALTHY - t1_s tracks wall clock to 0.1 s, 576 MB buffered, dropped 0;
        the RECORD-DERIVED COVERAGE PLANE IS ALIVE - /api/coverage at 433.92 MHz reports 8/8 cells
          "observed", duty 1.0, observed_s 60, last_s moving forward between polls;
        the MEASUREMENT PLANE IS EMPTY - /api/timeline grid.observed_cells = 0, with
          resolution.budget.frequency.source_cells: 385 available.
      SO THE SYSTEM KNOWS IT IS LOOKING, STORES THE SAMPLES, AND WRITES NO SPECTRUM HISTORY.
      WHY IT IS HIGH AND WHY IT IS IN MCANVAS: it falsifies docs/16 §8's central claim the moment
      you use the surface's one device gesture. §8.4 makes pan-to-untuned -> retune the primary way
      to move around the canvas, and after that retune "live is the finest growing edge" is false.
      On a never-retuned backend the edge grows correctly - the spike measured the same tile going
      11712 -> 17280 observed cells in 28 s - so the defect is specifically in what a retune does to
      the history writer or the segment plumbing.
      DoD: root-cause it (hk-pipeline's history writer or the segment plumbing is where T-437
      pointed, but do not inherit that guess - measure), fix it, and assert the property: after a
      retune, spectrum history for the NEW centre begins accumulating, and a retune BACK resumes the
      original band. Reproduce the failure first so the test is known non-vacuous.
      UNVERIFIED ON REAL HARDWARE - the spike correctly did not touch the user's demo. Do not
      assume the mock and the live device fail the same way; say which you tested.
    notes: |
      Reproducible in ~3 minutes - the recipe is in spikes/t437-unified-surface/results/ and the
      spike's README.
      RELATED FOURTH STATE, and T-437 argues it is a normal state rather than an error: this
      exposes "OBSERVED-BUT-NOT-YET-MEASURED" - the radio was demonstrably tuned there and sampling
      (duty 1.0) and the pyramid holds nothing. Grey would be a lie in exactly the way §4 forbids;
      drawing data would be a bigger one. It is NOT T-423's "unknown" (the record aged out, we no
      longer know whether we looked) - this is "we certainly looked and have not written it down",
      which ON A LIVE EDGE IS THE NORMAL STATE OF THE NEWEST CELLS. T-441 owns the colour; this
      ticket owns the defect. Fixing the defect does not remove the state.
      TESTING PROTOCOL (CLAUDE.md): targeted tests only - `just test-crate hk-pipeline` and
      `just test-one <name>` - then HAND BACK. Never `just gate`; the coordinator gates at merge.
    commit: ecffd6a
    result: |
      FIXED - ONE MISSING PAIR OF PARENTHESES in crates/hk-pipeline/src/history.rs:
          if !continues && last_end.as_unix_nanos() > 0
              || shared.counters.history.frames_ingested.load(...) > 0
      Rust groups that as (!continues && A) || B, so `!continues` guarded ONLY THE FIRST DISJUNCT. B is
      frames_ingested - a RUN-WIDE counter shared by every segment - so once any segment had folded one
      frame it was true for ever and EVERY re-plumb sealed anyway. seal_through advances a MONOTONIC
      watermark, here to last_end + 1 hour, and any frame whose level-0 block ends at or before it
      returns Late. So the first retune stopped spectrum history for AN HOUR OF CAPTURE TIME, and the
      watermark never retreats - which is why retuning back recovered nothing.
      Introduced with this shape in 6c4612a (T-050), which added `!continues &&` in front of a
      pre-existing `A || B`. ITS OWN COMMENT STATES THE INTENT CORRECTLY; the precedence defeated it.
      REPRODUCED FIRST on the live mock: frames_ingested froze at 453 while frames_late climbed to 547,
      and /api/timeline reported 0/512 observed cells for the new centre while /api/coverage in THE SAME
      RESPONSE reported 296 observed. After the fix: new centre 216/512, original band 208 -> 312 after
      retuning back, frames_late 0 across both.
      THE TRAP IT RECORDED IS WORTH MORE THAN THE FIX. Its first test draft asked "has anything landed
      YET" - patient in WALL clock, unbounded in CAPTURE time. The defect is bounded in capture time
      (one hour) and a scripted radio outruns an hour of stream time in ~88 s of wall clock, SO THE
      BROKEN BUILD PASSED TWO OF THOSE ASSERTIONS. Only frames_late caught it. Each band assertion is
      now scoped to the capture-time window of the phase that must have recorded it; tightened, the
      broken build fails on assertion 2 and the fixed build passes in 1.6 s. Red-then-green both ways.
      That is the capture-clock-versus-wall-clock family in a NEW place: not a feature measuring the
      observation, but A TEST WHOSE PATIENCE WAS MEASURED IN THE WRONG CLOCK.
      Blast radius: Shared::continues is set in exactly one place (the control-API re-plumb).
      Mock only, and it says so; no front-end code is involved, so the live device should behave the
      same, but a real HackRF's settle gaps change WHEN frames arrive, not whether they land behind a
      watermark.
      NOTE FOR T-441: the fix does NOT remove observed-but-not-yet-measured. Post-fix, 433.92 MHz shows
      216 measurement cells against 224 coverage cells - the newest cells are legitimately
      looked-at-but-not-yet-written, the normal state of a live edge, distinct from T-423's "unknown".

  - id: T-447
    milestone: M3
    title: phase_features and derotate take their strong-envelope subset over the same broken mean rule T-431 just fixed
    status: in-progress
    priority: normal
    parallel_group: M3A
    deps: [T-431]
    use_cases: [SIGNAL-062]
    found_by: 'T-431 (2026-09-17), measured while fixing duty and low_fraction; left alone as a wider blast radius'
    acceptance: |
      T-431 fixed `duty` and `low_fraction` by taking their fractions against the emission's own ON
      LEVEL - the fixed point of L = mean(a | a > L/2) - instead of against the record's own mean
      envelope, which for a sparse train is set by the OFF time.
      IT THEN MEASURED THE SAME RULE ONE LAYER OVER AND LEFT IT: `phase_features` and `derotate`
      take their Azzouz-Nandi "strong envelope" subset over the SAME 0.5 x mean(a) threshold. For a
      sparse train that subset is mostly noise - AT 10 dB IT IS 0.63 OF THE RECORD INSTEAD OF 0.05 -
      so sigma_ap, sigma_dp and the de-rotation for `pulse` are measured over noise.
      T-431 left it deliberately and correctly: fixing it moves sigma_ap, sigma_dp AND EVERY
      CUMULANT, which is a wider blast radius than a duty fix and deserves its own ticket and its
      own before/after.
      THE FIX IS PROBABLY ALREADY WRITTEN - T-431's on-level fixed point is the same construction,
      and it is measured, monotone, terminating in 2-11 iterations, and reduces to the old answer at
      iteration 1. Check that before designing anything new.
      NOTE THE HISTORY: sigma_ap and sigma_dp are the ORIGINAL members of the observation-not-signal
      family (T-240 - phase residual random-walks with the record). If they are now ALSO measured
      over the wrong sample subset, that is a second, independent defect in the same two features,
      and worth saying so plainly rather than folding it into the first.
      Floors: ADR-0016 §7.1, read §7.2 first - the held-out figures have a 0.0084 draw sd, so a
      +/-0.02 move is noise. Measure merge base and branch back to back (T-419's method) since this
      one CAN move family numbers.
      Pin properties, not figures - T-431's new test asserts a rectangular train of known duty reads
      that duty at every rung, with the residual noise-crossing term against its closed form rather
      than a widened tolerance. Do the same here.
    notes: |
      TESTING PROTOCOL (CLAUDE.md): targeted tests only - `just test-crate hk-classify`,
      `just test-crate hk-estimate`, `just test-one <name>` - then HAND BACK. Never `just gate`; the
      coordinator gates once at merge.
  - id: T-448
    milestone: M2-hardening
    title: view_pause_keeps_capture fails at 28 threads and once at 8 - a live undiagnosed defect the thread cap now hides
    status: in-progress
    priority: normal
    parallel_group: PIPE
    deps: [T-436, T-430]
    found_by: 'T-436 (2026-09-17), in its own A/B - it flagged the defect its change makes rarer'
    acceptance: |
      T-436 capped the suite at 8 test threads and SAID PLAINLY what that hides. In its A/B the
      test that failed at 28 threads was
      hk-pipeline::view_pause_keeps_capture::holding_the_view_cannot_stop_the_runs_rows_the_ring_or_detection
      - and the same test failed the one 8-thread run recorded on this ticket's predecessor.
      RUNNING TALLY: 28 threads -> 4 runs, 4 failures; 8 threads -> 4 runs, 1 failure. Better, not
      sufficient. The cap lowered the sampling rate on a defect nobody has diagnosed.
      NOTE THAT T-430 ALREADY FIXED A DIFFERENT DEFECT IN THIS SAME FILE: the phase closed when the
      SOURCE's emitted counter passed 2500000 while the assertion read the CAPTURE and RING
      counters, which trail by the block in flight - 6752 samples of headroom, less than half a
      16384-sample block. That one is fixed and its rate went 3/48 -> 0/48. THIS IS A DIFFERENT
      FAILURE in the same file, so do not assume T-430's mechanism; measure which assertion fires
      and what quantity it bounds.
      T-430's rule applies: A TEST MAY NOT BOUND A QUANTITY WHOSE NATURAL RANGE IT HAS NOT
      MEASURED. And T-446 added a second clock to watch for - its first test draft was patient in
      WALL clock but unbounded in CAPTURE time, so the broken build passed. Check which clock this
      test's patience is measured in.
      DoD: measure the range, root-cause, fix, and report before/after rates over at least 10 runs
      at BOTH 8 and 28 threads - 28 specifically, because that is where the sampling rate is high
      enough to see it and the cap is what made it rare.
    notes: |
      TESTING PROTOCOL (CLAUDE.md): targeted tests only - `just test-crate hk-pipeline`,
      `just test-one <name>` - then HAND BACK. Never `just gate`; the coordinator gates at merge.
