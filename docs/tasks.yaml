  - id: T-441
    milestone: MCANVAS
    title: Honesty tiers and grey - the rendering rule that makes the surface trustworthy
    status: done
    priority: high
    parallel_group: CANVAS-FE
    core_interface: true
    model: opus
    deps: [T-440]
    use_cases: [AWARE-011]
    found_by: 'MCANVAS decomposition (user directive, 2026-09-17)'
    acceptance: |
      docs/16 §8.3 and §4. The three honesty tiers - live-iq, spectrum-history, survey-overview -
      stay VISUALLY DISTINCT, so a wide or deep zoom never fakes resolution the hardware did not
      capture. §4's rule is unchanged; the gain is that it now has ONE place to be enforced
      instead of three.
      GREY = GENUINELY UNOBSERVED, AND IT IS THE POINT. Across 6 GHz and a retention window most
      of the canvas is honestly empty, and THE SHAPE OF WHAT IS NOT GREY IS THE SURVEY. This is
      not an edge case in a renderer; it is the main information the surface carries.
      THE FOURTH STATE IS NOT GREY. T-423 put "unknown" on the wire as a VALUE - we no longer know
      whether we looked, for rows before the oldest surviving record - with resolution.grey_rule
      saying in the response that it is not grey and not a level, and naming hatching (T-413) as
      the drawing. T-413 met this trap from the other side and declined the obvious rendering for
      exactly this reason: reusing an "unmeasured" mark for a measured-and-empty gap spells
      "looked and it was quiet" as "never looked". Three states must be three marks.
      DoD: the three tiers are distinguishable in a rendered frame (assert on what is drawn, not
      on a flag); grey appears if and only if state == "unobserved"; "unknown" renders as a fourth
      thing; and a zoom beyond live-IQ resolution shows survey-overview rather than upscaled
      detail presented as measurement.

    notes: |
      TESTING PROTOCOL (CLAUDE.md, after T-416/T-426/T-430 each stalled on it): the agent runs
      TARGETED tests only - `just test-crate <crate>` or `just test-one <name>` for what its diff
      touches - and HANDS BACK when they pass. NEVER `just gate`, never the full suite. The
      COORDINATOR runs the full gate once, at merge. A full gate takes 7-25 minutes here and the
      harness backgrounds it at its 600 s cap, so an agent that waits on one ends its turn stalled
      with uncommitted work.
    commit: 445fbef
    result: |
      DONE. The fifth state (observed-but-not-yet-measured) is SPARSE DOTS ON A COLD DARK-BLUE
      GROUND - CELL.AWAITING. The discriminator is already on the wire and needs no clock and no
      prediction: coverage says observed, grid.max_db is null, grid.frames is ZERO. frames > 0
      with no level stays NO_LEVEL. A tile with no per-cell frame counts decodes to NO_LEVEL, the
      claim that says least - the specific state is granted only on POSITIVE EVIDENCE.
      WHY DOTS AND NOT A SPINNER: THE MARK MUST NOT PROMISE ARRIVAL. T-446's defect wrote exactly
      this cell for an hour of capture time, and a "loading" mark would have made it INVISIBLE.
      The alternative discriminator (is this cell near the live edge?) was rejected as a guess
      about the future, which is what this state must not assert.
      TIERS PROVED IN A FRAME: surface-raster replays recorded ops - including THE BYTES ACTUALLY
      UPLOADED TO THE SAMPLERS - through the CPU half of the table the shader is generated from,
      asserting on pixel histograms. Three tiers, three pairwise-different pictures of identical
      measurements, YET THE RAMP NEVER MOVES. Mutation-checked, plus a real-WebGL2 run matching
      the CPU rule on 114973/115200 pixels, every difference a one-pixel pattern edge.
      CELL_MARKS needed a fifth row AND a third mark kind (`pattern`), because T-413's named
      drawing for `unknown` is a HATCH and T-440 had it flat. Patterns are GLSL strings in one
      table, compiled by both shader and CPU rule, so a pattern cannot become two
      implementations. CELL_MARKS.length is asserted equal to the state count.
      THE MERGE GATE CAUGHT AN INTEGRATION DEFECT and the agent's diagnosis beat mine: T-442
      landed mid-flight with fixtures predating `measured`, so sourceCellPx threw - but the real
      bug was that it runs inside drawRegion, so the throw propagated out of render and BLANKED
      EVERY PANE. Pinned by a test that deletes the field and asserts the frame drew.
      IT ARGUED AGAINST MY SUGGESTED FIX AND WAS RIGHT: drawing no survey lattice would make a
      survey-overview tile PIXEL-IDENTICAL to a live-iq tile, erasing the tier rather than being
      imprecise about the pitch. It fell back to the tile's own served grid instead.

  - id: T-442
    milestone: MCANVAS
    title: The pane model - split, independent pan/zoom, per-pane follow-mode and per-pane pause
    status: done
    priority: high
    parallel_group: CANVAS-FE
    core_interface: true
    model: opus
    deps: [T-440, T-347]
    use_cases: [AWARE-011, AWARE-042]
    found_by: 'MCANVAS decomposition (user directive, 2026-09-17)'
    acceptance: |
      docs/16 §8.4. PANES EXIST BECAUSE OF MULTIPLE SDRs: tuned ranges may be far apart - 100 MHz
      and 2.4 GHz are not watchable together at any useful density - so panes split the canvas and
      independently pan, zoom and follow-live different sections OF THE SAME SURFACE.
      T-380'S INVARIANT SURVIVES IN A STRONGER FORM and must be preserved: there is still exactly
      ONE thing being looked at; panes are where you look FROM, not extra things to look at.
      Additional SDRs widen COVERAGE; they never split the subject.
      PER-PANE FOLLOW-MODE pins a pane to the growing edge. PER-PANE PAUSE freezes that pane's view
      ONLY - capture, ring and detection stay always-on, which is the user's standing invariant.
      BUILD ON T-347, WHICH LANDED TODAY: it retired /api/control/pause entirely because a run-wide
      boolean cannot represent N viewers, and made the client's `time.live` the single mechanism -
      pausing IS entering the state scrubbing already produced, with no third state for "scrubbed
      but not paused". Do NOT reintroduce a run-wide flag, and do not add a second pause concept
      per pane; a pane's time window IS its pause state.
      DoD: N panes with independent (center_f, span_f, center_t, span_t); follow-mode per pane;
      pausing one pane provably does not affect another pane or any other viewer (assert it the way
      T-347 did - two consumers, values not status codes); capture keeps advancing throughout.

    notes: |
      TESTING PROTOCOL (CLAUDE.md, after T-416/T-426/T-430 each stalled on it): the agent runs
      TARGETED tests only - `just test-crate <crate>` or `just test-one <name>` for what its diff
      touches - and HANDS BACK when they pass. NEVER `just gate`, never the full suite. The
      COORDINATOR runs the full gate once, at merge. A full gate takes 7-25 minutes here and the
      harness backgrounds it at its 600 s cap, so an agent that waits on one ends its turn stalled
      with uncommitted work.
    commit: 75c7ebe
    result: |
      DONE. A PANE'S TIME WINDOW IS ITS PAUSE STATE, as a union whose two arms carry DIFFERENT
      DATA: { live: true, spanNs } has NO CENTRE because a following pane borrows the edge,
      re-derived every frame; { live: false, centerNs, spanNs } is frozen on an absolute instant.
      So "scrubbed but not paused" and "paused with a stale centre beside a live window" are
      states THE TYPE CANNOT SPELL. That is the right answer to T-347's finding that a run-wide
      boolean cannot represent N viewers: the fix is not a better flag, it is NO FLAG. A test
      reads a paused pane's keys and greps the source for `paused:` - there is none.
      freezeAt() is a COORDINATE CHANGE, NOT A MODE CHANGE: it writes down the window already
      showing, so the frame you pause on is deepEqual to the one before, and freezing an
      already-frozen window is a no-op rather than a jump to the edge. panTime freezes first,
      because an edge-pinned pane carrying an offset IS the third state; dragging forward clamps
      and stays frozen, so re-following is explicit and never a gesture ending near the edge -
      T-407's lesson on the other axis.
      ISOLATION PROVED ON VALUES, three ways: (1) two panes over twelve frames with the edge
      advancing unconditionally - A pauses at frame 4 and is poked repeatedly, B's box top is
      strictly advancing AND equal to the edge every frame, and B's entire state is deepEqual to
      the instant A paused; (2) THE REQUESTS THE CLIENT BUILDS (T-367's rule) - 40 frames through
      the real Surface, the paused pane addressing exactly ONE set of tile rows while the live
      pane crosses several; (3) a spy fetch over every pane operation sees an EMPTY CALL LIST -
      pausing is, on the wire, NOTHING, which is what makes it unable to reach another pane,
      another browser, or the radio.
      Also asserted: zooming one pane three levels leaves another's untouched; split hands back
      two panes on the IDENTICAL box (one surface, two places to look from); the last pane cannot
      be closed; 100 MHz and 2.45 GHz render in ONE frame through ONE context at two levels.
      THE STATED LEVEL IS THE DRAWN LEVEL: paneStatuses joins pane state to the PaneReport the
      renderer ACTUALLY DREW WITH, so it cannot drift into a second calculation that disagrees
      with the pixels. levelDivergenceNote() is §8.5a's sentence and returns null when every pane
      agrees, because then there is nothing to explain.
      CAVEAT THE AGENT VOLUNTEERED: nothing mounts it yet, because nothing mounts the surface yet.
      The statement is produced and asserted; T-443's chrome is where it renders.
      Seams left rather than built: rects()/list() for T-443, read PER FRAME with deliberately no
      change event, because re-laying-out on one is T-388's box-jump.

  - id: T-443
    milestone: MCANVAS
    title: The zoomable minimap - another viewport, with pane rectangles and per-SDR live segments
    status: done
    priority: normal
    parallel_group: CANVAS-FE
    deps: [T-440, T-442]
    use_cases: [AWARE-042]
    found_by: 'MCANVAS decomposition (user directive, 2026-09-17)'
    acceptance: |
      docs/16 §8.3. The minimap is NOT a fifth widget - it is another viewport at a coarse level,
      through the same context and the same LRU, overlaying rectangles for where each pane is
      looking and lit segments for where each SDR is currently live.
      That framing is the whole design: the old frequency navigator showed "every currently-active
      capture window as a lit segment" and the old time navigator showed a compressed history, and
      keeping them in step with the main view is what kept failing. As a viewport it cannot drift,
      because it reads the same tiles at a different level.
      DoD: the minimap renders from the shared LRU with no private fetch path; pane rectangles
      track pane state every frame (not on a poll - T-388's box-jump was a per-poll layout against
      a per-frame scroll); per-SDR live segments come from the same coverage the panes read.

    notes: |
      TESTING PROTOCOL (CLAUDE.md, after T-416/T-426/T-430 each stalled on it): the agent runs
      TARGETED tests only - `just test-crate <crate>` or `just test-one <name>` for what its diff
      touches - and HANDS BACK when they pass. NEVER `just gate`, never the full suite. The
      COORDINATOR runs the full gate once, at merge. A full gate takes 7-25 minutes here and the
      harness backgrounds it at its 600 s cap, so an agent that waits on one ends its turn stalled
      with uncommitted work.
    commit: 0ab2e76
    result: |
      DONE, and THE MINIMAP WAS FINE - the defect was in the shared cache. "Another viewport"
      survived contact with exactly one exception: TileCache::setViewports matched queued and
      in-flight tiles BY EXTENT ONLY, which was sound while every viewport was a pane at a
      comparable zoom. A VIEWPORT THE SIZE OF THE SURFACE BREAKS IT, because every fine-level tile
      for a pane the user had already left still intersects a 6 GHz map - so VIEWPORT-CHANGE
      CANCELLATION SILENTLY STOPPED CANCELLING ANYTHING, turning the in-flight cap into a queue
      the user waits out at 11.4 ms/tile. A Viewport is now a box AND its levels, and a tile is
      wanted when some viewport draws at its level or one step coarser (the parent pin). Strictly
      better than the predicate it replaced; both directions asserted.
      THE OVERLAY PASS IS SEPARABLE BY CONSTRUCTION, not by a flag: a DIFFERENT GL PROGRAM IN A
      DIFFERENT PASS run after Surface::render() returns (Surface never calls it), whose shader
      has no sampler, no cmap and no cell-state uniform - structurally incapable of producing a
      measurement colour or a grey, asserted by grepping the compiled sources; and EVERY OVERLAY
      QUAD IS A STROKE, NEVER A WASH, with a test failing any quad covering more than 4 px in BOTH
      dimensions. That is the defect the spike hit inside itself. Payoff: data draws are
      byte-identical with overlays on and off, so the pixel comparison needs no setOverlays(false).
      paneStatuses mounted via SurfaceChrome (pure readoutOf() view model + thin DOM binder),
      updated every frame from the PaneReport[] the renderer just returned. THE MINIMAP IS IN THE
      SAME STATUS LIST AS THE PANES, so levelDivergenceNote() fires with the map named in it -
      §8.5a's case, since a 6 GHz map is essentially never at a pane's level.
      No other special-casing: the minimap is a one-pane PaneModel appended to the panes' view
      list for ONE render() call - one context, one LRU (a tile wanted by pane and map at one
      level is asserted fetched once), one ramp, one grey rule.
      TWO JUDGEMENT CALLS FLAGGED: a lit segment sits at the live edge IN TIME rather than pinned
      to the top of the strip, because "currently live" is true NOW - so a minimap scrubbed into
      the past lights nothing, and the alternative is the fixed-screen-coordinate overlay the
      time-axis invariant forbids. And segments read activeWindows() re-exported from
      navigators.ts, asserted to be the SAME FUNCTION OBJECT - no second reader of `windows`.

  - id: T-444
