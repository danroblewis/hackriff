  - id: T-219
    milestone: M3
    title: "Overlapping-candidate resolution: a Confirmed signal suppresses candidates overlapping its band, and overlapping candidates compete (merge or rank by evidence) so duplicate offset boxes collapse"
    status: done
    commit: 25b3d01
    priority: high
    deps: []
