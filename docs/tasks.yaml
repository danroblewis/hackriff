      via canvas hit-testing or a thin interaction layer that RE-LAYS-OUT EVERY FRAME from the identical
      mapping. ACCEPTANCE: a box stays pinned to its signal energy as new rows scroll in, with no per-poll
      jump, LIVE AND WHILE PAUSED OR ZOOMED. Fold into docs/14 and ADR-0017 as an extension of T-337''s
      shared-axis rule to the box overlay. Note T-337''s own finding: the client previously had FIVE time
      mappings and the nominal rows-per-second error grew LINEARLY WITH AGE (a box 400 rows back sat about
