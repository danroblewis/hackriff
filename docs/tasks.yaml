      The user names three symptoms and says they are ONE failure. T-368 closed two
      of them (the grey block and the Live backfill, via the coverage map). THE EMPTY
      SIDEBARS ARE STILL OPEN and are the live-visible one.
      This is an AUDIT task before it is a fix task: enumerate every surface, and for
      each one determine whether it can render data that exists for the current
      window, and what it does when the window is scrubbed into history. Report the
      census before fixing. The inventory lists are already time-scoped to the view
