      what the user signs off is the IMPLEMENTATION PLAN and its staging, not the model.
      Cover all six invariants from CLAUDE.md: (1) a signal is a time-frequency region
      with centre, width AND time extent - ephemeral bursts and chirps first-class, no
      carrier or stable frequency required; (2) Explore Candidate/Confirmed reflect only
