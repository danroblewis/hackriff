  - id: T-436
    milestone: CI
    title: The suite is green at --test-threads 8 and flaky at nextest's default 28 - the coordinator's gate runs at the flaky one
    status: done
    priority: high
    parallel_group: CI
    deps: [T-383]
    found_by: 'coordinator (2026-09-17), after three consecutive gate runs on one clean diff each failed on a DIFFERENT test'
    acceptance: |
      MEASURED, ON ONE TREE, ONE DIFF, IN ONE SITTING. Gating T-426 (a pub(crate) change inside
      hk-api plus docs and a contract test), three consecutive full runs at nextest's DEFAULT
      concurrency each failed on a DIFFERENT timing-sensitive test:
        run 1  hk-plugins::readsb readsb_wedge_message_ends_the_wrapper_without_waiting_for_the_child
        run 2  hk-cli::api_contract coverage_answers_per_cell_in_time_and_says_when_it_no_longer_knows...
        run 3  hk-cli::api_contract the_band_collapsed_activity_series_is_measured_and_states_its_fold
      Each passes in isolation (5/5, 10/10 at load 13.5, 6/6 respectively). Then the SAME tree, the
      SAME tests, with only concurrency changed:
        cargo nextest run --workspace --test-threads 8  ->  2298/2298 PASSED, NO EXCLUSIONS.
      T-426's own agent independently reported the same thing: 2181/2181 at --test-threads 8, and
      four runs at default concurrency each failing a rotating set (24 hk-plugins, then 24, then
      decoded_capture alone, then readsb alone). T-300's agent measured the mechanism directly:
      hk-plugins' 43 tests pass in 8.9 s isolated versus 24-43 s PER TEST during a concurrent run.
      WHY THE DEFAULT IS WRONG HERE. nextest defaults test-threads to the core count (28). Many of
      these tests are not CPU-bound units - they start `hk serve`, spawn plugin subprocesses, drive
      real-time-paced replays and bound wall-clock latencies. Twenty-eight of those at once on a box
      that ALSO has up to four Rust-building agents by design (CLAUDE.md, T-144) is oversubscription
      of exactly the resource they measure. The heavy-serial group does not help: T-383 established
      that `max-threads = 1` serialises the group against ITSELF within one invocation and does
      nothing about the ~27 tests running concurrently outside it.
      THE COST IS PAID EVERY MERGE. Each false red costs a 7-12 minute re-run, plus the judgement of
      deciding it was false - and the judgement is the expensive part, because dismissing a red is
      exactly the habit that lets a real one through. Today it also cost three separate agents time
      they spent proving failures were not theirs.
      DoD: decide and encode the concurrency the Rust suite runs at. The obvious candidate is a
      `test-threads` setting in .config/nextest.toml, which would apply to CI and every agent as
      well as to me. MEASURE THE COST: 8 threads took 1403 s wall clock against the default's ~1450 s
      when it completes, so on this box the slower setting appears to be FREE or nearly so - verify
      that, because "it is slower but correct" and "it is the same speed and correct" are different
      arguments and only one needs a trade-off discussion.
      Consider whether the right number is a fixed 8, a fraction of the core count, or different for
      CI (a dedicated runner, nothing else on the box) than for the dev Mac (four agents by design).
      Do NOT add a retry (T-344's standing instruction) and do not add names to heavy-serial - T-383
      already measured that as the wrong lever.
    notes: |
      CORRECTION BY THE COORDINATOR, SAME DAY: my headline above overstates the result. The
      "2298/2298 at --test-threads 8" run was ONE run. A later 8-thread run on a different diff
      (T-300's, entirely inside hk-detect) FAILED on hk-pipeline::view_pause_keeps_capture, which
      then passed 0/8 isolated and 2302/2302 on the immediate re-run at the same 8 threads.
      So the honest claim is: 8 THREADS IS BETTER, NOT SUFFICIENT. The rate drops sharply but does
      not reach zero, which is what you would expect if concurrency AMPLIFIES the underlying defect
      rather than being it. That matters for the DoD: picking a thread count is worth doing on the
      measured evidence, but it must not be sold as a fix, and it must not reduce the urgency of
      T-430 and T-433, which are the actual defects. A test that only passes on an idle machine is
      wrong even when the machine is usually idle.
      Measured so far, all on this box: default 28 threads -> 3 consecutive full runs, 3 DIFFERENT
      failures. 8 threads -> 3 full runs, 1 failure (2298/2298, then 1, then 2302/2302).
      This does not replace T-430 or T-433. Those are individual tests bounding quantities whose
      range they never measured, and they should still be fixed - a test that only passes on an idle
      machine is wrong even if the machine is usually idle. This ticket is about the harness making
      that latent wrongness fire constantly, and about the coordinator's per-merge check being the
      place it fires hardest.
      The T-430 coverage test's failure here reproduced its known signature exactly: row 1 picking up
      6.8 ms of capture from the live edge read by a previous HTTP round-trip, the same figure T-425
      measured.
    commit: dfe9284
    result: |
      DONE, and THE COST IS NEGATIVE - there was no trade-off to discuss.
      .config/nextest.toml gets [profile.default] test-threads = 8, with [profile.ci] at "num-cpus"
      selected by NEXTEST_PROFILE in the workflow. No retry, no name added to heavy-serial.
      MEASURED A/B, back to back on one tree, warm, only the thread count changed: 8 threads gave
      2205/2205 in 234.3 s of nextest time; 28 gave ONE FAILURE in 279.6 s (+19%), 449 s wall (+61%),
      1909 CPU-seconds against 1312 for the same tests. FASTER AND CORRECT.
      AND IT IS STRUCTURAL, not luck. By group: heavy-serial 224.1 s at 8 vs 279.4 s at 28; everything
      else 1088.2 s vs 1629.2 s. THE SERIAL GROUP IS ONE-AT-A-TIME AT ANY SETTING, SO ITS DURATION IS
      THE CRITICAL PATH - 96% of the 8-thread run, 100% of the 28-thread one. The other 1939 tests are
      off the critical path either way (1088 s over 7 free threads = 155 s; 1629 s over 27 = 60 s), so
      parallelism outside the group has nothing left to overlap with and can only steal CPU from the
      tests that ARE the critical path. Same mechanism as the flakes - those are the tests bounding
      wall-clock latencies.
      CORROBORATION FOUND RATHER THAN PRODUCED: docs/10 §3.4 (T-257) measured LEAK lines - a macOS
      pipe(2)/FD_CLOEXEC race between concurrently SPAWNING test processes - at 6/10 runs at 28, 6/12
      at 16, and ZERO at 8 and 6. A separate investigation months ago found the same discontinuity in
      the same place.
      CI AND DEV DIFFER, leaving CI alone: 8 is calibrated for a box where 24 of 28 logical CPUs are
      committed to four building agents BY POLICY. A hosted runner is a dedicated 2-4 vCPU container
      with no co-tenants, where one-per-CPU is the uncontended number. That also rules out "a fraction
      of the core count" - the constraint scales with how much of the box is someone else's, not with
      cores.
      Encoding verified rather than trusted: an invalid value is rejected by name, so nextest does read
      the file; NEXTEST_PROFILE=ci still reports heavy-serial as an override for the default profile.
      WHAT IT MAKES HARDER TO DETECT, written into the file above the number: it lowers the sampling
      rate on exactly the defects T-430 said to keep hunting. The test that failed at 28 in its A/B was
      hk-pipeline::view_pause_keeps_capture, a live undiagnosed defect now firing less often. Tally:
      28 -> 4 runs, 4 failures; 8 -> 4 runs, 1 failure. Filed as T-448.
      Side effect: just test-crate / test-one are now capped too. CLAUDE.md asked agents for
      --test-threads 6 by hand, which neither recipe ever passed, so that rule had no effect.

  - id: T-437
    milestone: MCANVAS
    title: SPIKE - the unified full-spectrum surface - one WebGL2 canvas, de-welded axes, split panes, zoomable minimap
    status: done
    priority: high
    parallel_group: SPIKE
    core_interface: true
    model: opus
    deps: [T-421, T-423, T-434]
    use_cases:
    - AWARE-011
    - AWARE-042
    found_by: 'the user, 2026-09-17 (design decision brief); folded into docs/16 §8'
    acceptance: |
      DE-RISKING SPIKE for the user's decision in docs/16 §8. READ §8 FIRST - it is the
      specification and this ticket is its proof obligation.
      RUN ON REPLAY/SYNTHETIC THROUGH THE MOCK SDR, AND IT MUST NOT BLOCK THE LIVE PATH. The
      user's demo holds the real HackRF on :8899; do not bind 8789/8899/8900 and never issue a
      real retune against it.
      PROVE FOUR THINGS END TO END:
        1. DE-WELDED PER-AXIS TILE ADDRESSING served over a route - independent level_f and
           level_t. §5.2's Correction 2 already measured the defect: the default ladder coarsens
           frequency x16 and time x86400 across its levels, which is a ladder for one band over a
           long time, not a map. This is the backend half of §7 step 4 (T-434), so that work is a
           PREREQUISITE, not a parallel effort - do T-434's t_factor first or as part of this.
        2. ONE WebGL2 CONTEXT, N SCISSORED PANES via gl.viewport + gl.scissor, a SHARED tile
           texture LRU keyed by (level_f, level_t, f_block, t_block), grey-for-missing, and the
           honesty tiers (live-iq / spectrum-history / survey-overview) VISIBLY DISTINCT. The
           shared LRU is why it must be ONE context: a tile visible in two panes uploads once.
        3. THE LIVE EDGE writing finest tiles for tuned ranges, PER-PANE FOLLOW-MODE, and
           pan-to-untuned -> retune through T-343's gated typed DeviceAction with device_id
           recorded (one capture at a time, settle gap honoured, no second path to the device).
        4. SPLIT PANES + ZOOMABLE MINIMAP, with pane-viewport rectangles and per-SDR live
           segments.
      EXIT CRITERION, from the user: it convincingly replaces BOTH edge scrubbers AND the
      separate history view. If it proves out, §8 becomes the UI direction and §7's remaining
      steps are re-planned around it.
      WHAT MUST NOT BE FAKED: grey means genuinely unobserved and is the main information this
      surface carries - across 6 GHz and a retention window most of the canvas is honestly empty,
      and the shape of what is NOT grey is the survey. Never invent resolution the hardware did
      not capture; a wide or deep zoom shows survey-overview, not fabricated detail.
      PAUSE FREEZES A PANE'S VIEW ONLY. Capture, ring and detection stay always-on. T-347 has just
      made pause per-viewer rather than per-run, which is the same direction reached
      independently - build on it, do not reintroduce a run-wide flag.
    notes: |
      This is a SPIKE: throwaway is acceptable and expected (spikes/ exists for it). The
      deliverable is a YES/NO on the exit criterion with evidence, not production code. Say
      plainly what did not work.
      Read the recurring defect family it is meant to eliminate, because the spike should
      demonstrate that each one cannot recur under one renderer: sliver-of-data (T-420),
      box-jump (T-388), fill and resolution (T-397/T-411), axis and colormap divergence (T-397),
      wheel-zoom mismatch (T-412). Every one was two implementations of the same idea drifting
      apart.
      The freeze is in force: no further polish on the separate navigator widgets. Genuine
      backend bugs behind them stay (T-347, T-348).
    commit: 4282b6d
    result: |
      SPIKE COMPLETE. VERDICT: YES FOR THE RENDERER, NO FOR THE SYSTEM AS IT STANDS - and two of the
      blockers are outside the renderer entirely. None of the four findings is a reason to abandon the
      design; all four are cheaper to fix than the scrubbers were to keep.
      Rig: headless Chrome, real WebGL2 on ANGLE Metal (M3 Ultra), 1760x1000 at DPR 2, backend on
      :18787/:18788 against the mock SDR. 31 automated checks, all green. Never bound 8789/8899/8900;
      never touched the real HackRF. Evidence and re-run recipe in spikes/t437-unified-surface/.
      THE RENDERER IS THE EASY HALF BY TWO ORDERS OF MAGNITUDE: 48 panes at p95 2.2 ms, FLAT in pane
      count (what scales is draw calls, ~450 at 48 panes, and 450 trivial quads is nothing). 7x
      headroom inside 60 Hz, surviving a 5-10x Jetson derating.
      THE SHARED LRU IS THE CHEAPEST PART and §8.3's claim holds exactly: 95 distinct keys -> 95
      uploads, up to 8 panes sharing one tile, 18.68 MB resident against 149.44 MB for one cache per
      pane. Upload 0.026 ms/tile, so SIZE THE BUDGET BY MEMORY, NOT UPLOAD TIME.
      THE REAL COST IS TILE PRODUCTION, three orders larger: ~500 ms mean per tile in the stub (50-110 s
      to fill a screen); even at a hypothetical 10 ms server-side, 208 tiles is 2 s. THAT is what
      T-438/T-440 design against.
      F1 - §6.2's V0 FLOOR IS WRONG AND RE-WELDS THE AXES. Its V0 time cell is 128 s against a 120 s IQ
      retention window, so THE ENTIRE LIVE VIEW FITS IN ONE TIME CELL. And every realistic pane is
      finer than 128 s, so level_t pins at 0 and the de-welding buys nothing on the axis it was
      introduced for. Extend the ladder DOWNWARD to the store's own floor (6.25 kHz x 1 s), which is
      what the spike ran on. THE FLOOR IS THE DECISION, NOT THE RATIO.
      F2 - /api/history treats a per-axis budget as a LEVEL SELECTOR: same window, only max_f changed,
      384 -> 100% observed but 256 -> 67%. Tightening the FREQUENCY budget 1.5x cost 34x of TIME
      resolution and turned a third of the window grey. A grey-honesty violation caused by level
      choice, which §4 does not name because §4 guards the fold and the fold is fine. /api/timeline
      does not have it (T-426's finest-ward walk), so T-438's route is /api/timeline's engine plus
      /api/history's t0/t1.
      F3 - AN UNDERSIZED CLIENT TILE BUDGET MAKES THE SURFACE LIE: below budget ~ working set,
      101-198 tiles per frame render GREY, and grey is this surface's load-bearing claim that the radio
      never looked there. T-440/T-441 must distinguish NOT-RESIDENT from UNOBSERVED.
      F4 - AFTER A RETUNE THE PYRAMID STOPS RECORDING, PERMANENTLY -> filed as T-446 (high).
      KEY CORRECTION: it needs `device` and `scheme`. §6.3 already says coverage is device-local;
      §8.3's four-part key omits it, and retrofitting a key is the expensive kind of change.
      §8.5 OVERSTATED THE ANTI-DIVERGENCE CLAIM: pane A, pane B and the minimap at the SAME level
      sample bit-identical pixels, but the guarantee is "same ramp, same scale, stated level", not
      "same picture" - two viewports at different levels legitimately differ, and the minimap is nearly
      always at a different level. The fix is to state the level per pane, not hide the difference.
      Self-inflicted lesson it recorded: its first minimap comparison failed because a translucent
      pane-viewport wash was drawn over the sample point - an overlay tinting a measurement, exactly
      the defect class this surface exists to prevent, reappearing inside the spike proving it.
      T-343 needs no change; pause/follow worked first try and T-442 needs nothing new.

  - id: T-438
    milestone: MCANVAS
    title: The tile route, addressed by independent (level_f, level_t) - docs/16 step 5 under de-welded axes
    status: done
