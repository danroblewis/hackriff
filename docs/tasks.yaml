      its rows=1 case). reduceActivity is deleted, so T-342 should be closed or retargeted at the
      remaining client-side reduction in ui/src/app/explore/inventory.ts rather than re-implemented'
    acceptance: 'USER INVARIANT (CLAUDE.md 2026-09-16). The scrubbable capture-history timeline spans EXACTLY
      the configured recording/retention duration - no more (NOT the longer, lossy spectrum-history retention)
      and no less - and grows or shrinks when that duration is reconfigured. It is itself a DATA DISPLAY:
