    status: todo
    priority: normal
    deps: []
    parallel_group: M3A
    use_cases:
    - SIGNAL-062
    found_by: 'T-243 (2026-09-16), handed on rather than fixed: on genuine bpsk at
      20 dB the ALRT scored qam64 -5.8 > qam16 -9.4 > 8psk -12.0 > qpsk -23.7. The
      1/M term (ln 64 ~ 4.2 nats) is swamped by distance penalties of tens of nats,
