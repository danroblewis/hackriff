  - id: T-321
    milestone: M2-hardening
    title: A purely analogue emitter now sits exactly on the shared-field floor, so one field dropping out
      stops it clustering entirely
    status: todo
    priority: low
    deps:
    - T-309
    parallel_group: M3B
    model: opus
    acceptance: 'T-309 removed period_s, duty_cycle and burst_length_s from CLUSTER_FIELDS because they
      measure the watch rather than the emission. It recorded the reach cost rather than hiding it: of the
      ~10 cluster-eligible fields a real run produces, 7 survive, and a purely analogue emitter (family
      + bandwidth + class) now sits EXACTLY on CLUSTER_MIN_SHARED_FIELDS = 3. That is sufficient today and
      has no margin: if CLASS fails to measure on some run, such emitters silently stop clustering altogether
