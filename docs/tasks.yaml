      likelihood or state with numbers that a known-SNR ALRT cannot work at this
      geometry and recommend removing it for psk-qam rather than leaving a stage
      that always prefers the largest constellation. Every ADR-0016 floor holds
      unchanged; confidently-wrong must stay at zero'
    area: crates/hk-classify/src/verify.rs (psk_qam_loglikelihoods)
    needs: none
    model: opus
    effort: medium
    core_interface: false
    located_by_t286_2026_09_16: 'T-286 reproduced this in a PURE DISTANCE TEST with no
      likelihood in it: every class fits qam64 best, genuine BPSK and QPSK included, and
      genuine QPSK own residual is 7.6 N0 where a synced member sits near 1. That locates
      the pathology in the SMEARED INPUT, not in the ALRT derivation - an M-th power
      estimate removes constant phase but not residual carrier FREQUENCY offset, which
      smears the constellation into a ring. So this ticket is likely closed by carrier
      recovery rather than by reworking psk_qam_loglikelihoods.'
    remeasured_by_t291_2026_09_16: 'NOT CLOSED, and the attribution above is WRONG.
      T-291 ablated the generator: with lo_offset_hz = 0 - no carrier offset at all - the
      residual is unchanged (QPSK 16.29 vs 16.08 N0 at 30 dB), and a control waveform with
      zero CFO reproduces the whole pathology. After T-291 fixed a real symbol-sampling
      defect in verify::symbol_samples the monotone behaviour is UNCHANGED: bpsk {bpsk 5,
      qam64 29}, qpsk {qam64 36}, qam16 {qam64 33}, pi4-dqpsk {8psk 3, qam64 29}, apsk16
      {qam64 36}, genuine QPSK residual 7.849 N0 against T-286''s 7.6. The cause is that
      the SYNTHETIC GRID distorts psk-qam waveforms before any receiver sees them: an
      exhaustive oracle over sps +-2%, tau over a full symbol and three roll-offs cannot
      get the shipped grid below 12.35% EVM while reaching 1.29% on a clean control. So
      this ticket is blocked on T-294, not on carrier recovery, and the ALRT derivation is
      still not implicated.'
    attribution_corrected_by_t291_2026_09_16: 'T-286 located this in the SMEARED INPUT
      and attributed the smearing to residual CFO. T-291 refuted that by ablation. The
      smearing is in the GENERATOR, not the receiver: an exhaustive oracle over symbol
      period, timing phase and roll-off cannot get the shipped psk-qam grid below 12.35 %%
      EVM while reaching 1.29 %% on a clean control, so those waveforms sit ~15 N0 from
      their own constellation before any receiver touches them. T-246 stays OPEN and is
      blocked by T-296, not by the ALRT derivation.'

