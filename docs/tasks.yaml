      0.75-1.00) while family-level analog is fine'
    status: done
    priority: normal
    deps: []
    parallel_group: M3A
    use_cases:
    - SIGNAL-062
    found_by: 'T-206 (2026-09-16), the M3 exit gate, reported alongside the verdict'
    acceptance: 'establish why cw and ssb are named wrongly within a correct analog
      family call, and either fix the class call or state with measured evidence that
      these classes are not separable at this geometry and should abstain at class
      level rather than answer wrongly. Family-level floors must not regress; no
      confident wrong answers'
    area: crates/hk-classify (analog class call)
    needs: none
    model: opus
    effort: medium
    core_interface: false
    commit: ca40832
    result: |
      FIXED, and the cause was not a threshold that needed tuning - it was two
      conjunctions that could not fire.
      `analog_classes` was the last hand-written within-family score table in the tree.
      `cw` required sigma_af < 0.02, written from noiseless physics (a keyed carrier has
      essentially no frequency excursion). The IF estimator is NOISE-LIMITED: measured
      sigma_af on that same keyed carrier is 0.170-0.207 at 10 dB, 0.068-0.092 at 15,
      0.038-0.050 at 20 - a clean 1/sqrt(rho) law that does not reach the bound until
      ~28 dB, 18 dB ABOVE THE GATE. So the conjunct never fired and `cw` scored the 0.05
      floor against `am`'s 0.1, at every bin.
      `ssb` lost an EXACT TIE. `am`'s "there is a carrier" term was carrier_line_db > 14,
      but that feature is a CFAR strongest-line statistic (T-404), not a carrier
      detector - a suppressed-carrier SSB emission's loudest audio tone reads 28-40 dB
      on it. Both conjunctions fired at 0.7 and the tie broke ALPHABETICALLY. That is
      why ssb's top-2 was 0.75/0.58 while its top-1 was 0.000: the right answer was
      present and ranked second by nothing but its name.
      The fix is not abstention - the evidence was already fitted and unused.
      `psk_qam_classes` becomes `density_classes` and analog routes through the same
      per-class densities. Measured BEFORE any change, their arg-max over the five
      analog classes scored 168/180 on the blind seeds, cw 36/36 and ssb 36/36,
      margins 25-60 nats.
      The residual was entirely at 10 dB and entirely `am` read as `ssb` (at that SNR an
      AM envelope's troughs go into the noise and its carrier stops dominating its band).
      A margin threshold cannot cut it - wrong calls reach 11 nats, correct ones fall to
      2.9 - so analog takes class_gate_db 0.0 -> 3.0, from a dev-only 1 dB sweep:
      0.733 correct at 10, 0.883 at 11, 0.983 at 12, EXACT from 13 up, and exact at
      every step above. Same margin fsk and ook-ask already carry.
      ADR-0016 §2 guessed `wfm/nbfm/am +0; ssb/cw +5`. Wrong on both counts: the
      per-class form was never implementable (FamilyThresholds has ONE gate per family),
      and it named the wrong fragile class - ssb and cw are exact from 13 dB and `am` is
      the one that needs the margin. The row now carries the measurement.
      BINDING NUMBER: analog class wrong-label at and above the gate 0.3500 -> 0.0056
      (1 snippet in 180). cw 1.000 -> 0.000 at +5 and +10; ssb 1.000 -> 0.083 and
      0.917 -> 0.000.
      Family-level numbers BIT-IDENTICAL to main: top-1 0.9345, top-2 0.9861,
      wrong-label 0.0040 overall / 0.0026 at gate / 0.0333 worst bin. The class call
      runs after the family is decided and writes only Classification::class, so no M3
      floor can move.
      Analog class top-1 0.4556 -> 0.6167. The gate bin itself now abstains, taking
      every wrong name in it - the trade the ticket allowed: abstention costs top-1 and
      does not cost wrong-label.
      class_guess loses its obw_hz parameter - it existed only for the wfm/nbfm split
      the removed table made at obw_hz > 100e3, and the densities separate those two on
      their own (36/36, 35/36).
      New blind regression `the_analog_class_call_is_right_or_absent_but_never_
      confidently_wrong` pins PROPERTIES not numbers: every analog class is nameable,
      class wrong-label <= 0.05, and below the gate the name is withheld with a reason.
      Follow-up filed as T-422 (fsk and qam16 have the same shape of defect).

