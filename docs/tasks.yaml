      state the floor once - a transcription duplication, not a threshold change. Since
      false_known = 1 - recall, the survivor is false-known <= 0.10, i.e. unknown recall >= 0.90;
      the stated 0.80 is deleted. Applied to ADR-0016 section 7 (row + amendment note) and to
