  - id: T-335
    milestone: M2-hardening
    title: characterise uses emitter.count as a change detector, so an entry that just absorbed a partner
      by a discounted merge can skip re-characterisation
    status: todo
    priority: low
    deps:
    - T-329
    parallel_group: PIPE
    model: sonnet
    acceptance: Named by T-329 while deciding the sighting semantics, pre-existing and not caused by it.
      TrackInventory::characterise skips work when emitter.count is unmoved. But T-082's same-emission merge
      discounts overlapping observations - correctly, since overlapping observations are not counted twice
      - so an entry that has just ABSORBED a partner can come out with its count unchanged and therefore
      skip re-characterisation, even though its evidence just changed. The count is a proxy for 'something
      happened', and a merge is something happening that the proxy cannot see. Use a signal that actually
      tracks the evidence (a version, a dirty flag, or the merge itself) rather than a count. Narrow change;
      do not alter what count MEANS - T-329 settled that it is a lifetime total of occurrences, not of writes
    evidence_from_t336_2026_09_16: 'T-336 proved this defect is REAL rather than theoretical, and
      that its own change makes it worse. TrackInventory::characterise skips an entry whose sighting
      count has not moved - count as a proxy for ''a measurement arrived''. Once T-336''s cross-producer
      discount could take a sighting''s contribution to 0, TWO acceptance_m3 signature/cluster scenes
      FAILED on its branch while passing on main. T-336 made the minimum change to land - the skip
      key is now (count, fingerprint observations), the fingerprint counter moving once per folded
      measurement, which is exactly the bound the skip documents - and explicitly did NOT redesign.
      THIS TICKET STILL OWNS THE REDESIGN: a merge whose discount adds 0 still leaves BOTH halves
      of that key unmoved, so an entry that just absorbed a partner can still skip re-characterisation.
      Use a signal that tracks the evidence (a version, a dirty flag, or the merge itself) rather
      than any count-shaped proxy. Do not change what count MEANS - T-329 settled that it is a lifetime
      total of occurrences, and T-336 made the implementation match'

  - id: T-336
    milestone: M2-hardening
    title: The final arm of resolve counts within a producer and never asks whether another producer already
      counted the span
    status: done
    commit: e0a1068
    priority: normal
    deps:
    - T-329
    parallel_group: PIPE
    core_interface: true
    model: opus
    acceptance: 'T-329 named this gap and deliberately left it: the last arm of resolve in crates/hk-model/src/repo/cluster.rs
      adds a sighting''s count in full, scoped WITHIN a producer, and never asks whether a different producer
      already counted that span. That is exactly how main scored one continuously-transmitting station as
      2 - the chain counted it and the tracker counted it again. On the post-T-316 tree the two land in
      separate entries and T-082''s same-emission link discounts the overlap, so the symptom is gone, but
      the arm is still willing to double-count whenever two producers'' observations DO resolve to one entry
      by fingerprint. Add the cross-producer overlap check. THIS CHANGES THE COUNTING CONTRACT, not one
      caller: every track sighting goes through that arm, so re-measure what moves and say so. The rule
      to preserve is docs/07 2.11 and ADR-0017: emitter.count is a lifetime total of OCCURRENCES - times
      the emitter was observed to be on the air - and overlapping observations are not counted twice, whoever
      observed them'
