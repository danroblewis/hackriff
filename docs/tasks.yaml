    parallel_group: CANVAS-BE
    core_interface: true
    model: opus
    deps: [T-434, T-423]
    use_cases: [AWARE-011, AWARE-042]
    found_by: 'MCANVAS decomposition (user directive, 2026-09-17)'
    acceptance: |
      docs/16 §7 step 5, re-scoped by §8. GET /api/tiles/... addressed by
      (device, level_f, level_t, f_index, t_index) - INDEPENDENT axis levels, not one zoom.
      Coarse levels served from the existing seal path; the finest level computed on request under
      the chunked-lock discipline, with §5.5's in-flight cap as ingest backpressure. Plus the
      events AGGREGATE form from §5.3 for coarse zooms.
      WHY IT IS ONE ROUTE AND NOT TWO: §7 step 5's own reason - because the bars are projections of
      the same pyramid, one route is what stops the panes and the minimap ever disagreeing on one
      screen. Under §8 that argument gets stronger, not weaker: every pane, the minimap and the
      live edge are the same surface at different levels.
      INHERITS AND MUST NOT REBUILD: T-434's independent-level addressing; T-421's grid_over and
      `coarsen` (a SUM, not a max); T-423's per-cell coverage and the fourth state "unknown" as a
      VALUE with a horizon block - never spelled grey; T-426's overview_levels, where adequate is
      a CEILING not a target and the adequate tiers are a RUN of the ladder.
      docs/api.md and crates/hk-cli/tests/api_contract.rs move TOGETHER (T-079). Assert the FIELD'S
      VALUE, not the response shape (T-315's standard).
      DoD: a tile is addressable at independent f and t levels; the served response states which
      levels actually answered (T-426's rule: the tier that ANSWERED, not the one implied);
      coverage and honesty tier ride along; in-flight cap enforced and asserted.
    notes: |
      TESTING PROTOCOL (CLAUDE.md, after T-416/T-426/T-430 each stalled on it): the agent runs
      TARGETED tests only - `just test-crate <crate>` or `just test-one <name>` for what its diff
      touches - and HANDS BACK when they pass. NEVER `just gate`, never the full suite. The
      COORDINATOR runs the full gate once, at merge. A full gate takes 7-25 minutes here and the
      harness backgrounds it at its 600 s cap, so an agent that waits on one ends its turn stalled
      with uncommitted work.
      SCHEDULING, verified from the dependency graph 2026-09-17: THIS TICKET IS THE FAN-OUT POINT
      of the whole milestone. The chain is T-434 -> T-438 -> {T-439, T-440} -> {T-441, T-442} ->
      {T-443, T-444} -> T-445, so nothing else in MCANVAS can start until T-438 lands, and the
      moment it does, TWO tickets become startable at once.
      The graph also caps useful parallelism at about THREE concurrent agents (two milestone
      tickets plus the spike), never four - so one build slot will be spare for most of the
      milestone. Per the user's directive that slot goes to backend the canvas needs or to
      gate-health that unblocks it (T-436 is the standing candidate: the suite is green at
      --test-threads 8 and flaky at nextest's default 28, which costs a re-run on most merges).
      Do not let that spare slot pull in unrelated work; the freeze on non-canvas work stands.
      T-437's spike is proving the client half against a stub. Coordinate through the coordinator
      rather than guessing at its shape - if the spike wants a different addressing, that is a
      finding worth having before this hardens.
    commit: f1981be
    result: |
      DONE - the MCANVAS fan-out. GET /api/tiles?level_f&level_t&f_index&t_index[&scheme][&device][&cells],
      keyed (device, scheme, level_f, level_t, f_index, t_index).
      `scheme` IS THE LATTICE THE ADDRESS IS EXPRESSED IN, and it is what makes "no such node"
      answerable rather than theoretical: scheme=view is the de-welded lattice; scheme=<n> reads a
      store scheme's own levels off T-434's f_axis()/t_axis(), so A WELDED LADDER IS THE DIAGONAL OF
      ITS OWN LATTICE and scheme=1&level_f=0&level_t=3 is a 404 whose message says why. Never a snap.
      `device` is whose coverage decides this tile's grey (§6.3, device-local).
      IT ALSO FIXED F1, because the floor is an addressing decision: the view lattice's node (0,0) is
      THE OPEN PYRAMID'S OWN LEVEL-0 CELL, not §6.2's 100 kHz x 128 s. Asserted - t_cells_ns[0] == 1 s.
      F2 AVOIDED BY REMOVING THE SURFACE: there is NO caller-supplied per-axis cell budget on this
      route. The grid is always exactly cells x cells on the tile's own extent - THE ADDRESS IS THE
      BUDGET - so coarsening level_f leaves the time cell bit-identical (asserted twice). Level chosen
      FINEST-AFFORDABLE-FIRST, never coarsest-adequate, so folding cannot grey a cell the finer level
      holds; only replication is a claim, stated per axis and downgrading the tier.
      T-426'S WALK DIRECTION INVERTS FOR THIS ROUTE and §7 step 5 does not say so: /api/timeline prefers
      coarsest adequate and walks finer, a tile must prefer finest affordable and walk coarser because
      eviction hits the finest first. Getting it backwards would have reimported F2.
      Candidates ordered by CELL AREA explicitly - T-434's index-order warning became a test on a real
      4x4 lattice where index order puts a time-coarser node first.
      MEASURED TILE PRODUCTION through the real store and fold: 11.4 ms per 256x256 tile, 1.1 ms at
      64x64, 851968 source cells in 10 lock holds at 149 ms chunked. A 208-tile screen is ~2.4 s, so
      the spike's "hypothetical 10 ms server-side" was nearly exact.
      Both caps real: chunked by whole output rows with the history lock RE-ACQUIRED PER CHUNK so a
      live-edge fan-out cannot lock ingest out for a whole tile; TILE_MAX_IN_FLIGHT = 4 refused as a
      503 NAMING THE CAP.
      FOUND: §6.2's V0 is unbackable at the COARSE end too (a 3.28 GHz x 48-day tile needs 32768
      frequency cells at scheme 1's coarsest and no finer level is affordable) - servable only because
      of chunking, and the real gap is that NOTHING OPENS A VIEW-SCHEME INSTANCE YET, which is T-439's.
      §5.3's aggregate cannot live on the tile response even as a field (a tile's value is
      immutability, counts change on every append) - it is on /api/tiles/events. And de-welding costs
      the percentiles at the API boundary too: grid.percentiles reaches the wire as `unknown`.

  - id: T-439
    milestone: MCANVAS
    title: Live-edge tiles - "live" is the finest level growing where hardware is tuned, not a separate mode
    status: in-progress
    priority: high
    parallel_group: CANVAS-BE
