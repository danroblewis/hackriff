      if a floor DOES move, that is itself the finding - stash the whole diff, re-run on
      merged main, and compare before reporting (T-419's method, T-415).
      Pin PROPERTIES not numbers, as T-249's regression does.
    notes: |
      Read T-249's result field first - it is the worked example for this ticket, and
      the two causes it found are the two hypotheses to test.
    commit: 5a717f1
    result: |
      FIXED - and TWO OF THE THREE WERE NOT WHERE MY BRIEF SAID. All three showed T-249's tell
      (healthy top-2 0.917-1.000 against a dead top-1) but lost the ranking in three DIFFERENT
      places.
      fsk/gfsk WAS the hand table, as predicted. `smeared = if_bimodality < 0.66` had to fire to
      score gfsk 0.5 instead of 0.12. Measured at gate+5/+10: gfsk 0.695-0.833, 2fsk 0.785-0.906 -
      OVERLAPPING, and both ENTIRELY ABOVE 0.66. Never fired; no snippet was ever called gfsk by
      the tree. THE DIMENSION: if_bimodality does not distinguish Gaussian shaping from
      rectangular keying, because C13's +/-0.75xOBW99 channel filter has already smoothed both -
      the constant was written at the TRANSMITTER, the feature is measured AFTER THE RECEIVE
      FILTER.
      fsk/msk was NOT THE TREE, which named it correctly at 0.917. The POST-SYNC VERIFIER
      re-ranked it away. Its hypothesis fixed peak deviation at pi/(2*sps), the transmitter's
