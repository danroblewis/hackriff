  - id: T-345
    milestone: M4
    title: 'NXDN Type-C is identified but not decoded: the FSW is verified, the CAC layout is not, and a
      channel number needs a configured map anyway'
    status: done
    commit: 993dbfb
    priority: normal
    deps:
    - T-271
    parallel_group: M4C
    model: opus
    acceptance: 'T-271 verified NXDN''s frame sync word 0xCDF59 BY ARITHMETIC - it decodes to -3,+1,-3,+3,-3,-3,+3,+3,-1,+3
      under the standard dibit map, reproducing the published symbol sequence exactly - and then decoded
      nothing from it, because the CAC''s FEC and CRC layout could not be corroborated. That is the right
      shape: identified is not decoded, and claiming a grant from an uncorroborated layout is how a convincing
      wrong answer gets written. Two things must both be solved to finish it. FIRST, corroborate the CAC
      layout against an independent reference, with arithmetic where possible (T-271''s own standard: check
      a property the value must satisfy, not just a table someone typed). SECOND, and this is the structural
      half: a Type-C channel number needs a CONFIGURED channel map or base/step, because the air does not
      carry one - so even a correctly decoded grant usually resolves to nothing, exactly like DMR''s LPCN.
      Do not invent a default map. If it resolves to nothing, say so with a reason the way T-271''s no-channel-parameters
      does'
  - id: T-346
