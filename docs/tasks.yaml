  - id: T-403
    title: A station with no pilot and no identity still confirms at the end of the recording
    milestone: M3
    status: done
    priority: high
    parallel_group: M3A
    core_interface: true
    model: opus
    deps: [T-398, T-401]
    acceptance: |
      T-401's harness made this visible the moment it existed, which is the harness
      earning its keep. A station with NEITHER a pilot to lock NOR an identity to
      decode confirms at 14.00 s in a 14 s scene - THE END OF THE RECORDING, whatever
      its length - via "continuous and trusted: 14.0 s on air".
      T-398 found that route B is weighed only on track close, and short-circuited the
      PILOT-LOCKED case (route C). The continuous-and-trusted route itself is still
      close-only, so a signal with no fast evidence available still waits for the idle
      timeout. T-398 fixed the case it could prove; this is the rest.
      T-401 deliberately REPORTS this rather than asserting it: bounding it would make
      the suite red for a defect that ticket does not fix, and loosening the bound to
      fit would enshrine it. So it prints under "REPORTED, NOT ASSERTED" with the
      reason. WHEN THIS LANDS, TURN THAT INTO A BOUND - the reported line is the
      pending assertion, not a permanent exemption.
      THE DANGER IS THE SAME AS T-398's, and sharper here. Route C could demand a lock
      because a lock is positive evidence. A station with no pilot and no identity
      offers only continuity and duty cycle, which are exactly the things a strong
      artefact also has - our own reference harmonic is continuous with duty cycle
      1.00. So evaluating route B live must not become "confirm anything that stays
      on": the receiver-wide survey (T-394/T-399) now runs per capture state and can
      say whether a continuous line is the receiver's, and that is the discriminator
      to reach for before loosening a threshold.
      Report the false-confirm rate against ADR-0016 section 7 and run
      just acceptance-milestones. No floor moves.
      MERGED AND REVERTED (coordinator, 2026-09-16, main green at 0465926). The work
      is good and the latency result stands - 14.00 s to 3.00 s on all five seeds - but
      ROUTE B RACES T-398's ROUTE C. I gated the branch (acceptance 48 passed), committed,
      and the same 48 tests then gave 47 passed / 1 failed on main:
      confirm_latency::t398_pilot_locked_wfm_confirms_within_seconds - "with no RDS on air
      the only available route is the verified emission", got "continuous and trusted".
      Same code, different outcome across two runs: the routes race and route B sometimes
      reaches Confirmed first on a PILOT-LOCKED station.
      WHY THIS IS DESIGN, NOT A TEST TO UPDATE: T-398's assertion encodes an intent - a
      pilot-locked WFM station should be confirmed BY ITS PILOT LOCK, which is positive
      evidence that it IS WFM. Route B confirms on continuity + width + zero-suspect,
      which is real but WEAKER IN KIND: "something modulated has been on air steadily",
      not "this is an FM broadcast station". If B wins the race, the reason recorded on
      the emitter is the weaker one even when the stronger was available.
      AND THE "NO SECOND TICKET" CONCLUSION IS CONTRADICTED BY MEASUREMENT: with T-402's
      realistic 75 kHz-deviation scene on top of this branch, confirm is 3.00 s (the fix
      works) but FAMILY ASSIGNMENT IS 5.00 s against T-401's 4.0 s budget - detect 0.00s,
      family 5.00s (fm-broadcast), 159 kHz wide (34 analysis bins). T-403 predicted family
      1.00 s from its own 155 kHz composite; the real scene disagrees by four seconds.
      Agent resumed with both. The second must NOT be resolved by widening the 4 s bound:
      if the bound was calibrated on an unrealistically narrow scene, that is the user's
      call to re-derive, not ours.

  - id: T-404
    title: Six more features measure the observation, and three of them are one defect
    milestone: M3
    status: done
    priority: high
    parallel_group: M3A
    core_interface: true
    model: opus
    deps: [T-313]
    acceptance: |
      T-313's guard found these on its FIRST RUN, each with a measurement. They are
      exempt by name today so the guard can pass; the exemptions are the work list.
      ONE DEFECT, THREE DIMENSIONS: c20_norm, c40_norm, c42_norm. C20 = mean(x^2) is a
      COHERENT SUM, so its loss is residual CFO times record length - one pulse
      waveform reads 0.825 / 0.801 / 0.737 / 0.079 down the truncation ladder with
      derotation identical at every rung. c40 is the same sum at 4x the offset
      (3.20 -> 16.73). c42 subtracts |C20|^2 and so inherits it ALGEBRAICALLY: 93% of
      its movement attributed to the C20 term on one ook waveform. Fix the coherent-sum
      bias once and three exemptions vanish together.
      cp_corr: a max over 11 lags, so for the 20 non-OFDM classes its NULL level falls
      as 1/sqrt(record) - 0.535 / 0.440 / 0.110. A maximum of more samples of noise is
      larger; that is the estimator, not the signal.
      if_slope_r2: one wfm reads 0.440 over 5430 samples and 0.790 over the first 678.
      A wideband FM carrier looks like a linear chirp once you stop watching it.
      if_local_modality: nbfm 1->2, gfsk/msk/2fsk 2->4, ook 1->3 off a 48-bin histogram.
      NOTE THE HISTORY: T-298 added this as the LENGTH-FREE REPLACEMENT for if_modality,
      and the replacement inherited the defect through its ESTIMATOR instead of its
      reference. A replacement is not a fix until it is measured.
      carrier_line_db: peak-over-median, both order statistics, so biased in the segment
      count T-312's pin leaves moving - 17.9 dB on one 2-FSK prefix, on a ~20 dB
      dimension. T-312 knew it was leaving this residue; it is now measured.
      DoD: each dimension either fixed (and removed from the exempt list, which is how
      the guard reports progress) or reclassified BY NAME as an observation statistic
      with the reason. Re-measure section 7; no floor moves. Expect the honest direction
      to be further small drops as more leakage is withdrawn - T-312 cost 0.008 of top-1
      and that was a GOOD result.
  - id: T-405
