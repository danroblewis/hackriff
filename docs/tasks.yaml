    acceptance: |
      docs/16 §8.1's leap, made real: THE LIVE VIEW IS ALSO JUST A VIEWPORT onto this surface, so
      "live" is the finest-level growing edge where hardware is currently tuned. There is no
      separate live-vs-history path to keep consistent, which is the whole point - the seam
      between them is what has produced years of divergence bugs.
      The live chain must write finest-level tiles for tuned ranges as capture proceeds, at the
      growing edge, WITHOUT blocking the live path. T-406 established the pattern for the
      accumulation side: a dwell step writes ONE RECORD PER STEP with its true band and interval,
      because a coarse record spanning a pass rasterises as "the whole band, the whole time".
      Apply the same honesty here: a tile at the live edge covers exactly what was sampled.
      MUST NOT: block or slow capture, the ring, or detection (the always-on invariant); invent a
      cell that was not measured; or write a partial tile that reads as complete. §5.4's fourth
      state and T-423's "unknown" stay available and stay distinct from grey.
      DoD: a replay through the mock SDR produces finest-level tiles at the growing edge that a
      pane can read with no live-specific code path, and the always-on invariant is asserted (ring
      and detections keep advancing while tiles are written).

