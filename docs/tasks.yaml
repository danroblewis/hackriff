  - id: T-078
    milestone: M0b
    title: Potential vs confirmed signal inventory (candidate/confirmed/deleted, auto-confirm, recurrence stats, promote/delete API)
    status: done
    commit: "a5a1854 (merged 511651d; verified with nextest just test: 917 passed, 5 skipped in 126.9 s, whole just test 180.5 s; lint, py, ui, acceptance 22 passed 1 ignored)"
    result: "lifecycle_state candidate/confirmed/deleted with append-only history (new/previous state, auto|user, actor = rule id hk-pipeline/confirm@1 or token fingerprint, reason, time); never back to candidate; only users delete. Auto-confirm (ConfirmPolicy defaults): decoded transmitter identity from >= 1 CRC-valid decode (blind other:hk-framing signature excluded), or one closed track >= 2 s on air, duty >= 0.8, <= 50 % suspect, >= 1 trust-confirmed detection. Delete hides the entry but keeps row/detections/tracks/links/history (visible with state=deleted); clustering ignores deleted entries so re-detection creates a new candidate; a held decoded identity moves to the new entry; no undelete. API: GET /api/inventory?state=candidate,confirmed,deleted (default candidate+confirmed) with state, lifecycle and recurrence (occurrences, appearances, span, on-air, duty, last 8 appearances); GET /api/inventory/{id}; POST /api/inventory/{id}/promote and DELETE /api/inventory/{id} with optional {reason}, Bearer, audited inventory_promote/inventory_delete, {error, code} 400/404/503. Old databases gain the column/table on open. Mock-SDR e2e: 101.3 MHz FM auto-confirms (continuous track + RDS PI decode); FSK sensor (duty ~0.22) stays candidate, promote -> confirmed, delete leaves list, later capture -> new candidate. hk-model 5, hk-api 3, confirm-rule unit test."
