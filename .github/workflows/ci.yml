name: ci

# No hardware and no network beyond toolchain/package installs. The `gpu` feature stays off.
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # uv must exist before cargo test: the hk-e2e harness generates synthetic IQ via py/.
      - uses: astral-sh/setup-uv@v6

      - name: cargo test
        env:
          HK_E2E_REQUIRE_SYNTH: "1"
        run: cargo test --workspace

      - name: python tooling tests
        working-directory: py
        run: uv run --locked pytest
