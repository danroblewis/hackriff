name: ci

# No hardware and no network beyond toolchain/package installs. The `gpu` feature stays off.
# T-912: the merge gate is the check tier only. `test` (check phase) runs on every push and PR;
# `acceptance` runs nightly and on demand (release-candidate run), not per push.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

  # T-436: run nextest under its `ci` profile, defined at the end of .config/nextest.toml.
  # That file's DEFAULT profile now caps test-threads at 8, which is calibrated for the dev
  # Mac — 28 logical CPUs of which up to 24 are committed to four concurrent building agents
  # by CLAUDE.md policy. A GitHub-hosted runner is a dedicated 2–4 vCPU container with no
  # co-tenants, so 8 would be 2–4× oversubscription there; the `ci` profile puts it back to
  # nextest's stock one-test-per-CPU, which on that box is already the uncontended number.
  # The profile inherits everything else from `default` (heavy-serial and its membership,
  # the per-test retries), so this changes the thread count and nothing else. `just
  # acceptance-ci` runs under plain `cargo test`, which ignores this.
  NEXTEST_PROFILE: ci

jobs:
  test:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so `just gate` can find the merge base with the PR's base branch.
      # Without the history there is no base to diff against — and the gate then fails closed
      # to the full suite rather than guessing, so a bad checkout costs time, never coverage.
      - uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0

      # Toolchain comes from rust-toolchain.toml (1.93.1 + clippy, rustfmt), so CI cannot drift
      # from the local gate. `rustup toolchain install` with no argument reads that file.
      - name: install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # `just` (this job's two steps are both recipe calls) and cargo-nextest (which `just test-rust`
      # prefers, falling back to plain `cargo test` when it is absent — CI should get the parallel
      # path, so install it). Both are prebuilt downloads via the same action and both pinned so an
      # upstream release can't silently change CI behaviour.
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0,nextest@0.9.144

      # uv must exist before `just lint` — lint-py runs ruff out of py/'s locked dev group (T-352)
      # — and before `just test`: test-py is pytest under uv, and the synthetic-IQ generator the
      # workspace's synth-backed tests call is `uv run --project py`.
      - uses: astral-sh/setup-uv@v6

      # Node for `just test`'s test-ui member: esbuild bundle + tsc --noEmit + the ui/test suites
      # under node:test. ubuntu-latest ships a Node, but an unpinned one — pin the major instead, and
      # 24 is what the dev Mac runs, so CI and local agree. esbuild 0.28 needs >=18, TypeScript 7
      # >=16.20; both resolve per-platform binaries that ui/package-lock.json already lists for
      # linux-x64, so `npm ci` on the runner needs no extra setup. The npm cache is keyed on that
      # lockfile (ui/package.json has no `packageManager` field, so the action's automatic caching
      # does not trigger on its own).
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # T-396: one call to the gate, which decides for itself which suites this diff needs —
      # `just lint` + `just test` for anything touching crates/ or docs/api.md, `just test-ui`
      # alone for a ui-only change, lint-py + test-py for a py-only one, and the full suite for
      # anything it cannot classify. The rule lives in py/hkpy/gate.py, so CI and the agent
      # running the gate locally reach the same verdict on the same diff by construction — the
      # same one-definition principle T-353 applied to lint and T-357 to acceptance, now applied
      # to the choice of which gate to run at all. `--phase check` is this job's half; the
      # `acceptance` job below runs the other half of the *same* decision.
      #
      # This replaces two steps (`just lint`, `just test`), so what they carried still holds and
      # still lives in the recipes rather than here: `just lint` is lint-rust + lint-py (T-346's
      # Python half cannot go missing again), the gate runs it before `just test` so style fails
      # fast and clippy --all-targets warms the cache nextest reuses, and `just test` is
      # test-rust + test-doc + test-py + test-ui with HK_E2E_REQUIRE_SYNTH set inside the recipe
      # (T-358) — its membership list is the gate, so a member added there reaches CI with no
      # edit here. T-077's serial `heavy-serial` nextest group comes from .config/nextest.toml.
      #
      # On a push (rather than a pull request) there is no base ref, so the gate runs everything:
      # main is the branch every other measurement is taken from, and it gets verified whole.
      - name: just gate --phase check
        run: just gate --phase check

  # The acceptance gate (T-024, T-357): the M0 vertical-slice acceptance suite (docs/11 §1.1) plus
  # the hk-e2e harness targets — mock device, Listen, recording, streaming, refinement, the C-stage
  # floor acceptance and the pipeline smoke tests — preceded by a census that fails if any hk-e2e
  # target belongs to no gate list.
  #
  # The gate is the `just acceptance-ci` recipe (reached through `just gate`, below), not a command
  # line kept here. This job used to run
  # `cargo test -p hk-e2e`, which auto-discovers every target in the crate, so the M0 suite it was
  # written for had quietly grown into all fourteen targets — the M2/M3/M4/chirp milestone exit
  # gates included — with nobody ever editing this file. That is T-353's drift with the sign
  # reversed: a private copy of a gate does not stay equal to the gate, whether it checks less or
  # more. Calling the recipe makes the two one definition, and the recipe names its targets
  # explicitly, so a new acceptance suite can no longer enlist itself into CI (nor go unrun: the
  # census fails on a target in no list).
  #
  # The milestone exit gates are `just acceptance-milestones`, run deliberately at milestone
  # boundaries rather than per push — the justfile says why.
  #
  # T-912: this job runs nightly (schedule) and on workflow_dispatch only, not per push; the `test`
  # job is the per-push/PR merge gate. nextest is installed because hk-e2e runs under it (T-631).
  #
  # LFS checkout supplies the real fixtures; uv generates the synthetic scenarios. The recipe sets
  # HK_REQUIRE_FIXTURES=1 and HK_E2E_REQUIRE_SYNTH=1 itself — a missing one fails instead of
  # skipping — so this job holds no copy of that either. readsb is not installed, so only the
  # real-plugin half of SIGNAL-001 skips (logged); its pipeline + plugin-output plumbing still runs.
  #
  # T-396 reached it through `just gate --phase acceptance` rather than folding it into the `test`
  # job's gate call. It stays a separate job deliberately: the two run on separate runners in
  # parallel, so merging them would roughly double the critical path; this one needs no Node while that one does; and "the acceptance census/harness is red" is a different
  # signal from "a unit test is red" and deserves its own check mark. Splitting the *execution*
  # costs nothing in consistency because the *decision* is not split — both jobs call the same
  # classifier on the same diff and differ only in which half of its answer they run, so they
  # cannot disagree about what changed. A ui-only or docs-only PR makes this job a fast no-op
  # that prints why.
  acceptance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 for the gate's merge-base lookup, as in the `test` job.
      - uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0

      # Toolchain comes from rust-toolchain.toml (1.93.1 + clippy, rustfmt), so CI cannot drift
      # from the local gate. `rustup toolchain install` with no argument reads that file.
      - name: install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # ubuntu-latest has no `just`; same pinned prebuilt download the test job uses (T-353).
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0,nextest@0.9.144

      # uv must exist before the recipe: the hk-e2e harness generates synthetic IQ via py/.
      - uses: astral-sh/setup-uv@v6

      - name: just gate --phase acceptance
        run: just gate --phase acceptance
