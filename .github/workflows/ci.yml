name: ci

# No hardware and no network beyond toolchain/package installs. The `gpu` feature stays off.
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # uv must exist before cargo test: the hk-e2e harness generates synthetic IQ via py/.
      - uses: astral-sh/setup-uv@v6

      # T-077: cargo-nextest runs the workspace in parallel, with heavy/timing-sensitive tests
      # (tests/e2e, hk-pipeline listen/retune/lossless/refine/stream, hk-api, hk-cli, hk-core ring
      # stress/concurrency) pinned to a serial group by .config/nextest.toml. Pinned version so a
      # nextest release can't silently change CI behaviour.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.144

      # hk-e2e (harness smoke tests + the M0 acceptance suite) runs in the `acceptance` job.
      - name: cargo nextest run
        env:
          HK_E2E_REQUIRE_SYNTH: "1"
        run: cargo nextest run --workspace --exclude hk-e2e

      # nextest doesn't run doctests.
      - name: cargo test --doc
        run: cargo test --workspace --exclude hk-e2e --doc

      - name: python tooling tests
        working-directory: py
        run: uv run --locked pytest

  # T-024: the M0 vertical-slice acceptance suite (docs/11 §1.1) plus the hk-e2e harness tests.
  # LFS checkout supplies the real FM fixture; uv generates the synthetic scenarios. Both are
  # required here (a missing one fails instead of skipping). readsb is not installed, so only the
  # real-plugin half of SIGNAL-001 skips (logged); its pipeline + plugin-output plumbing still runs.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v6

      - name: hk-e2e and M0 acceptance suite
        env:
          HK_E2E_REQUIRE_SYNTH: "1"
          HK_REQUIRE_FIXTURES: "1"
        run: |
          cargo build -p hk-plugins --bins
          cargo test -p hk-e2e -- --nocapture
