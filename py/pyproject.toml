[project]
name = "hkpy"
version = "0.1.0"
description = "hackriff Python tooling: SigMF fixtures, synthetic IQ, research. Orchestration/research only, never the real-time path."
readme = "README.md"
requires-python = ">=3.11"
# Every dependency is recorded in the ADR-0010 ledger with its licence.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hkpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
