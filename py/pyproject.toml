[project]
name = "hkpy"
version = "0.1.0"
description = "hackriff Python tooling: SigMF fixtures, synthetic IQ, research. Orchestration/research only, never the real-time path."
readme = "README.md"
requires-python = ">=3.11"
# Every dependency is recorded in the ADR-0010 ledger with its licence.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.12.0",
    # MIT. The board test parses docs/tasks.yaml with the SAME strict loader ops/monitor.py uses,
    # so a file the dashboard would reject cannot pass the board test (2026-09-22: T-640's
    # unquoted colon broke the task graph and the "Up next" queue while every textual guard passed).
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hkpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
