<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hackriff Explorer</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- MUI app shell (ADR-0013, T-156): the default UI, served at / (and aliased at /app.html).
     Layout regions follow ui/mockups/explorer-v3.html; every panel mounts into one data-slot and
     owns only that subtree. -->
<div class="app" id="app">
  <!-- T-993: in Explore this bar takes NO pixels (display: none, `chrome/map-layout.css`); its
       controls are MOVED, not copied, into the map's floating chrome (`chrome/top-chrome.ts`): the
       Explore/Decode/History switch and the device state into a small pill, the nudges beside Go-to,
       Review into the top-right cluster and Theme into its ⋯ menu. Decode and History keep the framed
       shell, so the same elements come back here when either is shown. -->
  <header class="bar">
    <div class="brand">hack<span>riff</span></div>
    <div class="modes" role="group" aria-label="View">
      <button class="mode" type="button" data-mode="explore" aria-pressed="true">Explore</button>
      <button class="mode" type="button" data-mode="decode" aria-pressed="false">Decode</button>
      <button class="mode" type="button" data-mode="history" aria-pressed="false">History</button>
    </div>
    <div class="device" id="device" data-state="connecting"><span class="live-dot" aria-hidden="true"></span><span id="device-label">connecting…</span></div>
    <div class="rec-pill" id="rec-pill" data-slot="rec-pill" hidden></div>
    <div class="readouts">
      <div class="ro"><small>Centre</small><b id="ro-centre">–</b></div>
      <div class="ro opt"><small>Span</small><b id="ro-span">–</b></div>
    </div>
    <span class="conn" id="conn" role="status" hidden></span>
    <div class="bar-spacer"></div>
    <form class="goto" id="goto-form" autocomplete="off"><label for="goto">Go to</label><input id="goto" class="mono" placeholder="101.3 MHz" inputmode="decimal"></form>
    <!-- T-409: tuning nudges. A signal on the centre frequency sits on the tuner's own DC/LO
         leakage spike and cannot be cleanly demodulated there; these shift the tuned centre by
         1/8, 1/4 or 1/2 of the span to move it off DC while keeping it in the window. A press is
         an explicit device action (T-343), never a gesture. -->
    <div class="nudge" data-slot="nudge" role="group" aria-label="Tuning nudges"></div>
    <button class="mini" type="button" id="review-btn" aria-pressed="false" aria-label="Review" title="Review: anomalies, device and survey"><span class="rv-ico" aria-hidden="true">⚑</span><span class="rv-label">Review</span><span class="rv-n" hidden></span></button>
    <button class="mini" type="button" id="theme-btn">Theme</button>
  </header>

  <!-- EXPLORE -->
  <div class="main" id="view-explore">
    <!-- T-445 (docs/16 §8.5): ONE surface. The live waterfall, the history render, the frequency
         axis strip and both bespoke edge navigators are retired into a single virtual canvas —
         X = frequency across the device-available range, Y = time — over the coverage tile pyramid.
         Pan and zoom move a viewport; the map strip along its bottom is another viewport at a
         coarse level, with a rectangle per pane and a lit segment per active capture window.
         Live is not a mode: it is the finest growing edge of this same surface (T-439).
         A pan still cannot move the radio — that is a device action on the offer's own button
         (T-343/T-444).
         T-506: the collapsible Capture panel that sat under it is gone. The canvas's time axis
         carries what only it carried: the IQ horizon and the retention bound (two rules across every
         pane), the capture clock (centre/capture-clock.ts) and Record IQ (the canvas bar). -->
    <section class="centre" aria-label="Spectrum surface">
      <div class="surface" data-slot="surface"></div>
    </section>
    <!-- T-803 (MAP-03): the focus panel lives in a non-modal bottom sheet (peek / half / full) that
         floats over the still-live canvas; `chrome/sheet.ts` adds its grab handle and title strip
         around `.sheet-body` without touching the focus slot inside it.
         T-1026: it is the Google-Maps place card — `hidden` until a feature is clicked, so the first
         paint of the map has no card on it and nothing opaque spans the bottom edge. `hidden` is in
         the markup as well as in `sheet.ts`'s first `apply()`, so it is not on screen for the frames
         before the script mounts. -->
    <section class="sheet" data-slot="sheet" aria-label="Selected" hidden>
      <div class="sheet-body">
        <!-- T-997: the inventory lists and the selections under them live IN the sheet now. The
             T-895 chip that opened them as a left-hand overlay sat at mid-height over each pane's
             time ruler; its replacement is two pills in the map's top-left chrome
             (`chrome/inv-pills.ts`), and each pill opens THIS sheet on its list. The `side` slot
             is where the pills mount from; `sheet.css` orders the body. -->
        <aside class="side" data-slot="side" aria-label="Inventory and selections">
          <div class="side-inv" data-slot="inventory"></div>
          <div class="side-sel" data-slot="selections"></div>
        </aside>
        <div class="drawer" data-slot="drawer"></div>
        <aside class="focus" data-slot="focus" aria-live="polite" aria-label="Focused signal"></aside>
      </div>
    </section>
    <!-- T-821 (MAP-21): the Research slide-in — collections as layers, every mark also a row. Opened
         from the map's top-right cluster; a fixed-position panel with a visible close (P1/P3). -->
    <aside class="research" data-slot="research" aria-label="Research: collections" hidden></aside>
  </div>

  <!-- DECODE -->
  <div class="wb" id="view-decode" hidden>
    <aside class="wb-side" data-slot="pipelines" aria-label="Pipelines and recipe"></aside>
    <section class="wb-centre" aria-label="Decoder stages and packets">
      <div class="pipe" data-slot="stages"></div>
      <div class="plots" data-slot="plots"></div>
      <div class="inspector" data-slot="inspector"></div>
    </section>
    <aside class="wb-right" data-slot="params" aria-label="Stage parameters"></aside>
  </div>

  <!-- HISTORY (T-264, ADR-0017 TM-8): the durable all-time catalogue, where Explore is scoped to
       the viewed window. Workflow #3: choose a region and see what was seen there over time. -->
  <div class="hist" id="view-history" data-slot="catalogue" aria-label="History" hidden></div>

  <footer class="dock" data-slot="outputs" aria-label="Live outputs"></footer>
</div>

<aside class="review" id="review" data-slot="review" aria-label="Review" hidden></aside>

<form class="auth" id="auth" hidden>
  <label>API token <input id="token-input" type="password" autocomplete="off" required></label>
  <button class="mini" type="submit">Connect</button>
  <span class="hint">Open <code>hk serve</code>'s printed link, or paste the token from <code>~/.config/hackriff/api-token</code>. It stays in this tab only.</span>
</form>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
