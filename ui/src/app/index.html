<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hackriff Explorer</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- MUI app shell (ADR-0013, T-156): the default UI, served at / (and aliased at /app.html).
     Layout regions follow ui/mockups/explorer-v3.html; every panel mounts into one data-slot and
     owns only that subtree. -->
<div class="app" id="app">
  <header class="bar">
    <div class="brand">hack<span>riff</span></div>
    <div class="modes" role="group" aria-label="View">
      <button class="mode" type="button" data-mode="explore" aria-pressed="true">Explore</button>
      <button class="mode" type="button" data-mode="decode" aria-pressed="false">Decode</button>
      <button class="mode" type="button" data-mode="history" aria-pressed="false">History</button>
    </div>
    <div class="device" id="device" data-state="connecting"><span class="live-dot" aria-hidden="true"></span><span id="device-label">connecting…</span></div>
    <div class="rec-pill" id="rec-pill" data-slot="rec-pill" hidden></div>
    <div class="readouts">
      <div class="ro"><small>Centre</small><b id="ro-centre">–</b></div>
      <div class="ro opt"><small>Span</small><b id="ro-span">–</b></div>
    </div>
    <span class="conn" id="conn" role="status" hidden></span>
    <div class="bar-spacer"></div>
    <form class="goto" id="goto-form" autocomplete="off"><label for="goto">Go to</label><input id="goto" class="mono" placeholder="101.3 MHz" inputmode="decimal"></form>
    <!-- T-409: tuning nudges. A signal on the centre frequency sits on the tuner's own DC/LO
         leakage spike and cannot be cleanly demodulated there; these shift the tuned centre by
         1/8, 1/4 or 1/2 of the span to move it off DC while keeping it in the window. A press is
         an explicit device action (T-343), never a gesture. -->
    <div class="nudge" data-slot="nudge" role="group" aria-label="Tuning nudges"></div>
    <button class="mini" type="button" id="review-btn" aria-pressed="false">Review</button>
    <button class="mini" type="button" id="theme-btn">Theme</button>
  </header>

  <!-- EXPLORE -->
  <div class="main" id="view-explore">
    <aside class="side" aria-label="Inventory and selections">
      <div class="side-inv" data-slot="inventory"></div>
      <div class="side-sel" data-slot="selections"></div>
    </aside>
    <!-- T-340: an edge navigator parallel to each waterfall axis — time down the side, frequency
         along the bottom. Each pans and zooms its own axis; a dragged region on either zooms the
         main view to it. Neither can move the radio: that is a device action (T-343). -->
    <section class="centre" aria-label="Spectrum and waterfall">
      <div class="wfrow">
        <div class="timenav" data-slot="timenav" aria-label="Time navigator: the retained capture window"></div>
        <div class="specwf" data-slot="live"></div>
      </div>
      <div class="axis" data-slot="axis" aria-hidden="true"></div>
      <div class="freqnav" data-slot="freqnav" aria-label="Frequency navigator: the device-available spectrum and every active capture window"></div>
      <div class="capture" data-slot="capture"></div>
    </section>
    <aside class="focus" data-slot="focus" aria-live="polite" aria-label="Focused signal"></aside>
  </div>

  <!-- DECODE -->
  <div class="wb" id="view-decode" hidden>
    <aside class="wb-side" data-slot="pipelines" aria-label="Pipelines and recipe"></aside>
    <section class="wb-centre" aria-label="Decoder stages and packets">
      <div class="pipe" data-slot="stages"></div>
      <div class="plots" data-slot="plots"></div>
      <div class="inspector" data-slot="inspector"></div>
    </section>
    <aside class="wb-right" data-slot="params" aria-label="Stage parameters"></aside>
  </div>

  <!-- HISTORY (T-264, ADR-0017 TM-8): the durable all-time catalogue, where Explore is scoped to
       the viewed window. Workflow #3: choose a region and see what was seen there over time. -->
  <div class="hist" id="view-history" data-slot="catalogue" aria-label="History" hidden></div>

  <footer class="dock" data-slot="outputs" aria-label="Live outputs"></footer>
</div>

<aside class="review" id="review" data-slot="review" aria-label="Review" hidden></aside>

<form class="auth" id="auth" hidden>
  <label>API token <input id="token-input" type="password" autocomplete="off" required></label>
  <button class="mini" type="submit">Connect</button>
  <span class="hint">Open <code>hk serve</code>'s printed link, or paste the token from <code>~/.config/hackriff/api-token</code>. It stays in this tab only.</span>
</form>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
