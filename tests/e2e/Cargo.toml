[package]
name = "hk-e2e"
description = "hackriff end-to-end IQ-replay harness: SigMF fixtures, on-demand synthetic scenarios, stage runner, truth assertions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hk-model.workspace = true
serde_json.workspace = true
# T-627: the corpus hold-out rule is sha256(scene_id || seed) mod 5.
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Capability-stage acceptance tests (T-005 floor: tests/floor_acceptance.rs).
hk-core.workspace = true
hk-dsp.workspace = true
num-complex.workspace = true
# T-024 M0 slice acceptance suite (tests/acceptance_m0.rs): the composed pipeline (`hk replay`'s
# library path) plus the stores, priors, API and stream readers it asserts through. Project
# crates only; no new third-party dependency.
hk-api.workspace = true
hk-context.workspace = true
hk-pipeline.workspace = true
hk-plugins.workspace = true
hk-store.workspace = true
hk-stream.workspace = true
# T-043 Listen acceptance: a WebSocket client for `/ws/open/listen` (already the hk-api dependency).
tungstenite.workspace = true
# T-061 output recordings: the composition's API adapter and the `hk record` client.
hk-cli = { path = "../../crates/hk-cli" }
# T-094 RDS recipe tutorial acceptance: the existing RDS decoder is the oracle.
hk-demod.workspace = true
# T-267 trunking control-channel acceptance: the candidacy/confirmation split under test.
hk-detect.workspace = true
# T-124 M2 acceptance: the recorded bandit vs round-robin scheduler simulator comparison.
hk-sim = { path = "../../crates/hk-sim" }
# T-206 M3 exit gate (tests/acceptance_m3.rs): T-213's evaluation harness and its synthetic
# acceptance grid, so the gate measures accuracy through the same runner T-199's sweep and T-204's
# DL evaluation use rather than a second implementation of the same measurement.
hk-classify.workspace = true
# T-366 the M3 exit gate's ML row (tests/acceptance/m3_ml.rs): ADR-0016 §7's ML clauses as a
# checkable predicate (`hk_ml::exit_gate`), so the gate row is asserted over a real run instead of
# being satisfied by nothing checking it.
hk-ml.workspace = true
